kind: home
title: 首页
description: 首页 = Hero(欢迎屏) + Main(文章列表) + Sidebar(Profile + Tags)
slotOrder:
  - hero
  - main
  - sidebar
slots:
  hero:
    - id: home-welcome
      module: welcome
      config: {}
  main:
    - id: home-recent-posts
      module: recent-posts
      config:
        title: 全部文章
        section: posts
        limit: 0
        showCount: true
    - id: home-map
      module: map
      enabled: false
      config:
        title: 我的位置
  sidebar:
    - id: home-profile
      module: profile
      config:
        compact: true
    - id: home-weather
      module: weather
      config:
        title: 今日天气
    - id: home-quote
      module: quote
      config:
        text: The house of the dead.
        author: ""
    - id: home-music
      module: music
      config:
        title: Lily Radio
        artist: ""
        source: ""
        cover: ""
        playlistId: "2672160214"
        showPlaylist: true
        rememberPlayback: true
    - id: home-tags
      module: tags
      config:
        title: 标签
        limit: 24
        showCount: true
        sort: count
