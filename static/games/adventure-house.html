p12_xinhai:{
  ch:'第一千一百四十一至一千一百五十二章', title:'新海线',
  act:s=>{ if(!s.clues.includes('二十年前的死者陈歌')) s.clues.push('二十年前的死者陈歌'); if(!s.clues.includes('两位凶神')) s.clues.push('两位凶神'); if(!s.employees.includes('吃仁')) s.employees.push('吃仁'); if(!s.employees.includes('常雯雨·苏醒')) s.employees.push('常雯雨·苏醒'); s.grievance+=25; },
  text:'方医生失联。陈歌随王老师、老吴赴新海，接手恶梦学院。\n\n查方医生失踪：老库房纸条"千万别进最后一间库房！"（吃仁所写）。小蝶弟弟胡远被校园霸凌，收到诅咒信封。陈歌扮鬼报复霸凌者，沿诅咒信链条追到源头蓝小晨——从废弃医院偷的空白病例单："这是个病态的世界，为什么你还没有发现？我一定要治好你！"张忆发现蓝小晨记忆被动过手脚。\n\n吃仁供出：被诅咒医院除被张雅吞的千脸凶神外，至少还有两位凶神——院长、姓吃的凶神。活人分四种：百号外病人/白班医生/姓吃的人/不笑。\n\n小孙以苦肉计混入吃姓人，被带入被诅咒医院（婚戒定位）。\n\n陈歌按"新海十大怪谈"刷怪谈喂血石：哭井、外卖厉鬼（收编）、牌楼（红衣怨念聚合体，发现母亲耳环+疑似父亲笔迹信）。<b>常雯雨苏醒</b>，与陈歌交易：做鬼屋员工至医院夷平，给带血眼珠可召唤。\n\n王老师揭秘二十年前连环凶杀案：被害者全是与陈歌体型相似的孩子，最后死者叫陈歌——被白大褂凶手带走，警方抓到的是替罪羊。\n\n陈歌伏杀吃姓凶神之子（脸上只有一张嘴的小孩），活捉关入隧道女鬼儿子门后。回含江发现恐怖屋卫生间血门被从里面推开——留小孩血手印。',
  choices:[
    {label:'噩梦任务·门——祸口', tag:'', inf:'r12_huokou', next:'p12_huokou3'}
  ]
},

p12_huokou3:{
  ch:'第一千一百五十三至一千一百五十四章', title:'祸口',
  act:s=>{ if(!s.talents.includes('祸口')) s.talents.push('祸口'); if(!s.clues.includes('六天赋集齐')) s.clues.push('六天赋集齐'); if(!s.items.includes('自制力钥匙·裂痕')) s.items.push('自制力钥匙·裂痕'); s.grievance+=12; },
  text:'许音主动吞食吃姓凶神的黑纹，众红衣相助，心脏纹路反噬黑纹——此后绝大多数诅咒对许音无效。张忆剥离顶级红衣记忆。\n\n陈歌使用刷新券接取噩梦日常任务——<span class="clue">"门：蒙眼堵耳，凌晨1:44起，推开门并喊出自己的名字。"</span>\n\n陈歌推厕所隔间门，进入门后世界——经历"自己一次次被杀"的绝望记忆。\n\n他听到自己的声音："所有人想杀死我，你是我最后的希望，请你一定要找到我——我在那座城的恐怖屋里。"\n\n对方塞给他一把布满裂痕的<b>自制力钥匙</b>。\n\n任务完成，获得天赋<span class="gift">祸口</span>。集齐殓容/阴瞳/灵嗅/鬼耳/祸口/活偶六天赋——<span class="clue">"已可做出想要的自己。"</span>',
  choices:[
    {label:'血色城市扩张——通灵鬼校被吞', tag:'', inf:'r12_xuecheng2', next:'p12_xuecheng4'}
  ]
},

p12_xuecheng4:{
  ch:'第一千一百五十五至一千一百五十六章', title:'血色城市扩张',
  act:s=>{ if(!s.clues.includes('血色城市吞并鬼校')) s.clues.push('血色城市吞并鬼校'); if(!s.employees.includes('张文宇·助战')) s.employees.push('张文宇·助战'); s.grievance+=15; },
  text:'赴通灵鬼校（毕业证书+血门）——通灵鬼校已被扩张中的血色城市吞并！\n\n老校长受学校意志认可，突破红衣。血城中的红色影子能瞬杀顶级红衣，不进建筑。\n\n陈歌取走画家的遗画（画家与范郁），带走鬼校三位红衣。白猫体内的血丝无法联系高医生——改寻高汝雪。\n\n张文宇（自杀接线员=无数厉鬼集合体，漫画册装不下）答应助战，匿于陈歌身侧。\n\n"血色城市在扩张……"陈歌看向远方："高医生、画家、常雯雨都在那座城里。黑色手机曾在血城最深处出现过——那是我父母留下的手机。"\n\n"下一个目标：被诅咒的医院。"',
  choices:[
    {label:'阶段十二 · 完。四星任务【被诅咒的医院】强制触发', tag:'NEXT', next:'p12_end'}
  ]
},

p12_end:{
  ch:'第一千一百五十七章 · 苏醒', title:'阶段十二 · 完',
  act:s=>{ if(!s.scenes.includes('绝望乐园')) s.scenes.push('绝望乐园'); if(!s.employees.includes('红小姐')) s.employees.push('红小姐'); if(!s.talents.includes('灵嗅')) s.talents.push('灵嗅'); s.grievance+=25; s.tourists+=600; s.reputation=Math.min(100,s.reputation+20); },
  text:'从江源小区的灵嗅，到冥胎九子的捉迷藏，再到血色城市的阴影——陈歌的恐怖屋，已经成了绝望乐园。\n\n阶段十二落幕：\n· 四星试炼<b>冥胎</b>完成（80%），恐怖屋升级<b>绝望乐园</b>，解锁特殊建筑<b>救赎之门</b>与<b>九鸿小区（黑雾的世界）</b>。\n· 天赋：<b>灵嗅</b>、<b>祸口</b>——六天赋集齐，已可做出想要的自己。\n· 员工：<b>张忆</b>（夺忆）、<b>红小姐</b>、<b>戏服红衣</b>、<b>吴金鹏</b>、<b>孙小军</b>、<b>时过</b>、<b>秋蝶</b>、<b>薛容</b>、<b>常孤</b>、<b>常雯雨</b>（苏醒）、<b>红雨衣</b>（正式）、<b>张文宇</b>（助战）入册；许音种下凶神种子。\n· 真相：<b>冥胎=陈歌的影子</b>，被诅咒医院0004号病人；<b>黑色手机的真正目的或为建造血色城市</b>；<b>二十年前的死者陈歌</b>——被诅咒医院曾一遍遍杀死他；父母曾与医院立下"诅咒/约定"。\n· 新海分店<b>恶梦学院</b>开业；<b>血色城市吞并通灵鬼校</b>，高医生/画家/常雯雨皆在城中。\n· 恐怖屋卫生间血门被从里面推开——门内逃出者身份成谜。\n\n白色天花板，消毒水的气味。陈歌睁开眼——他被困在被诅咒的医院里，失去了记忆。四星试炼【被诅咒的医院】，开始。',
  choices:[
    {label:'进入阶段八 · 被诅咒的医院（Ch1157 苏醒）', tag:'四星试炼', next:'p8_start'},
    {label:'回到阶段七尾声', next:'p7_final'},
    {label:'打开黑色手机，查看推理树与新场景', tag:'', next:'__phone__'},
    {label:'回到开篇', next:'start'}
  ]
},

p8_start:{
  ch:'第一千一百五十七章 · 苏醒', title:'你好，病人',
  act:s=>{ if(!s.clues.includes('失忆与第二人格')) s.clues.push('失忆与第二人格'); },
  text:'白色的天花板，消毒水的气味。陈歌睁开眼，发现自己躺在病床上，双腿被束缚带捆着。\n\n"你醒了？"一个穿着白大褂的医生站在床边，面容温和："我是你的主治医生，高医生。你因为车祸伤了头部，加上长期的精神压力，患上了严重的妄想症。""车祸？"陈歌茫然地看着他："我……叫什么名字？"\n\n"你叫陈歌。"高医生翻开病历："你总幻想自己有一座鬼屋，幻想里面有无数厉鬼员工——那都是妄想。你的父母早在一年半前就过世了，车祸。你一个人撑到现在，已经很不容易了。"\n\n陈歌低头看着自己缠满绷带的手。记忆一片空白，只有某个模糊的影子在脑海里一闪而过——红衣、黑发、一张美到窒息的脸。\n\n"那是谁？"他喃喃自语。\n\n"那是你的第二人格。"高医生叹了口气："他叫许音。每次你失控的时候，他就会出来……他差点杀了医院的护工。"\n\n高医生展示了一段监控：画面里的"陈歌"浑身是血，疯狂地攻击护工，眼神陌生得可怕。\n\n"你身体里住着另一个人，陈歌。"高医生收起手机，语气温和却不容置疑："只有配合治疗，你才能战胜他，才能出院。"',
  choices:[
    {label:'记住"许音"这个名字，不动声色', inf:'r8_shiyi', next:'p8_zuohan'},
    {label:'装作恐惧，试探高医生的真实目的', hint:'谨慎路线', next:'p8_zuohan'}
  ]
},

p8_zuohan:{
  ch:'第一千一百六十八章 · 左寒', title:'室友与敲门人',
  act:s=>{ if(!s.employees.includes('左寒·病友')) s.employees.push('左寒·病友'); if(!s.clues.includes('敲门声')) s.clues.push('敲门声'); },
  text:'高医生走后，病房门被推开，一个戴着眼镜的年轻人被护工领了进来——左寒，陈歌的新室友，因为"被害妄想症"被送进医院。\n\n"你就是那个差点杀了护工的？"左寒压低声音，眼神精明得不像个病人："我叫左寒。咱俩住一间，以后有话直说。"\n\n当夜，凌晨一点。走廊传来敲门声——<b>咚、咚、咚、咚</b>，四声，间隔极短。\n\n"听到了吗？"左寒猛地坐起："我搬进来的那天敲了三下，昨晚四下，今晚五下。敲门人每天多敲一下——他在数日子。"\n\n"数什么日子？"\n\n"数你在医院住了几天。"左寒盯着房门："说明这个敲门人，知道病房里住的是谁，知道医院的一切。他每晚都来提醒你——别迷失。"\n\n陈歌心头一凛。他住进来三天，敲门声正好三下。\n\n"左寒，你一个"病人"，怎么会注意到这些？"\n\n"因为我本来就不是病人。"左寒苦笑："我是被硬塞进来的。医院想让我变成真疯子，好让我闭嘴。你呢？你自己信自己是疯子吗？"',
  choices:[
    {label:'告诉左寒：我不信我是疯子', inf:'r8_qiaomen', next:'p8_zhangwenyu'},
    {label:'先不交底，观察左寒是否可信', hint:'试探路线', next:'p8_zhangwenyu'}
  ]
},

p8_zhangwenyu:{
  ch:'第一千一百六十九章 · 张文宇', title:'上万张病历',
  act:s=>{ if(!s.clues.includes('上万张张文宇病历')) s.clues.push('上万张张文宇病历'); if(!s.items.includes('左寒的碎纸')) s.items.push('左寒的碎纸'); },
  text:'第二天，左寒被护工带走做"检查"。陈歌一个人留在病房，目光落在中间那张空床上——左寒搬走前，把什么东西塞在了没人睡的床位枕头里。\n\n几片写满字的碎纸：\n\n· 这所医院第三病区的所有护工都姓"吃"。\n· 夜班医生办公室的柜子里，按日期放着病历。有一天，某格塞满了病历，地上还堆了几大箱——<b>所有病历的患者名字，都是张文宇</b>。上万张，年龄、病症、照片完全不同，只有名字一样。\n· 那天，正好是陈歌昏迷醒来的日子。\n· 部分"张文宇"逃出了医院，护工们都在外面找他们。\n\n"上万个人，都叫张文宇？"陈歌按着太阳穴，一阵剧痛袭来——他强迫自己停止思考。\n\n"如果医院内部的病人记忆都被动过手脚……那还在外面游荡的张文宇们，有没有可能保留了原本的记忆？"陈歌眼睛亮了："他们知道真相！知道我是谁，知道我父母的失踪——他们是破局的关键！"\n\n他小心翼翼把碎纸收好。窗外，一个穿着病号服的女人正在花园里浇花——她抬眼，正好与陈歌对视。\n\n那一瞬间，陈歌心里涌起一股说不清道不明的熟悉感。',
  choices:[
    {label:'记住窗外女人，找机会接触她', inf:'r8_zhangwenyu_bingli', next:'p8_fang'},
    {label:'先查"吃"姓护工的来历', hint:'支线：姓氏之谜', next:'p8_fang'}
  ]
},

p8_fang:{
  st:"sub",
  ch:'第一千一百七十章 · 方医生', title:'喉咙里的人脸',
  act:s=>{ if(!s.clues.includes('方医生喉咙里的人脸')) s.clues.push('方医生喉咙里的人脸'); if(!s.employees.includes('方医生·病友')) s.employees.push('方医生·病友'); },
  text:'新室友被安排进来了——一个四十多岁、头发全白的中年男人，五官科医生出身，因"妄想症"住院。他说自己耳朵里有蜗牛在爬，喉咙里有一个装满药剂的针筒。\n\n"方哥，你喉咙里真有针筒吗？"陈歌凑近："张嘴，我看看。"\n\n方医生犹豫了一下，张开了嘴。陈歌的瞳孔缓缓缩小——阴瞳之下，幽深的食道仿佛一个没有尽头的黑洞。喉咙深处，血肉包裹着一张人脸！\n\n紧闭双眼，脸色苍白，和方医生长得一模一样。\n\n"你喉咙里……"陈歌猛地后退，声音发颤："有一张人脸！跟你长得一样！"\n\n"我喉咙里有人脸？"方医生先是害怕，随即苦笑摇头："看来你的病比我严重得多。人体内怎么可能有人脸？"\n\n陈歌没再争辩。他坐在病床上，盯着方医生："方哥，你说你是五官科医生——那你知道，人的喉咙里，为什么会有一张别人的脸？"\n\n方医生愣住。沉默许久，他压低了声音："我不知道。但我可以告诉你另一件事——这所医院的医生，晚上和白天，完全不是同一个人。"',
  choices:[
    {label:'追问"白天与晚上的医生不同"', inf:'r8_fang', next:'p8_curse_game'},
    {label:'告诉方医生：我看见了真正的"你"', hint:'交心路线', next:'p8_curse_game'}
  ]
},

p8_curse_game:{
  ch:'第一千一百七十二章 · 诅咒游戏', title:'七把椅子',
  act:s=>{ if(!s.clues.includes('诅咒游戏·七把椅子')) s.clues.push('诅咒游戏·七把椅子'); s.grievance+=10; },
  text:'午夜零点，高医生独自推开了病房门："陈歌，治疗室在五楼。方医生，你也一起来。"\n\n五楼，重症病区。不大的病室里摆着七把椅子，三把已经坐上了病人。高医生把一大串钥匙挂在门边的挂钩上，仿佛刻意在引人去取。\n\n"治疗开始前，每位病人服一粒药。"高医生拆开药瓶，白色药片里隐约可见密密麻麻的黑色细线。\n\n一个满脸疤痕的夜班医生推门进来，正好敲了六下门。他看了陈歌一眼，把一粒药递到陈歌嘴边——却没有喂他吃下，只是用手挡住他的嘴，药片夹在指缝里。\n\n"陈歌病情好转，他只需要吃半片。"高医生伸手阻拦。\n\n"这跟院长的要求可不一样。"孙医生面无表情。\n\n陈歌懂了：那瓶药被高医生换过，掺了让人疯狂的黑线药。而孙医生——他在帮他。\n\n"凌晨十二点四十四分四十四秒，治疗开始。"高医生摘下机械表，放在药瓶旁。\n\n滴答、滴答。陈歌眼皮越来越重，意识开始模糊。恍惚间他听见高医生的声音像尸体一样冰冷："四月一日，你第十七次起身走到窗边——你看见了什么？"\n\n方医生浑身发抖："楼下有个一直笑的疯子，在向我招手……"\n\n滴答声越来越密。陈歌拼命咬住舌尖，他看见高医生的目光转向了自己："十二点五十二分，你手持尖刀，刺入了五号病人的心口……"',
  choices:[
    {label:'咬破舌尖保持清醒，绝不入睡', inf:'r8_nao_migong', next:'p8_seven_jars'},
    {label:'假装被催眠，观察高医生的"剧本"', hint:'将计就计', next:'p8_seven_jars'}
  ]
},

p8_seven_jars:{
  ch:'第一千一百七十六章 · 罐中放着谁的心', title:'被分割的病人',
  act:s=>{ if(!s.items.includes('玻璃罐·院长的心脏')) s.items.push('玻璃罐·院长的心脏'); if(!s.clues.includes('七个玻璃罐')) s.clues.push('七个玻璃罐'); },
  text:'脑迷宫中，孙医生领着陈歌他们去第四病区找药。四楼走廊弥漫着一股刺鼻的臭味——走廊尽头，第一任院长的办公室门虚掩着。\n\n陈歌推开门：满墙的"死"字，桌上立着一个玻璃罐，罐子里是一颗缠满黑色细线的心脏。\n\n他伸手触碰罐壁的瞬间，心脏剧烈跳动起来，仿佛与他同频。黑色丝线疯狂撞击玻璃，直到罐内浮现出深红色的血丝，将黑线拽回。\n\n"这颗心……是我缺少的东西？"陈歌抱着玻璃罐，脑海中陌生的记忆碎片翻涌。\n\n"这所医院一共有七任院长。"孙医生压低声音："每间院长办公室里都有一个玻璃罐。罐子里的器官属于同一个人——一个被分割成七份的病人，他的编号和你一样。"\n\n"和我一样？"\n\n"等你找到七个罐子，你就知道自己的编号了。找到它们，记住它们。"\n\n陈歌抱着装有心脏的玻璃罐走出办公室。诡异的是，高医生远远地避开了他，仿佛那罐子是洪水猛兽。\n\n"带着它我们可能会死，但如果不带，遇到鬼的时候我们一定会死。"陈歌把玻璃罐抱得更紧："两害取其轻，我倒是想看看，是这罐子危险，还是鬼怪危险。"\n\n远处，一位护工看着他的背影，眼神怨毒——她胸口的工牌上写着：吃××。',
  choices:[
    {label:'继续寻找其余六个玻璃罐', tag:'', inf:'r8_qige_guan', next:'p8_brain_maze'},
    {label:'先研究这颗心脏里的记忆', hint:'支线：记忆碎片', next:'p8_brain_maze'}
  ]
},

p8_brain_maze:{
  ch:'第一千一百七十九章 · 脑迷宫', title:'孙医生的真相',
  act:s=>{ if(!s.items.includes('镜子碎片')) s.items.push('镜子碎片'); if(!s.clues.includes('脑迷宫')) s.clues.push('脑迷宫'); s.grievance+=15; },
  text:'七个玻璃罐全部见过，陈歌在第七任院长的办公室前停住了脚——那是唯一幸存到现在的院长，罐子里放着一颗背对门的孩子头颅，没有五官。\n\n他抱住玻璃罐的瞬间，罐内的黑线与血丝同时沸腾。孙医生强忍着不安冲进办公室，一把关上门——他避开了高医生的视线。\n\n"陈歌！我知道离开医院的方法！"孙医生的声音变了，带着一种年轻的亲切："医院为你准备了两套方案：第一，营造虚假的美好，让你永远沉沦，成为他们掌心的玩偶；第二，逼你杀掉所有亲友，彻底逼疯你！"\n\n"你是谁？"陈歌后退一步："为什么帮我？"\n\n"我是敲门人。"孙医生指着自己满身的疤痕："我现在告诉你的一切，都发生在夜班医生用天赋能力编织的脑迷宫里——脑迷宫根据夜班医生的记忆生成，他设计这一切，就是为了让你在这里杀死所有病人，让你以为自己是杀人凶手！"\n\n"药物我已经帮你替换，医院里的杀人狂也由我的恶念来替你扮演。你只需要一口咬定，所有人都是你杀的——其他的，你已经全部忘记！"\n\n他递给陈歌一块锋利的镜子碎片："记住那七个玻璃罐的位置和里面的器官！那是这所医院里唯一属于你的东西！"\n\n玻璃罐轰然炸裂，黑线与血丝涌入陈歌的身体。他疼到无法昏迷，在极致的痛苦中，他反而想起了越来越多的往事。\n\n"时间不多了！"孙医生把陈歌拖到五楼治疗室门口："你能否逃离医院，就看这一次了！你一定要找回真正的自己！"\n\n门关上的瞬间，陈歌睁开眼——他回到了治疗室，手里握着镜子碎片，满身冷汗。高医生正低头记录："治疗成功。陈歌的妄想正在消除……"',
  choices:[
    {label:'假装彻底崩溃，骗过高医生', tag:'OK', inf:'r8_qiaomen', next:'p8_discharge'},
    {label:'把镜子碎片藏进衣袖，保持清醒', hint:'关键道具', next:'p8_discharge'}
  ]
},

p8_discharge:{
  ch:'第一千一百八十一章 · 出院', title:'真正的治疗，现在才开始',
  act:s=>{ if(!s.items.includes('婚戒')) s.items.push('婚戒'); if(!s.clues.includes('29号柜的婚戒')) s.clues.push('29号柜的婚戒'); },
  text:'治疗进行了整整一个多月。最后一次"治疗"，高医生、孙医生与副院长共同见证：托盘里放着一把手术刀，一颗跳动的心脏。\n\n"你的第二人格主动剜出了自己的心，离开了你的身体。"高医生和善地笑着："陈歌，你杀死了过去的自己，迎来了新生。"\n\n陈歌看着托盘里的心脏——那是"许音"的心。在脑迷宫最深处，那个满身伤痕的男人替他挡下了一切诅咒，把心交给了一个满身是伤的小孩，然后跳进了诅咒的海洋。\n\n"人，没有了心，还能活吗？"陈歌缓缓倒下。\n\n第二天，他被宣布"康复"，准予出院。临走前，孙医生站在门口，只说了一句话："看看29号柜。另外——真正的治疗，现在才开始。"\n\n29号柜里放着一位女病人的遗物：病例单、骨灰盒，以及——一枚戒指。陈歌把戒指藏进口袋，走出医院。\n\n阳光刺眼。他回头看了一眼那栋巨大的白色建筑，玻璃窗后似乎有人正看着他。\n\n"我应该还会回到这所医院。"陈歌低声说："只不过，不会再以病人的身份。"\n\n黑色手机依旧无法开机。他攥着口袋里那枚婚戒，走向街对面的乐园——那里有一座冷冷清清的鬼屋，门口站着一个身穿红衣的女人，正在逗一只巨大的白猫。\n\n熟悉得让人心疼。',
  choices:[
    {label:'走向鬼屋，应聘员工', tag:'', next:'p8_ghost_house'},
    {label:'先去找警察李三宝，查父母的墓地', hint:'支线：身世调查', next:'p8_ghost_house'}
  ]
},

p8_ghost_house:{
  ch:'第一千一百八十一章 · 应聘', title:'红衣女人与白猫',
  act:s=>{ if(!s.employees.includes('张雅·鬼屋老板')) s.employees.push('张雅·鬼屋老板'); if(!s.items.includes('康复证明')) s.items.push('康复证明'); },
  text:'鬼屋门口，红衣女人正在给游客发广告单。白猫挣脱她的手，直直朝陈歌冲来——异色双瞳里满是担忧。\n\n"上次扔你，我也是迫不得已。"陈歌抱起白猫，揉着它的脑袋："在医院里最快乐的时间，就是揉你脑袋的时候。"\n\n"陈歌？你出院了？"红衣女人小跑过来，眼底是藏不住的惊喜。\n\n"恩，病已经完全好了。"陈歌拿出康复证明，有些腼腆："我是来应聘的。我出车祸以前，从事的就是和鬼屋相关的工作，经验丰富。我有信心把咱们鬼屋，打造成新海最出名的鬼屋。"\n\n"应聘？"红衣女人和白猫都愣了。\n\n她叫张雅，这间鬼屋是她父母开的，入不敷出，正愁找不到人。陈歌进了鬼屋，像回了自己家——他熟练地避开机关，捧起地上的塑胶人头，眼里泛起水光："我来过这。这些道具，仿佛是我和家人亲手做的。"\n\n"爸？"他对着尸堆里背对他的"僵尸"脱口而出。僵尸头也不回地狂奔——那是张雅的父亲，被这个比自己还熟悉机关的家伙吓得够呛。\n\n张雅的妈妈看着陈歌，忽然笑了："从明天开始来上班吧。腿彻底痊愈之前，让张雅先带着你。"\n\n"妈！他有过妄想症病史！"张雅父亲急得直拍桌子。\n\n"谁家的孩子不是孩子。"张雅妈妈一锤定音。',
  choices:[
    {label:'接受这份工作，开始新的生活', inf:'r8_fang', next:'p8_good_life'},
    {label:'私下告诉张雅：我总觉得世界有问题', hint:'交心路线', next:'p8_good_life'}
  ]
},

p8_good_life:{
  ch:'第一千一百八十三章 · 美好的生活', title:'梦与现实',
  act:s=>{ if(!s.clues.includes('张雅的梦')) s.clues.push('张雅的梦'); s.tourists+=400; s.reputation=Math.min(100,s.reputation+25); },
  text:'三个月过去。陈歌把鬼屋改得焕然一新——新增"午夜逃杀"场景，设计出无数惊吓点，吸引来大批游客。一万块奖金活动让鬼屋一夜爆红，新海医学院的学生们组团来挑战，被吓晕了五个。\n\n"全被吓晕了？我一个人拖不动他们，你能帮帮我吗？"陈歌满脸无辜。张雅和围观的游客都吸了口凉气。\n\n生活平静得像溪水。白天一起经营鬼屋，晚上张雅陪陈歌做康复训练。看电影、做软陶人偶、撑一把伞走在下雨的街上——陈歌捏出的人偶是张雅的模样，风华绝代，仿佛活了过来。\n\n"其实自从遇见你以后，我每晚都会做梦。"张雅靠在陈歌身边，声音发颤："很恐怖的梦。我梦见父母在车祸里丧生，自己也倒在血泊里；梦见自己身穿血衣，在一所医院徘徊；我还梦见这世界是一座满是死人的城，而你是城中唯一有温度的鬼。"\n\n陈歌握着伞柄的手微微收紧。张雅的梦——那些分明是真实的记忆。\n\n"别怕。"他轻声说："不管在哪里，我都会和你站在一起，形影不离。"\n\n夜里，他独自坐在员工休息室，翻看鬼屋的免责协议。一张张写满"张文宇"的名字——自从他来了之后，这个名字几乎每天都在协议上出现。\n\n"张文宇来找过我……"陈歌目光渐冷："说不定，他已经见过我了。"',
  choices:[
    {label:'去平安公寓赴约，见"张文宇"', tag:'', inf:'r8_writer', next:'p8_writer'},
    {label:'先查免责协议上的张文宇长相', hint:'支线：蹲守游客', next:'p8_writer'}
  ]
},

p8_writer:{
  ch:'第一千一百八十七章 · 平安公寓', title:'一座死人的城',
  act:s=>{ if(!s.scenes.includes('平安公寓')) s.scenes.push('平安公寓'); if(!s.employees.includes('门楠/老周·平安公寓')) s.employees.push('门楠/老周·平安公寓'); if(!s.clues.includes('平安公寓的真相')) s.clues.push('平安公寓的真相'); },
  text:'平安公寓藏在新海西郊的荒村后，坟地尽头，三楼窗户被木板封死，墙上有大火焚烧的痕迹。\n\n一个叫门楠的小孩在门口拦住了陈歌，坏笑着引他上了三楼——那里，房客们正把一位医生钉在墙上。\n\n"别怕，我们不是坏人。"作家从人群中走出——正是那个在乐园餐厅留下纸条的"张文宇"。\n\n"你到底是谁？为什么上万张病历都叫张文宇？"陈歌逼问。\n\n作家环顾四周，说出了惊天动地的话："现在这座公寓里，除了你，其他所有人——包括我——都是死人。"\n\n陈歌没有意外。张雅说过：她梦见一座满是死人的城，陈歌是城中唯一有温度的鬼。\n\n"你以前经营着一座鬼屋，他们全部是你的员工，你们之间就像家人一样。"作家一字一句："你们的记忆被一张嘴吃掉了——那是一种你们无法理解的力量。这座城就是一个牢房，我们都是囚徒。离开的关键，就在你身上。"\n\n"那个偷走记忆的家伙，用心极为险恶，就是要让你们自相残杀。"\n\n"张雅呢？"陈歌最关心这个："我选择了你们，她会不会出事？"\n\n提到张雅，整栋公寓鸦雀无声。作家沉默片刻："我很想骗你，但骗你毫无意义——灾厄一定会对她下手。你所有珍视的人和东西，都会被厄运缠绕。"\n\n门外，那个戴着眼镜的女教师、抱着自己头颅的女人、满身伤疤的赛车手唐骏……一张熟悉又陌生的脸，都在看着陈歌。"',
  choices:[
    {label:'定下计划：明面沉醉美好，暗中联合鬼怪', inf:'r8_pingan', next:'p8_sanyou'},
    {label:'先问"独眼、咒女、绯红"三个最恐怖的鬼', hint:'关键情报', next:'p8_sanyou'}
  ]
},

p8_sanyou:{
  ch:'第一千一百八十八至一百九十一章', title:'独眼·绯红·咒女',
  act:s=>{ if(!s.clues.includes('三大厉鬼')) s.clues.push('三大厉鬼'); if(!s.employees.includes('绯红·荔湾街')) s.employees.push('绯红·荔湾街'); },
  text:'陈歌开始接触这座城市里最恐怖的三位厉鬼。\n\n<b>独眼</b>——西郊废校舞蹈室的镜中厉鬼。她要"陈歌的左眼"换一次出手，却在听到"张雅"二字时猛然收手，只取走他一根头发，遁入镜中。\n\n<b>绯红</b>——荔湾街的红衣小女孩。她蹲在陈歌身边，抚摸他的影子："所有人和东西的影子都是歪斜的，只有你和二号病人的影子是正常的——你们都是没有影子的人。"她凝望陈歌良久："我依稀记得，你的影子里住着一个鬼。她去了哪里？你弄丢了她吗？"陈歌心头剧震。\n\n<b>咒女</b>——第三病栋的红色高跟鞋，这座城市最强的鬼。她以诅咒为力量："付出惨痛的"因"，收获血淋淋的"果"。你的心中藏有我的记忆——以你的心为代价，我就能找回记忆。"她冰冷的指尖划过陈歌心口："摘了你的心，你不一定会死。在这虚假的美好里，只要你还保留着真实的记忆。"\n\n陈歌的手背渗出血——那个永远无法愈合的伤口又开始作痛。\n\n"如果这座城市所有人都联合起来，能赢过医院吗？"陈歌问。\n\n"除非找回失去的记忆和能力。"咒女摇头："否则，没有任何可能。"',
  choices:[
    {label:'问咒女：如果我把心给你呢？', inf:'r8_zhounv', next:'p8_zhounv_deal'},
    {label:'先回去安顿张雅，再定夺', hint:'谨慎路线', next:'p8_zhounv_deal'}
  ]
},

p8_zhounv_deal:{
  ch:'第一千一百九十二章 · 摘去我的心脏', title:'这次我来做她的影子',
  act:s=>{ if(!s.items.includes('诅咒之刃')) s.items.push('诅咒之刃'); if(!s.clues.includes('做张雅的影子')) s.clues.push('做张雅的影子'); s.grievance+=20; },
  text:'灾厄降临。张雅的父亲"病危"住进医院，鬼屋被勒令停业整改，午夜逃杀被强制拆除。陈歌站在鬼屋顶层，看见对面的医院窗口——张雅穿着病号服，木然地看着掌心的白色药片。\n\n"你们连虚假的美好，都不愿意给我了吗？"\n\n掌心淌血，陈歌转身，敲响了第三病栋那扇刻满诅咒的门。\n\n"心脏可以给你。"陈歌的语气平静得吓人："但在那之前，我要把左眼给另一个鬼。我会用尽我的一切帮你们找回记忆——但你们要答应我一件事。"\n\n"什么事？"黑色文字浮现。\n\n"左眼、心脏、头颅、躯体，所有的一切你们都可以拿走。"陈歌抬起头："我只希望你们能将我的影子留下，让我可以守在她的身后。"\n\n诅咒化为一柄黑色的刀，咒女亲手交给他。\n\n"失去一切，面目全非，你愿意变成她身后不能言语、永远也触及不到彼此的影子吗？"\n\n陈歌接过刀，毫不犹豫地刺入胸口。\n\n记忆在诅咒最深处盛开。咒女浑身颤抖，血衣上浮现出那个新生的名字——她找回了记忆。\n\n"这座城里的很多鬼都帮过我。他们拼着魂飞魄散和我站在一起。"陈歌捂着心口的刀，咧嘴笑了："我怎么可能因为惧怕死亡，就退缩在他们身后？这次，就让我站在他们前面。"\n\n新海西郊私立学院的舞蹈室，镜面在瞬间炸裂。荔湾街的街角，陈歌握住绯红的手："你不用做谁的影子，你是为自己而存在的。"\n\n平安公寓、地下尸库、远郊荒村、废弃水坝——一道道恐怖的气息撕裂夜幕。\n\n<b>百鬼夜行。</b>',
  choices:[
    {label:'带领百鬼，进攻新海中心医院', tag:'FINAL BATTLE', inf:'r8_ewei', next:'p8_baigui'},
    {label:'先去看望被囚的张雅', hint:'情感路线', next:'p8_baigui'}
  ]
},

p8_baigui:{
  ch:'第一千一百九十三章 · 百鬼夜行', title:'活葬这座城',
  act:s=>{ if(!s.clues.includes('恶念与善念')) s.clues.push('恶念与善念'); s.grievance+=30; },
  text:'夜空被割裂，一半漆黑如墨，一半深红如血。陈歌提着背包，一步步走向新海中心医院，身后跟着无数道邪恶、暴虐、满含怨毒的影子。\n\n"救赎和毁灭往往只有一线之隔。"陈歌停在医院门口："有的时候，毁灭也是一种救赎。"\n\n七位夜班医生挡在路中央。为首的高医生刚开口，头颅已被摘去——独眼撕下他的脸，露出满身黑线的怪物真容。\n\n"撕破了脸，也就没必要再废话了。"陈歌没有谈条件。他要撕碎所有的绝望、痛苦、美好和记忆，活葬了这座虚假的城。\n\n医院深处，一位位被"治疗"过的病人如潮水般涌出。但城市各角落，作家拽着人偶服的工作人员，身后是无数赶来的厉鬼——\n\n"你曾经救赎过的人，终有一天会成为你的救赎。"\n\n一个红衣男人走出人群，血眸眨动，病人双腿纷纷断裂——他的天赋能力是谜。\n\n"我说过要护你周全，无论是在门内，还是门外。"\n\n陈歌认出了他——二号病人。他腰间挂着一把血红色的钥匙。\n\n"你是什么时候找回的记忆？"副院长从楼上下来，浑身长满哀嚎的人脸。\n\n"我问你张雅在哪！"陈歌嘶吼。\n\n"她被院长和"吃"压制，还敢分出一丝执念来帮你……现在，她或许早已魂飞魄散。"\n\n副院长话音落下的瞬间，咒女的手从他身后探出，握住了他的心脏："恶言？！通过声音下咒！你怎么拥有冥胎的天赋！"\n\n"恶念？"陈歌的目光飘向远处，手持玻璃罐的孙医生正朝他走来："我不是什么恶念。我有自己的名字——我叫陈歌，一路高歌的歌。"',
  choices:[
    {label:'接过七个玻璃罐，找回属于自己的记忆', tag:'', inf:'r8_ewei', next:'p8_yuanzhang_truth'},
    {label:'冲向医院底层，寻找张雅', hint:'救人优先', next:'p8_yuanzhang_truth'}
  ]
},

p8_yuanzhang_truth:{
  ch:'第一千二百零二至一百零四章', title:'院长与陈宵',
  act:s=>{ if(!s.clues.includes('院长是诅咒之种')) s.clues.push('院长是诅咒之种'); if(!s.clues.includes('陈歌名字的由来')) s.clues.push('陈歌名字的由来'); },
  text:'医院底层，血衣院长从尸山血海中站起——那才是他的本体。他的过去在陈歌眼前展开：\n\n他是诅咒之种，生来就被当作怪物。他杀光家人，用黑雾建造了这座城，把病人当"药"来养，终极目标是培养出类似一号病人的存在。\n\n二十年前，一位叫陈宵的年轻人因救人重伤昏迷。院长为了进入血城，强行将他的意识分离——人性的一面保留为"陈宵"，被血城束缚、充满负面情绪的一面命名为"陈枭"。\n\n几年后，陈宵的孩子出生了。那孩子拥有一双血红色的瞳孔，能看见人心深处的恶。陈宵给他取名——<b>陈歌</b>。\n\n"世界以痛吻我，我却报之以歌。"\n\n"你才是三号病人。"陈歌看着院长："我爸是陈宵，二号病人陈枭是我爸的恶念，而我——一号病人，就是被你和血城瓜分的那个孩子。"\n\n院长浑身颤抖："你是我的试验品，陈歌！你的意志分裂了两次——善念融入了血城，恶念回到了现实！你就是恶念！"\n\n"善念融入了血城，恶念回到了现实……"陈歌缓缓闭上眼睛。他想起那个在脑迷宫中替他挡下一切诅咒的男人——那才是真正的许音，一个以守护为执念的鬼。\n\n"不管是善，还是恶，都是我。"陈歌睁开眼，眸中赤红如血："何必分得那么清楚？"\n\n七个玻璃罐同时炸裂。他以自己的血肉为原料，用活偶天赋更换了被诅咒的器官——那颗被院长分割封印的、属于"一号病人"的心，重新在他胸腔里跳动。',
  choices:[
    {label:'完成换心，与院长决一死战', tag:'', inf:'r8_yuanzhang', next:'p8_final_battle'},
    {label:'先救出血海中的父母', hint:'亲情路线', next:'p8_final_battle'}
  ]
},

p8_final_battle:{
  ch:'第一千二百零四章 · 落幕', title:'高医生的血狱',
  act:s=>{ if(!s.employees.includes('许音·重生')) s.employees.push('许音·重生'); if(!s.employees.includes('高医生·镇守血城')) s.employees.push('高医生·镇守血城'); if(!s.clues.includes('许音的守护之心')) s.clues.push('许音的守护之心'); s.grievance+=40; },
  text:'"你太慢了。"\n\n血衣陈枭（二号病人）手持血色钥匙，刺入神龛最深处——院长的心脏就藏在那里。他的记忆碎片漫天炸开：被父母遗弃、被同学霸凌、被女友背叛、被医院拒收……诅咒之种在黑雾中长成了怪物。\n\n神龛炸裂。院长的"心"暴露——一张破损的黑白相片，照片上是穿着病号服的女人和白大褂的医生，那是他仅存的人性。\n\n张雅的黑发、高医生的锁链、陈枭的钥匙、陈歌的诅咒之刃，同时贯穿了那颗千疮百孔的心。\n\n"看来是我输了。不过只要这世界上还有绝望和痛苦，雾海就不会消失。"院长引爆了自己。\n\n恶念如虫群般散开。陈枭喊道："院长的心代表着混乱与厄运，只有完全相反的心才能压制恶念！"\n\n"让我来吧。"陈歌走到神龛前，闭上眼睛，呼唤脑海中那颗心——<span class="clue">许音的心，以守护而存在。</span>\n\n许音的心跳动着，镇压恶念，吸收院长残余的力量。一根根血管向外延伸，一个面容英俊的年轻人从神龛中站起——\n\n"旧神已死。"陈歌伸出手："在神龛中重生的，是许音。"\n\n许音抓住陈歌的手，眼底的忧郁悄然散去。血城吞掉了诅咒医院，院长的最后一丝痕迹被抹除。\n\n血海中心，陈歌的父母静静躺在血海之上，被无数血管缠绕。陈歌跪在他们面前，抬手想要触碰——\n\n"我找到你们了……"\n\n简简单单几个字，却代表无数次生死搏杀。他从地狱尽头爬回来，终于在路的尽头看到了光。',
  choices:[
    {label:'带父母去血城中心，见"善念"', tag:'', inf:'r8_xuyin', next:'p8_xuecheng'},
    {label:'先为高医生复活他的妻子', hint:'支线：高医生的愿望', next:'p8_xuecheng'}
  ]
},

p8_xuecheng:{
  ch:'第一千二百零七章 · 血城意志', title:'黑色手机的秘密',
  act:s=>{ if(!s.items.includes('黑色手机·修复')) s.items.push('黑色手机·修复'); if(!s.scenes.includes('被诅咒的医院')) s.scenes.push('被诅咒的医院'); if(!s.scenes.includes('噩梦之城')) s.scenes.push('噩梦之城'); if(!s.employees.includes('善念·血城意志')) s.employees.push('善念·血城意志'); if(!s.clues.includes('血城意志')) s.clues.push('血城意志'); },
  text:'血城中心，一座与含江恐怖屋一模一样的鬼屋。卫生间镜子里，一个孩子的声音传来："我已经等你很久了。"\n\n"你是我的善念？"陈歌站在镜子前。\n\n"以前是。现在，我代表了这座血城的意志。"镜中的孩子说："每一次星级任务都是我发布的。黑色手机里存着我唯一的执念——我倾尽血城之力，让它拥有了血城的能力。你鬼屋地下的场景，就是门后世界的投影，它们会扎根现实，成为连接血城与现实的枢纽。"\n\n"那转盘呢？我转了好多次，从没转到过好东西。"\n\n"那些奖励……是善意的欺骗。"镜中的孩子坦然道："转盘里只有厉鬼、与厉鬼相关的物品，和死者遗留的杂物。"\n\n陈歌哭笑不得："你这么不要脸，竟然还能成为善念。"\n\n"雾海在扩张，绝望在积累。我想让血城成为雾海和现实的交点，把最绝望的灵魂引渡到血城里，避免他们与黑雾融合。"镜中的孩子看着他："你做得非常完美，迄今为止没有发生过任何意外。"\n\n镜中的孩子用凶神的血肉修复了黑色手机："我无法离开血城。等血城里所有灵魂都得到救赎——我会是最后一个离开血城的鬼。"\n\n陈歌把黑色手机握在掌心。碎裂的屏幕重新亮起，一条条信息涌入：\n\n<span class="clue">"幸运的红衣眷顾者！恭喜你完成四星试炼任务——被诅咒的医院！任务完成度百分之九十五！"</span>\n\n· 解锁四星场景【被诅咒的医院】与隐藏奖励——诅咒医院的地下十九层。\n· 三个四星恐怖场景集齐，恐怖屋升级为——<b>噩梦之城</b>。\n· 最后的五星任务【噩梦之城】已强制触发：没有期限，会不断获得阶段性奖励，直到黑雾消失。',
  choices:[
    {label:'推开门，回到现实——父母在等你', tag:'', inf:'r8_nightmare', next:'p8_back_home'},
    {label:'先看黑色手机，确认新员工与场景', tag:'', next:'__phone__'}
  ]
},

p8_back_home:{
  ch:'第一千二百零九章 · 门外便是人间', title:'回家',
  act:s=>{ if(!s.clues.includes('父母归来')) s.clues.push('父母归来'); s.tourists+=1000; s.reputation=Math.min(100,s.reputation+30); },
  text:'阳光透过玻璃窗照在身上，血色融化。陈歌一步迈出，回到人世间——含江新世纪乐园，他自家鬼屋的卫生间。\n\n抱着布娃娃的女孩罗若雨守在隔间门外，看见他，眼眶一下就红了。\n\n"我把爸、妈接回来了。"陈歌摸了摸她的头："已经没事了。"\n\n新海中心医院被血城吞掉，活人们被陈歌一一送回现实。左寒保留记忆，成为恐怖屋兼职员工——他说他以后要以法医为主："为死者言，捍生者权。"张敬酒则成为新海恐怖屋分店的店长。\n\n含江人民医院二楼挤满了人。警察、乐园员工、鬼屋员工站在走廊两边。陈歌推开门，看见病床上那对穿着病号服的夫妻——\n\n"陈歌，这怎么回事啊？一个晚上没见，你们就摆出这么大的阵仗了。"陈宵大大咧咧地勾住他的脖子。\n\n"一个晚上没见？"陈歌愣住了："你们不记得了吗？"\n\n"我们只记得昨天因为鬼屋的事跟你吵架，你说不愿意继承鬼屋，要去新海那样的大城市工作。"陈宵装得云淡风轻，通红的眼睛却出卖了他。\n\n陈歌的母亲走上前，紧紧抱住他，不肯松手。\n\n他们只是在装失忆——这一年来他们承受的痛苦常人无法想象，但他们不想再给孩子压力。\n\n"痛苦的日子已经过去了。"陈歌笑了："对了，你们还没参观过现在的鬼屋吧？在你们睡着的这段时间，我把鬼屋里里外外翻新了一遍。现在咱们鬼屋已经是国内最顶尖的鬼屋，我还在新海开了分店。"\n\n一家三口坐上出租车，回到了恐怖屋。陈歌拉开尖嚎之门上的锁链，通往地下的门缓缓打开——\n\n一眼望去，庞大的地下建筑群里站满了各种各样的执念、厉鬼和红衣："老板好！伯父、伯母好！"',
  choices:[
    {label:'"爸、妈，其实还有件事——我遇到了一个很好的女孩"', tag:'FINAL', next:'p8_final'},
    {label:'查看黑色手机，确认噩梦之城状态', tag:'', next:'__phone__'}
  ]
},

p8_final:{
  ch:'第一千二百一十章 · 我有一座恐怖屋（终章）', title:'噩梦之城 · 完',
  act:s=>{ if(!s.employees.includes('张雅·凶神')) s.employees.push('张雅·凶神'); if(!s.talents.includes('噩梦之城·五星')) s.talents.push('噩梦之城·五星'); s.grievance+=50; s.tourists+=2000; s.reputation=100; },
  text:'"我们连这样的场景都见过了，还有什么事情能让我们惊讶？"陈宵和许梦站在台阶上，看着满坑满谷的厉鬼员工，还在犹豫要不要下楼。\n\n"那我就叫她出来了？"陈歌对着自己的影子，轻声喊道："张雅，你也来见见我父母吧。"\n\n漆黑的影子涤荡起波纹，紧接着整座新世纪乐园晃动了起来——一股根本无法隐藏的恐怖气息悄然浮现。\n\n黑发如瀑，血衣如霞。凶神张雅从陈歌的影子中走出，美到窒息的脸上带着一丝罕见的局促。\n\n"伯父……伯母。"\n\n许梦一把把张雅拉过去，上下打量，又回头看陈歌，眼神意味深长："陈歌，你过来，妈问你个事——这姑娘，是咱们鬼屋的……什么员工？"\n\n"她是老板娘。"陈歌咧嘴一笑。\n\n"臭小子！"陈宵抄起拖鞋就要打，被许梦一把拦住："你闭嘴！我看这姑娘挺好——就是这打扮，上班的时候会不会吓到游客？"\n\n白猫在张雅脚边蹭来蹭去，门楠学着它撒娇，被黑发甩飞。老周、段月、朱龙、张炬、樱红、樱白、常雯雨、许音、高医生……所有员工都在笑。\n\n黑色手机再次震动，屏幕上浮现一行字：\n\n<span class="clue">"幸运的红衣眷顾者！恐怖屋已升级为【噩梦之城】。五星任务已强制触发——直到黑雾消失，任务才算结束。"</span>\n\n陈歌把手机放进口袋，看着满堂的"家人"，忽然笑了。\n\n"世界以痛吻我，我却报之以歌。"他轻声说："爸、妈，张雅，还有大家——这，就是我的一座恐怖屋。"\n\n——全剧终——\n\n阶段八落幕：\n· 四星场景<b>被诅咒的医院</b> + <b>噩梦之城</b>（五星）入手。\n· <b>许音</b>在神龛中重生；高医生镇守血城，妻子复活；陈枭（二号病人）了却心结。\n· 真相：<b>陈歌是善念剥离出的恶念</b>；院长是诅咒之种；黑手机由血城意志（善念）操控。\n· <b>父母回归</b>，张雅见公婆——恐怖屋，终于成了家。\n· 五星任务【噩梦之城】：黑雾不灭，故事不止。',
  choices:[
    {label:'打开黑色手机，查看完整推理树与最终场景', tag:'', next:'__phone__'},
    {label:'回到阶段七尾声（通灵鬼校）', next:'p7_final'},
    {label:'回到开篇，重温恐怖屋的起点', next:'start'}
  ]
}

function affLevel(score){

  if(score>=55) return '信任';
  if(score>=30) return '熟识';
  return '陌生';
}
function ensureAffinity(){

}

function expandGhostHouse(){
  const s = state;
  const conds = [[100,60],[1000,70],[5000,85]];
  const names = ['恐怖屋扩建（空间不足，解锁新场景）','颤栗迷宫扩建','绝望乐园扩建'];
  if((s.expand||0)>=3){ alert('已扩建三次，恐怖屋升级为绝望乐园——这就是终点了。'); return; }
  const c = conds[s.expand||0];
  if(s.tourists>c[0] && s.reputation>=c[1]){
    s.expand = (s.expand||0)+1;
    s.ticket = Math.min(50, 20 + (s.scenes.length||0)*3);
    if(s.expand===1 && !s.scenes.includes('地下停车场')) s.scenes.push('地下停车场');
    if(s.expand===2 && !s.scenes.includes('颤栗迷宫')) s.scenes.push('颤栗迷宫');
    if(s.expand===3 && !s.scenes.includes('绝望乐园')) s.scenes.push('绝望乐园');
    alert('扩建成功！恐怖屋规模扩大，票价调整为 ¥'+s.ticket);
  } else {
    alert('未满足扩建条件：游览>'+c[0]+' 且 好评≥'+c[1]+'%。当前：'+s.tourists+'/'+c[0]+' · '+s.reputation+'%/'+c[1]+'%');
  }
  openPhone(); updateHUD();
}

  if(s.items.includes('复读机')){ scMul += 0.15; itemNote.push('复读机回声'); }
  if(s.items.includes('怨念缠绕的圆珠笔(残破)')){ scMul += 0.10; itemNote.push('笔仙加持'); }
  if(s.items.includes('张雅的红衣')){ scMul += 0.20; itemNote.push('红衣压阵'); }
  if(s.items.includes('碎颅医生的制服') && open.includes('午夜逃杀')){ scMul += 0.20; itemNote.push('碎颅医生巡场'); }
  if(s.items.includes('无脸护士的制服') && open.includes('第三病栋')){ scMul += 0.20; itemNote.push('无脸护士巡场'); }
  let n = 3 + Math.floor(Math.random()*6) + Math.min(stars,6);
  n = Math.round(n*tourMul);
  const base = n * (1 + stars);
  // 员工加成（原文：员工各有能力，能提升鬼屋人气）
  let bonus = 1, staffNote = [];
  if(s.employees.includes('笔仙·陈雅琳')){ bonus += 0.2; staffNote.push('笔仙出题'); }
  if(s.employees.includes('张雅') || s.employees.includes('张雅·形影不离') || s.employees.includes('张雅·凶神')){ bonus += 0.3; staffNote.push('红衣压场'); }
  if(s.employees.includes('许音') || s.employees.includes('许音·红衣') || s.employees.includes('许音·重生')){ bonus += 0.15; staffNote.push('许音低吟'); }
  if(s.employees.includes('司机唐骏')){ bonus += 0.1; staffNote.push('灵车接送'); }
  if(s.employees.includes('无头女鬼')){ bonus += 0.1; staffNote.push('无头女鬼巡场'); }
  if(s.employees.includes('水鬼·赵双儿')){ bonus += 0.1; staffNote.push('水鬼泡池'); }
  if(s.employees.includes('隧道女鬼')){ bonus += 0.1; staffNote.push('隧道回声'); }
  if(s.employees.includes('黑犬')){ bonus += 0.05; staffNote.push('黑犬蹲门'); }
  const gain = Math.round(base * bonus);
  const income = Math.round(n * (s.ticket||20) * (1 + stars*0.1) * incMul);
  // 游客类型（原文：游客承受力不同，鬼屋按场景星级匹配）
  const crowd = [
    {w:.30, name:'普通游客', nerve:1},
    {w:.18, name:'网红主播', nerve:1.6, good:true},
    {w:.14, name:'熊孩子军团', nerve:.7, bad:true},
    {w:.12, name:'回头客', nerve:1.3, good:true},
    {w:.12, name:'医学生团', nerve:2, good:true},
    {w:.08, name:'公园保安', nerve:.8, bad:true},
    {w:.06, name:'胆小鬼', nerve:.5}
  ];
  let rr = Math.random(), acc2 = 0, crowdPick = crowd[crowd.length-1];
  for(const c of crowd){ acc2 += c.w; if(rr < acc2){ crowdPick = c; break; } }
  // 随机事件（原文：吓晕、直播爆火、笔仙显灵、退票等经营日常）
  const evts = [
    {w:.22, txt:'游客被吓到腿软，哭着要求退票', good:false, rep:-3, scary:0},
    {w:.16, txt:'一名游客当场晕倒，救护车呼啸而来', good:false, rep:-5, scary:0},
    {w:.14, txt:'网红主播全程尖叫直播，直播间爆了', good:true, rep:6, scary:0},
    {w:.12, txt:'有游客认出笔仙的真身，当场下跪', good:true, rep:4, scary:0},
    {w:.10, txt:'铁杆粉丝二刷，扬言"越吓人越好"', good:true, rep:3, scary:0},
    {w:.08, txt:'有游客说厕所隔间的门自己关上了', good:true, rep:3, scary:0},
    {w:.08, txt:'游客全程无感，吐槽"就这？"', good:false, rep:-2, scary:0},
    {w:.06, txt:'熊孩子试图拆道具，被吓哭一片', good:false, rep:-2, scary:0},
    {w:.04, txt:'午夜售票台亮起，有"人"来买票', good:true, rep:5, scary:0}
  ];
  let r = Math.random(), acc = 0, evt = null;
  for(const e of evts){ acc += e.w; if(r<acc){ evt = e; break; } }
  if(evt && !evt.good && s.items.includes('罗若雨的红绳手链') && Math.random()<0.5){
    evt = {w:1, txt:'红绳微颤——手链替你挡下了一场晦气', good:true, rep:1, scary:0};
  }
  if(evt && !evt.good && s.paperShield){
    s.paperShield = false; itemNote.push('纸人替身');
    evt = {w:1, txt:'怀中的纸人无火自燃，替你挡下了灾厄', good:true, rep:0, scary:0};
  }
  const repRaw = evt? Math.round(evt.rep * (crowdPick.bad?1.4:crowdPick.good?1.3:1)) : 0;
  let repDelta = repRaw;
  if(repRaw<0 && s.items.includes('自知力钥匙')) repDelta = Math.round(repRaw/2);
  const scDelta = Math.round(gain * (evt&&evt.good?1.5:1) * crowdPick.nerve * scMul);
  s.tourists += n;
  s.funds = (s.funds||0) + income;
  s.scary += scDelta;
  s.reputation = Math.max(0, Math.min(100, s.reputation + repDelta));
  s.days = (s.days||1) + 1;
  const starsStr = '★'.repeat(Math.min(stars,5));
  const line = `<div class="bc-h"><b>第 ${s.days} 日营业</b><span>场景强度 ${starsStr}</span></div>
    <div class="bc-num">${n} 名游客 · <b>${crowdPick.name}</b></div>
    收入 <b style='color:var(--cyan)'>+¥${income}</b> · 惊吓值 <b>+${scDelta}</b> · 好评度 ${repDelta>=0?'<span class="bc-ev">+'+repDelta+'%</span>':'<span class="bc-bad">'+repDelta+'%</span>'}
    <div class="bc-ev">事件：</div>${evt?evt.txt:'波澜不惊，正常营业'}${staffNote.length?'<br><span class="bc-ev">员工：</span>'+staffNote.join('、'):''}${itemNote.length?'<br><span class="bc-ev">道具：</span>'+itemNote.join('、'):''}`;
  s.busyLog = s.busyLog||[];
  s.busyLog.push(line);
  // 经营事件写入时间线
  s.timeline = s.timeline||[];
  s.timeline.push({d:s.days, ch:'经营 · 第'+s.days+'日', title: crowdPick.name+' '+(evt?evt.txt.split('，')[0].slice(0,10):'正常营业') + ' · ' + n + ' 名游客', st:'bus', node:'__busy__'});
  save(); updateHUD();
  renderBusyTab(); renderTimeline();
  document.querySelector('#tab_status .busy-btn').innerHTML = '今日已接待 · 再开一波';
}

    '林官村桃林':'深夜挖地的白大爷、四间门锁在外的木屋。桃树根须下埋着谁的头颅？——三星试炼活棺村的前奏。',
    '猛鬼的换衣间':'第二次扩建奖励的特殊建筑。穿上浸血制服可代入死者记忆，百分之一概率触发极致体验。三次扩建升级颤栗迷宫。',
    '王声龙开口':'和瘦长鬼影玩看谁先开口六年的男孩赢了。怪物离开前后，楼道里有倒着走的脚步声。',
    '朱秀伏法':'逼死张雅的凶手（器材室员工/校长之子）。把罪行当怪谈讲给协会听，电梯里被张雅抽走灵魂，成了植物人。',
    '许音首战':'午夜出租车。乘客抱着自己的骨灰盒，后脑长着血脸——许音现身撕碎血脸。乘客就是怪谈协会五号。',
    '十号病人·红衣男孩':'第三病栋十号病人用自己孩子灵魂做成的两个红衣。毁容脸布下杀局，被张雅以一敌四碾碎，灵魂做成木盒玩具。',
    '张雅沉睡':'吞掉太多鬼物后沉睡。她的影子取代了陈歌的影子——长发女人的形状，是最温柔的威慑。',
    '活棺村完成度7%':'活棺村三星试炼完成度仅7%——怪谈协会搅局，祭祀未完成。绣娘的残念入册，用我的骨做针，用我的血做线，用我的皮做衣。',
    '手机鬼':'能操控手机、激发恐惧的鬼，实体是骨瘦如柴的小孩。冒充高汝雪引陈歌入法医学院，后被收服。',
    '流泪的雕像':'法医学院地下室会流血的石膏雕像，底座刻着：谎言拥有令人艳羡的外衣，真理却总是丑陋的。',
    '韩宝儿·挖眼案':'第三病栋六号病人，身体畸形恐惧症患者。五起挖眼案是仪式——5个罪人之眼嵌进血门上的恶鬼图案。',
    '消失的妻子':'隐藏试炼任务：刘娴娴的心上人刘哲坚信七年前车祸亡妻仍活着，每周三进入地下尸库。',
    '笔仙遗书':'凶手背着一具尸体，他称呼那具尸体为妻子！帮我照顾好王欣，为我报仇！——来者是十号。',
    '高医生的过去':'高医生亡妻车祸离世后曾想轻生。他符合怪谈协会十号的全部特征：见过面具、熟悉法医学院、手指修长。',
    '白龙洞隧道':'噩梦任务：凌晨2:44进44米以上隧道，走44步喊44声名字。完成后获天赋鬼耳。张雅刻下血字：他是……我的！',
    '童童':'手机鬼的本名。99个未接来电备注老妈。普明公寓水缸干尸，母亲守候花店七年——报警吧，不要让她再等了。',
    '门楠论红衣':'推门人死后直接成红衣；厉鬼晋升红衣须成为门主人或吞食完整红衣。许音的心口缺一块。张雅或是推门人。',
    '永生支线':'通灵鬼校第八条支线：地下尸库的未开放区域住着一群永生的人。生命的意义不在于是否会呼吸。',
    '地下尸库':'法医学院三星试炼。白漆运尸/无漆人行/红漆禁入三条通道，八号库房无档案，血苔藓下全是尸体垒墙。',
    '卫九卿':'九江法医学院教授，肺癌患者死后捐遗体。他记得一切——高医生就在最深处等你。',
    '怪谈协会会长=高医生':'地下尸库主人=怪谈协会会长。为复活亡妻推开门、以尸垒库，创立精神病人互助会。十号特征全部吻合。',
    '高医生现身':'你拥有一扇门——你鬼屋卫生间里就有一扇。你是推门人，你知道吗？',
    '高医生成红衣':'高医生将手术刀刺入心口，成为门后世界的神——红衣之上。',
    '父母在荔湾镇':'高医生留下的照片：陈歌的父母，失踪前一周，在荔湾镇与一个红衣小女孩对话。他们是自己走进门的。',
    '午夜灵车':'104路末班车，载满死者的夜行线。医生、情侣、溺亡者……红雨衣女人的孩子消失在车上。',
    '红雨衣女人':'曾是红衣，死于荔湾镇。她拦住陈歌：你见过我的孩子吗？——承诺一周内找回。',
    '影子怪':'自称被你杀死的孩子，东郊十大怪谈之首。张雅曾与它交手，手臂留下裂痕。',
    '东郊十大怪谈':'鬼火焚楼、吃人公路、隧道灵车、水鬼、冥胎……东郊的阴影正在逼近。',
    '小布·布忆':'三年前东郊失踪的女孩，分尸案受害者。她推开的门就在东郊——她是推门人。',
    '明阳小区104号':'三单元104号天花板壁画：姜龙一家四口咬着女孩四肢。四栋楼藏着四具尸。',
    '小布守门':'荔湾镇的推门人小布留下守门：门已失控，每天只能打开一分钟。我会替你守好它。',
    '红色高跟鞋':'荔湾镇的红衣，与陈歌达成协议：清诅咒，换自由。她开始为许音清除最重的诅咒。',
    '闫大年·心想事成':'红衣之下最强能力：每周一次，使用时漫画册永久消失一页。黑崎大蛇专程求见，合作出版。',
    '冥胎将出':'影子胸口长出的鬼婴，红衣之上。陈歌向白龙洞蜘蛛男孩示警，托张文宇寻其下落。',
    '常孤':'左眼剧组的导演，常雯雨的亲哥哥。左眼是雯雨的眼睛，右眼失明。他曾想挖掉雯雨的左眼破除诅咒。',
    '通灵鬼校=含江私立大学':'雯雨的影片里，网友不存在的人警告：含江私立大学就是通灵鬼校。陈歌的父母也曾去过那所学校。',
    '父母曾去过鬼校':'陈歌父母失踪前最后的轨迹，指向含江私立大学。',
    '秋美':'雯雨身体里唯一保住人性的灵魂——被红衣引入的替身。换眼手术失败后她成了新红衣，左眼空洞。',
    '左眼任务':'二星特殊任务：死人放映厅观影→找到常孤获其好感→前往含江精神病院看清雯雨梦的颜色。',
    '恶梦学院':'新海六层鬼屋。摄影部校服女鬼、四角游戏——他们按门后的日记还原了通灵鬼校的场景。',
    '摄影部校服女鬼':'合影照片里多出的女鬼，录像连放五遍后从幕布后钻出。',
    '四角游戏':'禁忌游戏招来了第五个人。三个孩子用稻草娃娃整死幼童：催命、勾魂、离魄。',
    '曲长林':'厕所怪谈里的小林，拼命合群却始终孤独的人偶天才。做最好的自己，蝴蝶自来。',
    '血丝缝字日记':'恶梦学院负一层课桌里找到，来自门后。末页：我，死，一三，通灵鬼校，逃。',
    '514病房':'含江中央医院514号乐园专属病室——被陈歌鬼屋吓晕的受害者病房。上官轻鸿与虚拟未来工程师结盟报复。',
    '通灵鬼校即将截止':'四星试炼通灵鬼校将在二十七小时后截止！截止后场景永远无法解锁！',
    '通灵鬼校营业':'四星场景通灵鬼校开放，鬼屋上热搜。怪谈教室、不存在的美术社、413宿舍——陈歌接管了一个直播间。',

    '江源小区':'17层无14层的居民楼，凌晨闭眼登顶的噩梦任务。十八层看见白大褂医生推年幼的自己下楼。',
    '红衣眷顾者':'第五次抽到厉鬼，称号升级：你会获得真相，也同时失去了一切。',

    '四星试炼·冥胎':'以整座城市为舞台，生与死的捉迷藏。九座神龛代表九个孩子，冥胎就藏在其中一人身上。九个夜晚之内必须找到它！',
    '九座神龛':'九个孩子，九个神龛，九尊泥塑。冥胎从孩子剥夺的能力与黑色手机给陈歌的天赋一一对应。',
    '还愿师称号':'累积获得一百次厉鬼或执念的祝福。真正的救赎，是在苦难之中找到生的力量和心的安宁。',
    '吴金鹏':'流浪歌手出身，照顾痴呆弟弟吴坤的顶梁柱。第五位活人员工。',

    '向暖':'第九个孩子。冥胎降生前吞掉两位凶神，向暖保留人性，温晴化巨鲸守护黑雾孤岛。',
    '噩梦小区':'金华小区与九鸿小区。黑雾如黑色海洋，小区如孤岛，黑雾内有巨大阴影。',
    '0004号病人':'被诅咒医院给布娃娃的编号。冥胎=陈歌的影子，做过布娃娃身体，与高医生联手逃出。',
    '布娃娃=冥胎':'冥胎就是陈歌的影子。它给自己做布娃娃身体，被遗弃、被医生诱引，成为0004号病人。',
    '高医生日记':'0011房日记：高医生曾是医院夜班医生，与布娃娃同囚，联手逃跑。怪谈协会=医院逃出的病人。',
    '黑色手机的真正目的':'医院在找能背负整座城市罪孽的灵魂以建造血色城市。黑色手机的真正目的，或许也是建造血色城市。',
    '冥胎=影子':'冥胎=陈歌的影子。它回到陈歌的影子上：找到你了。主动逃走的是你，为什么还要回来？',
    '绝望乐园':'完成四星试炼冥胎（80%），恐怖屋升级为绝望乐园，解锁救赎之门与九鸿小区（黑雾的世界）。',
    '101号病人':'被医院附身的新海情侣。医院分白班/夜班医生，院长撕下孩子脸取名不笑。',

    '二十年前的死者陈歌':'二十年前连环凶杀案，被害者全是与陈歌体型相似的孩子，最后死者叫陈歌。警方抓到的是替罪羊。',
    '两位凶神':'被诅咒医院除千脸凶神外还有两位凶神：院长、姓吃的凶神。活人分四种：百号外病人/白班医生/姓吃的人/不笑。',

    '姜龙一家':'姜龙、张初语、姜白、姜小虎。凶手骑电动车取走尸体的双腿——被鬼附身的贾明（姜龙）。',
    '活棺村完成度7%':'活棺村三星试炼完成度仅7%——怪谈协会搅局，祭祀未完成。绣娘的残念入册，用我的骨做针，用我的血做线，用我的皮做衣。',
    '手机鬼':'能操控手机、激发恐惧的鬼，实体是骨瘦如柴的小孩。冒充高汝雪引陈歌入法医学院，后被收服。',
    '流泪的雕像':'法医学院地下室会流血的石膏雕像，底座刻着：谎言拥有令人艳羡的外衣，真理却总是丑陋的。',
    '韩宝儿·挖眼案':'第三病栋六号病人，身体畸形恐惧症患者。五起挖眼案是仪式——5个罪人之眼嵌进血门上的恶鬼图案。',
    '消失的妻子':'隐藏试炼任务：刘娴娴的心上人刘哲坚信七年前车祸亡妻仍活着，每周三进入地下尸库。',
    '笔仙遗书':'凶手背着一具尸体，他称呼那具尸体为妻子！帮我照顾好王欣，为我报仇！——来者是十号。',
    '高医生的过去':'高医生亡妻车祸离世后曾想轻生。他符合怪谈协会十号的全部特征：见过面具、熟悉法医学院、手指修长。',
    '白龙洞隧道':'噩梦任务：凌晨2:44进44米以上隧道，走44步喊44声名字。完成后获天赋鬼耳。张雅刻下血字：他是……我的！',
    '童童':'手机鬼的本名。99个未接来电备注老妈。普明公寓水缸干尸，母亲守候花店七年——报警吧，不要让她再等了。',
    '门楠论红衣':'推门人死后直接成红衣；厉鬼晋升红衣须成为门主人或吞食完整红衣。许音的心口缺一块。张雅或是推门人。',
    '永生支线':'通灵鬼校第八条支线：地下尸库的未开放区域住着一群永生的人。生命的意义不在于是否会呼吸。',
    '地下尸库':'法医学院三星试炼。白漆运尸/无漆人行/红漆禁入三条通道，八号库房无档案，血苔藓下全是尸体垒墙。',
    '卫九卿':'九江法医学院教授，肺癌患者死后捐遗体。他记得一切——高医生就在最深处等你。',
    '怪谈协会会长=高医生':'地下尸库主人=怪谈协会会长。为复活亡妻推开门、以尸垒库，创立精神病人互助会。十号特征全部吻合。',
    '高医生现身':'你拥有一扇门——你鬼屋卫生间里就有一扇。你是推门人，你知道吗？',
    '高医生成红衣':'高医生将手术刀刺入心口，成为门后世界的神——红衣之上。',

    '午夜灵车':'104路末班车，载满死者的夜行线。医生、情侣、溺亡者……红雨衣女人的孩子消失在车上。',
    '红雨衣女人':'曾是红衣，死于荔湾镇。她拦住陈歌：你见过我的孩子吗？——承诺一周内找回。',
    '影子怪':'自称被你杀死的孩子，东郊十大怪谈之首。张雅曾与它交手，手臂留下裂痕。',

    '小布·布忆':'三年前东郊失踪的女孩，分尸案受害者。她推开的门就在东郊——她是推门人。',

    '红色高跟鞋':'荔湾镇的红衣，与陈歌达成协议：清诅咒，换自由。她开始为许音清除最重的诅咒。',
    '闫大年·心想事成':'红衣之下最强能力：每周一次，使用时漫画册永久消失一页。黑崎大蛇专程求见，合作出版。',
    '冥胎将出':'影子胸口长出的鬼婴，红衣之上。陈歌向白龙洞蜘蛛男孩示警，托张文宇寻其下落。',

    '通灵鬼校=含江私立大学':'雯雨的影片里，网友不存在的人警告：含江私立大学就是通灵鬼校。陈歌的父母也曾去过那所学校。',

function render(id){
  if(id){ state.node = id; }
  if(id === '__phone__'){ openPhone(); return; }
  const node = NODES[state.node];
  if(!node){ console.error('missing node', state.node); return; }
  if(node.act){
    state.flags.acted = state.flags.acted || {};
    if(!state.flags.acted[state.node]){ node.act(state); state.flags.acted[state.node] = true; }
  }
  logTimeline(node);
  document.getElementById('chapter').innerHTML = (node.ch||'') + (node.ch && state.days? `<span class="day">· 第${state.days}日</span>`:'');
  document.getElementById('title').innerHTML = (node.title||'').replace(/冒险屋|恐怖屋|鬼屋/g,'<span>$&</span>');
  const textEl = document.getElementById('text');
  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  fullText = node.text || '';
  textEl.innerHTML = '';
  typing = true;
  textEl.classList.add('typing');
  let i = 0;
  clearInterval(typeTimer);
  typeTimer = setInterval(()=>{
    if(i >= fullText.length){ finishTyping(node, textEl, choicesEl); clearInterval(typeTimer); return; }
    const ch = fullText[i++];
    if(ch === '<'){
      let tag = '';
      while(i < fullText.length && fullText[i] !== '>'){ tag += fullText[i++]; }
      if(i < fullText.length) tag += '>';
      textEl.innerHTML += tag;
    } else {
      textEl.innerHTML += ch;
    }
    textEl.parentElement.scrollTop = textEl.parentElement.scrollHeight;
  }, 14);
  save();
  updateHUD();
  updateCodex();
  renderTimeline();
  renderTasks();
}

function finishTyping(node, textEl, choicesEl){
  typing = false;
  textEl.classList.remove('typing');
  textEl.innerHTML = fullText;
  const wl = state.lastWheel;
  if(node.text && node.text.includes('id="wlname"') && wl){
    const n = document.getElementById('wlname'); if(n) n.textContent = '【'+wl.n+'】';
    const d = document.getElementById('wldesc'); if(d) d.textContent = wl.d;
  }
  (node.choices||[]).forEach(ch=>{
    const b = document.createElement('button');
    b.className = 'btn';
    const ok = !ch.req || ch.req(state);
    const label = document.createElement('span');
    label.textContent = ch.label;
    const right = document.createElement('span');
    right.className = 'arrow';
    // 分支类型标签：主线/支线/经营/日常
    const st = ch.st || node.st || 'main';
    const stName = {main:'主线', sub:'支线', bus:'经营', daily:'日常'}[st] || '主线';
    const stCls = {main:'main', sub:'sub', bus:'bus', daily:'daily'}[st] || 'main';
    const stTag = document.createElement('span');
    stTag.className = 'stag '+stCls;
    stTag.textContent = stName;
    right.appendChild(stTag);
    if(ch.tag){ const t=document.createElement('span'); t.className='tag'+(ch.tag==='OK'?' ok':''); t.textContent=ch.tag; right.appendChild(t); }
    right.appendChild(document.createTextNode(ok?'›':'✕'));
    b.appendChild(label); b.appendChild(right);
    if(!ok){ b.disabled = true; }
    b.onclick = ()=>{
      if(!ok) return;
      if(ch.act) ch.act(state);
      if(ch.inf && !state.reasoning.includes(ch.inf)) state.reasoning.push(ch.inf);
      render(ch.next);
    };
    choicesEl.appendChild(b);
  });
}

/* ===== 时间线系统 ===== */
function logTimeline(node){
  if(!node || !node.ch) return;
  if(node.ch !== state.lastTLCh){
    state.timeline = state.timeline || [];
    state.timeline.push({d:state.days, ch:node.ch, title:node.title||node.ch, st:node.st||'main', node:state.node});
    state.lastTLCh = node.ch;
  }
}
function tlStName(st){ return ({main:'主线', sub:'支线', bus:'经营', daily:'日常'}[st]||'主线'); }
function renderTimeline(){
  const el = document.getElementById('tlList');
  if(!el) return;
  const t = state.timeline || [];
  const dayEl = document.getElementById('tlDay');
  if(dayEl) dayEl.textContent = '第 ' + (state.days||1) + ' 日';
  if(!t.length){ el.innerHTML = '<div class="tl-empty">时间线尚未展开<br>经历剧情后自动记录</div>'; return; }
  el.innerHTML = t.slice().reverse().map((e,i)=>{
    const cur = (e.node === state.node);
    const stCls = {main:'main', sub:'sub', bus:'bus', daily:'daily'}[e.st]||'main';
    return `<div class="tl-item${cur?' cur':''}">
      <div class="tl-ch">D${e.d} · ${e.ch||''}</div>
      <div class="tl-title">${cur?'▶ ':''}${e.title}</div>
      <div class="tl-meta"><span class="stag ${stCls}">${tlStName(e.st)}</span></div>
    </div>`;
  }).join('');
}
/* ===== 任务页签：主线 / 支线 / 日常 ===== */
function renderTasks(){
  const el = document.getElementById('tlTasks');
  if(!el) return;
  const done = state.reasoning||[];
  const main = REASON.filter(r=>r.type==='主线');
  const sub = REASON.filter(r=>r.type==='支线');
  const mainN = main.filter(r=>done.includes(r.id)).length;
  const subN = sub.filter(r=>done.includes(r.id)).length;
  const html = `
    <div class="psec" style="margin-top:8px">主线任务 · ${mainN}/${main.length}</div>
    <div class="task-card"><div class="tt"><b>经营恐怖屋</b><span class="st2">日常</span></div><p>接待游客、积累尖叫值。每次营业都是一次经营事件，会写入时间线。</p></div>
    ${main.slice(0,3).map(r=>{
      const d = done.includes(r.id);
      return `<div class="task-card${d?' done':''}"><div class="tt"><b>${d?'✔':'○'} ${r.label}</b><span class="st2">主线</span></div><p>${r.desc}</p></div>`;
    }).join('')}
    <div class="psec">支线任务 · ${subN}/${sub.length}</div>
    ${sub.slice(0,4).map(r=>{
      const d = done.includes(r.id);
      return `<div class="task-card sub${d?' done':''}"><div class="tt"><b>${d?'✔':'○'} ${r.label}</b><span class="st2">支线</span></div><p>${r.desc}</p></div>`;
    }).join('')}
    <div class="psec">日常 · 尖叫值 ${state.scary||0}</div>
    <div class="wheel-zone">
      <div class="wl"><span>恐怖大转盘</span><b>${state.wheelSpins||0} 次机会</b></div>
      <button class="wheel-btn" ${(state.scary||0)>=100?'':'disabled'} onclick="spinWheel()">投入 100 尖叫值 · 转一次</button>
      <div id="wheelResult"></div>
      <div class="tip">转盘里只有厉鬼、与鬼相关的物品，和死者遗留的杂物——灵果、神药？那只是善意的欺骗。</div>
    </div>
  `;
  el.innerHTML = html;
}
function tlTab(which, btn){
  document.getElementById('tlList').style.display = which==='tl_list' ? '' : 'none';
  document.getElementById('tlTasks').style.display = which==='tl_tasks' ? '' : 'none';
  document.querySelectorAll('.tl-tabs button').forEach(b=>b.classList.remove('on'));
  if(btn) btn.classList.add('on');
  if(which==='tl_tasks') renderTasks();
}
function toggleSide(which){
  const wrap = document.getElementById('wrap');
  wrap.classList.remove('show-tl','show-codex');
  if(which==='tl'){ wrap.classList.toggle('show-tl'); if(wrap.classList.contains('show-tl')) renderTimeline(); }
  if(which==='codex'){ wrap.classList.toggle('show-codex'); if(wrap.classList.contains('show-codex')) updateCodex(); }
}

  if(it.useFn) it.useFn(s);
  if(it.consumable) s.items = s.items.filter(x=>x!==id);
  save(); renderItemsTab(); updateHUD();
  const res = document.getElementById('itemResult');
  if(res) res.innerHTML = `<div class="item-result"><b>使用【${it.name}】</b><br>${it.useDesc||'生效了。'}</div>`;
}

/* ===== 恐怖大转盘（原文：投入游客尖叫值换转动次数） ===== */
const WHEEL_POOL = [
  {w:26, type:'junk', name:'游客遗失的钥匙', desc:'锈迹斑斑，不知道是哪位游客忘在这里的执念。'},
  {w:20, type:'junk', name:'半根红蜡烛', desc:'死者遗物，燃尽的是别人的遗憾。'},
  {w:16, type:'junk', name:'生锈的硬币', desc:'正面朝上——投进许愿池，也许能换一次好运。'},
  {w:6,  type:'item', name:'一把纸钱', desc:'烧给死者的纸钱——营业时撒出去，能引来"贪财"的客人。', item:'纸钱'},
  {w:5,  type:'item', name:'黄符', desc:'朱砂画就的驱邪符，贴在新场景门口，能安抚游客。', item:'黄符'},
  {w:4,  type:'item', name:'剪纸纸人', desc:'陈歌亲手剪的替身纸人——放在胸口，能替你挡下一次灾厄。', item:'纸人'},
  {w:3,  type:'item', name:'桃木剑', desc:'道观请来的桃木剑，辟邪镇宅，营业收入略有提升。', item:'桃木剑'},
  {w:12, type:'item', name:'怨念缠绕的圆珠笔', desc:'笔仙用过的笔，握紧它，也许能听见笔尖写字的声音。', item:'怨念缠绕的圆珠笔(残破)'},
  {w:9,  type:'item', name:'白色情人节的糖果', desc:'甜到发苦，含在嘴里，仿佛能看到她。', item:'白色情人节的糖果'},
  {w:8,  type:'ghost', name:'一缕残念', desc:'死者留给世界的最后一句"谢谢"，随风飘散。'},
  {w:6,  type:'ghost', name:'红衣的碎片', desc:'从张雅血衣上飘落的布片——握紧它，她就在你身后。'},
  {w:2,  type:'secret', name:'灵果（？）', desc:'据说能增加寿命、改善体质——但善念说：那只是善意的欺骗。'},
  {w:1,  type:'jackpot', name:'张雅的红衣', desc:'她最初遇见你时穿的那件红衣。你抽中了她——那一年，你在转盘里抽到过张雅。'}
];
function spinWheel(){
  const s = state;
  if((s.scary||0) < 100){ return; }
  s.scary -= 100;
  s.wheelSpins = (s.wheelSpins||0) + 1;
  s.pulls = (s.pulls||0) + 1;
  const pool = WHEEL_POOL;
  let total = pool.reduce((a,p)=>a+p.w, 0);
  let r = Math.random()*total, acc = 0, pick = pool[pool.length-1];
  for(const p of pool){ acc += p.w; if(r < acc){ pick = p; break; } }
  let extra = '';
  if(pick.type==='item' && pick.item){
    if(!s.items.includes(pick.item)){ s.items.push(pick.item); extra = ' · 已收入道具库'; }
    else { s.scary += 20; extra = ' · 已有同类，返还 20 尖叫值'; }
  }
  if(pick.type==='ghost' || pick.type==='jackpot'){
    s.ghostPulls = (s.ghostPulls||0) + 1;
    if((s.ghostPulls||0)>=5 && s.title==='厉鬼眷顾者') s.title='红衣眷顾者';
    if((s.ghostPulls||0)>=15 && s.title==='红衣眷顾者') s.title='神之眷顾';
    if(pick.type==='jackpot' && !s.employees.includes('张雅·凶神') && !s.employees.includes('张雅')){
      s.employees.push('张雅'); extra = ' · 张雅入册！';
    } else if(pick.type==='ghost'){
      extra = ' · 化为尖叫值 +30'; s.scary += 30;
    } else { extra = ' · 她早已在你身边'; }
  }
  if(pick.type==='secret'){ extra = ' · 一瞬幻梦，醒来只剩指尖的冷'; }
  s.lastWheel = {n:pick.name, d:pick.desc};
  save();
  const el = document.getElementById('wheelResult');
  if(el) el.innerHTML = `<div class="wheel-result"><b>【${pick.name}】</b><br>${pick.desc}${extra}</div>`;
  renderTasks(); updateHUD();
}

function skipType(){
  if(typing){ clearInterval(typeTimer); finishTyping(NODES[state.node], document.getElementById('text'), document.getElementById('choices')); }
}

function resetGame(){
  state = defaultState();
  render('start');
}

updateHUD();
updateCodex();
render(state.node);
</script>
