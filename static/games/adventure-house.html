  text:'毁容脸死后，第三病栋任务完成度涨到80%。颜队发现：25分钟前，小顾手机上收到一条信息——"陈歌，我记住你的名字了。"发信人是老王（王大军），但老王手机早被拿走。\n\n"还有一个协会成员藏在这栋楼里！"陈歌追查——第一个进楼的侦查员昏迷后被送进医院。\n\n人民医院，凌晨。昏迷的侦查员（姚庆一）睁开眼，梦游般走下床，避开监控溜进后巷。\n\n巷口，陈歌提着碎颅锤等他："我已经等你很久了。"\n\n"杀了我对你没好处，这只是我藏在替身鬼里的一道意志。"姚庆一的脸上露出诡异的笑："放我走，我告诉你门形成的原因，以及关门和开门的方法。"\n\n"门后的世界是一片血红……只有人格崩坏、失去所有希望的人，才有一丝机会推开这扇门。"\n\n警笛响起，颜队带人赶到。姚庆一爬上医院楼顶，张开双臂向后倒去——"陈歌，你的名字我记住了。下次见面，我会给你一个惊喜。"\n\n他临死前用嘴型说出两个字：<b>门楠</b>。\n\n怪谈协会折损大半，剩三人：吴非、十号、会长。张雅吞掉太多鬼物陷入沉睡，陈歌实力空档。他望着自己长发女人的影子——那是张雅留下的威慑。\n\n"在下一个星期三来临之前，要彻底让怪谈协会消失。"',
  choices:[

p9_fuliyuan:{
  ch:'第二百八十一至二百八十五章', title:'九江儿童福利院',
  act:s=>{ if(!s.clues.includes('江铃与朱新柔')) s.clues.push('江铃与朱新柔'); if(!s.items.includes('蜘蛛尸体·朱新柔')) s.items.push('蜘蛛尸体·朱新柔'); if(!s.employees.includes('范郁·福利院')) s.employees.push('范郁·福利院'); },
  text:'"范郁的姐姐是一只蜘蛛？"陈歌赶到九江儿童福利院。\n\n老院长诉苦：范郁不配合治疗，还"带坏"别的孩子——他对孩子们说的那些奇怪的话，陈歌知道都是真的。\n\n卧室里，江锦和江鹤两个男孩打碎了小女孩江铃的玻璃杯，踩死了里面的蜘蛛。江铃大哭："他们杀了我姐姐！"\n\n范郁放下画笔，把手搭在女孩头顶："姐姐它没死，只是暂时离开了。"他举起画：画上，一个怪物趴在女孩身后，四肢像蜘蛛的步足一样半弓在地。\n\n"快看，姐姐跑到那个人身后去了。"范郁看向门口的陈歌。\n\n陈歌全身绷紧——那个怪物，就在他身后。\n\n女护士讲起江铃的过去：一家四口住林官村，父亲承包桃林。姐姐先失踪，随后父母被投毒害死，江铃是唯一幸存者——她认知错乱，把蜘蛛叫姐姐，把被子叫妈妈，把绳子叫爸爸。\n\n"她姐姐叫什么？""朱新柔。"\n\n陈歌把被踩扁的蜘蛛郑重收进塑料瓶。离开时，李队警告他："离那个小女孩远一点。警方锁定的唯一具有行凶能力的，就是她。"\n\n"她说，人死后会变成其他东西。"',
  choices:[
    {label:'深夜，前往林官村的桃林', tag:'', next:'p9_taolin'}
  ]
},

p9_taolin:{
  ch:'第二百八十六至二百八十八章', title:'林官村·桃林',
  act:s=>{ if(!s.clues.includes('林官村桃林')) s.clues.push('林官村桃林'); if(!s.clues.includes('熊青落网')) s.clues.push('熊青落网'); },
  text:'深夜十一点半，陈歌摸到林官村——黑漆漆的村子像一排排没有合拢的棺材。"林官村，林字拆开，不就成木棺村了？"\n\n李队电话："熊青落网了！这疯子这几天一直徘徊在新世纪乐园周围……"第三病栋试炼任务完成度涨到87%。\n\n翻过两座山，桃林里有一盏灯——一个白发老人正在用锄头挖地。陈歌谎称迷路的驴友，老人答应留他住一晚，反复叮嘱："不管听见什么，都不要出去。"\n\n四间木屋——那是江铃一家曾经住的地方。门锁在门外，像要关住什么。陈歌悄悄溜出，贴着老人房门倾听——屋里传来压抑的声响。\n\n雨夜、桃林、四间木屋、一个深夜挖地的老人……江铃说姐姐长这样（蜘蛛），姐姐叫朱新柔。而桃树根须下，埋着谁的头颅？\n\n（此处通向三星试炼——活棺村。）',
  choices:[
    {label:'阶段九 · 完。前往桃林深处，挖出真相', tag:'', next:'p9_end'}

},

  text:'从田藤病院砸场到怪谈协会夜袭，陈歌的恐怖屋在生死间又壮大了一圈。\n\n阶段九落幕：\n· 特殊建筑<b>猛鬼的换衣间</b>入手，二次扩建完成，三次扩建将升级为<b>颤栗迷宫</b>。\n· 二星场景<b>西郊私立学院</b>解锁（站着上吊的人+恶臭）。\n· 员工：<b>许音</b>（特殊厉鬼）入册、<b>顾飞宇</b>入职；张雅好感度突破<b>情不自禁</b>，影子变成长发女人的形状。\n· 真相：<b>怪谈协会</b>是第三病栋隐藏任务——十名黑袍会员、会长身份成谜；逼死张雅的<b>朱秀</b>伏法；四星试炼<b>通灵鬼校</b>触发（第八条支线"永生"=法医学院地下尸库）。\n· 支线：<b>江铃</b>的姐姐朱新柔失踪、父母被投毒——线索指向林官村桃林。\n· 二十万奖金"不可能通关的游戏"上线，鬼屋游客量创历史新高。\n\n接下来：桃林深处埋着朱新柔的遗骸——三星试炼<b>活棺村</b>，就在前方。',

p5_start:{

  act:s=>{ if(!s.clues.includes('朱新柔的遗骸')) s.clues.push('朱新柔的遗骸'); },
  text:'雨夜桃林，江铃的姐姐——那个蜘蛛脸女人从木屋窗口挤进来，数只纤细手臂扒着窗框。陈歌掏出江铃送的塑料瓶（装着一只被踩扁的蜘蛛），女人看到后情绪缓和。他劝她放下执念："你的冤屈我来洗刷。"女人吐了一道蛛丝，窜入桃林消失。\n\n\n白大爷招供：朱家父母被毒杀，凶手竟是小女儿江铃——她把姐姐朱新柔头朝下埋进桃树根须之下。两人挖开树坑，竖直的女尸双臂下方是畸形的小手。黑色手机震动：<span class="clue">触发三星恐怖场景——活棺村试炼任务！请在一周内确定是否接受。</span>朱新柔好感度上升至略有好感。',  choices:[

  text:'朝阳升起，陈歌在鬼屋门口抽奖，消耗一百次尖叫——转盘停下，稀有道具<span class="gift">无法打开的抽屉</span>（概率百分之一）！描述只有一段话："我在书桌的抽屉里藏了一把刀……可等我打开抽屉的时候才发现，原来那个人并不是藏在客厅里。"\n\n\n累计抽中五次厉鬼后，厉鬼眷顾者称号将自动升级——这是第四个。工具间没有出现抽屉，木桌抽屉里却多了一张破旧的出租广告：<span class="clue">九江第三医院员工家属院，304号，两室一厅，900元/月。</span>\n\n鬼屋营业照常：二星场景暮阳中学通关纪录被九江医大十二人队刷新；有一队游客挑战三星第三病栋，进门看到走廊无数坟包似的被褥和假人后直接放弃。',  choices:[

  text:'福利院里，范郁还在画红黑两色的画。江铃听到"林官村""活棺村"后突然安静，抓住陈歌的衣袖："不要去。那里很危险……别碰棺材。去了就回不来了。"\n\n\n范郁塞给陈歌一幅画：白纸中央一个黑笔小女孩，身后是巨大的红色蜘蛛怪物；仔细看，小女孩左右手上各缠着一个哭泣的红色小人——她的父母。这是提醒：江铃身边有东西在守护，也有东西在逼近。\n\n陈歌向范郁提出搬去鬼屋住，承诺给他办入学、交朋友。范郁没有表态，又埋头画第三张画。',  choices:[

p5_304:{
  st:"sub",
  ch:'第二百九十六章 · 消失的手', title:'凶宅 304',
  act:s=>{ if(!s.clues.includes('304凶宅三任房客')) s.clues.push('304凶宅三任房客'); },
  text:'第三医院家属院没有门牌号，居民一听"304"就关灯。中介男（黑衬衫）带陈歌看房，掏出钥匙编号却是305——304是凶宅：第一任户主赌徒欠高利贷跳楼，被砍了一只手，至今没找到。\n\n\n陈歌偏要304，五百块试住一晚。中介男走后，中介公司来电："区域经理出车祸了，三天后再来吧。"陈歌撕下钥匙上的贴纸——下面歪歪斜斜写着305。带他看房的是鬼！\n\n真正的304从里面反锁，陈歌抡碎颅锤砸开。屋内所有抽屉衣柜都被木板钉死，录像带从电视柜抽屉里滚落。高瘦男人（赌徒鬼）、中介女声（英语老师鬼）、老太太（房东鬼）轮番劝他离开。陈歌拨通中介电话，平静地问：<span class="clue">"请问，你是鬼吗？"</span>对面挂断了。',  choices:[
    {label:'放录像带，看屋里的灵异记录', next:'p5_tapes'}
  ]
},

  text:'录像带里是一台摄像机对着客厅的固定画面，快进到后半段，灯光忽明忽暗，每当变暗，卧室门就打开一点——第七次闪动时，一缕黑发从门后露出。录像里的场景和现实重叠，当灯全灭，陈歌抡锤砸向身后！\n\n\n打碎的鞋柜里，所有鞋子都被水果刀刺穿；老太太堵在门外说英语老师被情杀"分装进抽屉"，但她自己也是鬼。中介发来短信："那小区有一个老太太的鬼魂，常寻着光亮找回家的路。"\n\n陈歌谁都不信，唤出许音追打老太太鬼魂，她断臂逃走。最后一个房间上了锁——砸开，是漫画家的卧室。',  choices:[

  text:'漫画家小屋：一抽屉退稿信、黄皮笔记本（三年画稿收入一千二百元，一千元是房东老太太资助的）、报纸夹缝"中年男人勇救落水儿童溺亡"的新闻。第三个抽屉怎么都拉不开——许音抓住抽屉两侧，伤口崩裂，血迹渗入缝隙，抽屉里伸出好几只人手阻拦，最终主动弹开。\n\n\n里面是手工制作的漫画册，五个故事：赌徒（为救母借高利贷、砍手跳楼）、英语老师（被情杀）、销售员（被恶鬼缠身倒霉至死）、房东老太太（精神失常）、漫画家本人（屡遭退稿）。真相：<span class="clue">现实中的鬼怪躲藏进了他的漫画里。</span>\n\n漫画最后一页空白处浮现四个字：<b>请多关照。</b>黑色手机：获得红衣之下最强厉鬼——<span class="gift">闫大年</span>！能力一厉鬼亲和；能力二画魂（目睹厉鬼后有一定概率将其拖入画中，红衣除外）；能力三？？？。陈歌以闫大年的名义连载恐怖漫画《灵楼鬼客》，直播间关注飙到五十一万。老太太的鬼魂也钻进了画册。',  choices:[

  text:'颜队来电：第三病栋外逃的精神病犯案了。两名死者——一个抢劫犯、一个通缉犯——都被挖去双眼，死因不明。陈歌提醒："他们做什么都尽量和三挂钩。"\n\n\n第三个死者出现：临江血防站职工，唯一清白的人。他被挖去双眼，背部皮肤被撕掉一块，用血肉刻出一扇半开的门，门中画着一个笑得很开心的女孩——<span class="clue">江铃！</span>那图案和第三病栋老院长信里"临江新区血防站陈医生"的地址暗合。\n\n陈歌拨通福利院电话：范郁和江铃不见了，陈医生也不见了，屋内一切正常，像是自愿离开。',  choices:[

  ch:'第三百一十一章 · 哭够了吗', title:'山谷里的替死鬼',
  act:s=>{ if(!s.clues.includes('山谷的棺材')) s.clues.push('山谷的棺材'); },
  text:'白大爷讲起年轻时的事：父亲背着他走出棺村，后背上趴着一个"人"，一路催他快走。山谷里半埋着空棺——棺材村的习俗，沿路两边节节垫高，取"升官发财"之意。\n\n\n陈歌故意放慢速度断后，引身后的鬼怪上钩。白猫挣扎着钻出背包预警后蹿走，一双冰冷的手从两边抓住陈歌肩膀，耳后响起哭丧般的女人声音。陈歌猛然回头：<span class="clue">"哭够了吗？哭够了，那就上路吧。"</span>复读机按下，半身红衣的许音把那只鬼从陈歌身上拽下，撕成碎片吞食。白猫又蹿回来，跳到陈歌肩上，死活不肯回包里。',  choices:[
    {label:'走出山谷，直面挂满白灯笼的活棺村', next:'p5_village'}
  ]
},

p5_village:{
  ch:'第三百一十二章 · 天黑莫敲门', title:'活棺村',
  act:s=>{ if(!s.clues.includes('活棺村的风俗')) s.clues.push('活棺村的风俗'); },
  text:'大山深处的活棺村：家家户户门前挂白纸灯笼，门上贴白色倒福，不见星月。黑色手机震动：<span class="clue">找到活棺村，是否接受三星试炼？任务提示：那一天，除了我，他们都来了。</span>陈歌选择接受。\n\n\n一个低着头的诡异老太太带路："天黑别乱敲门，小心开门的不是人。"她安排住处："屋里有三间房，你们一人一间。"——老宅中央摆着三副黑色棺材，里面各放一件大红色寿衣。红白颠倒，活人家里停棺，这村子处处与活人反着来。\n\n白大爷认出老太太是林官村黑白照片里的死者。陈歌决定不跑了，反手埋伏：老魏蹲窗下，白大爷躲棺后，自己守门后。一家三口鬼影深夜回宅，许音十几秒内将三道鬼影撕成血斑。',  choices:[
    {label:'捡起纸人，追上那件跟踪的大红寿衣', next:'p5_ghosts'}
  ]
},

p5_ghosts:{
  ch:'第三百一十六章 · 寿衣', title:'阿庆',
  act:s=>{ if(!s.clues.includes('阿庆的寿衣')) s.clues.push('阿庆的寿衣'); },
  text:'纸人上写着逃难者的名字——朱凤喜，被一个鬼小孩用指甲折磨。街道上，一件大红色寿衣一直跟着他们，最后寿衣从中间解开，里面藏着一个又矮又瘦、手臂畸形的男人：<b>阿庆</b>。\n\n\n阿庆讲了活棺村的秘密：多年前村子拐来一个读书人家的媳妇，女人烈性，跳井而死，一尸两命。她的鬼魂血洗村子，杀掉所有身体正常的人，把畸形怪物困在村里世世代代——<span class="clue">"祖先的血脉已经被污染，身体正常的人会被杀掉，只有畸形能够让她开心。"</span>朱姓女人当了村长，是女鬼管理村庄的工具。每年女鬼投井日举行祭祀，近三个月出生的婴儿被送进祠堂。阿庆的孩子是正常男孩，他求陈歌把孩子带出去："你们一定要带着他离开！"',  choices:[
    {label:'潜入祠堂地道，见二楼小楼里的老人', next:'p5_sacrifice'}
  ]
},

p5_sacrifice:{
  ch:'第三百二十三章 · 仅有的善良', title:'被厉鬼眷顾的人',
  act:s=>{ if(!s.items.includes('暖玉红绳')) s.items.push('暖玉红绳'); if(!s.clues.includes('朱淑梅的牺牲')) s.clues.push('朱淑梅的牺牲'); },
  text:'祭祀开始：朱姓女人朱淑梅手持沾血剪刀，逐个查看竹篮里的婴儿，村民以为孩子在送死。陈歌从祠堂地道钻进二层小楼——婴儿都在，嘴上含着安神草叶。朱淑梅用家禽血骗过女鬼，把孩子藏起来保护。\n\n\n隔间里躺着一位严重驼背的老太太，她是"被厉鬼眷顾的人"，曾救过女鬼三次。真相：女鬼血洗村子后本要离开，却推开了一扇血门，从门后出来后仇怨缠身，彻底变成另一个人。老太太用自己的人情保下逃走的村民二十年平安。\n\n她赠陈歌一条暖玉红绳："长时间和厉鬼呆在一起，阴气会越来越重……多去人气旺的地方，多晒太阳。"并叮嘱：<span class="clue">"看见开着的门别进去，听见有人叫喊别答应，遇见亮光赶紧躲，不出村子不要碰棺材。"</span>陈歌提走了阿庆的孩子——那个脖子上挂铜钱的婴儿。',  choices:[
    {label:'怀抱婴儿冲出祠堂，躲开喊魂与群鬼', inf:'r_zhushumei', next:'p5_hunt'}
  ]
},

p5_hunt:{
  ch:'第三百二十五章 · 喊魂', title:'嫁衣女鬼',
  act:s=>{ if(!s.clues.includes('嫁衣女鬼')) s.clues.push('嫁衣女鬼'); },
  text:'冤魂苏醒，女人声音在耳边呼喊名字，越来越像最亲近的人。白大爷差点回头应答，被陈歌按住："不要回头！不要答应！"檐鬼倒挂屋檐，墙灵从墙壁伸出手，白大爷护住婴儿被抓伤，陈歌抡锤砸墙。\n\n\n他追一只带血迹的鬼影冲进村长家：正堂贴着白色囍字，供桌红烛自燃，身穿残破大红嫁衣的女人从卧房探出头——她幻化成陈歌记忆中最深刻的人：<span class="clue">张雅！</span>陈歌全身战栗，挣脱控制："张雅？！"女鬼是村长女儿，大婚当夜遭血洗。许音与嫁衣女鬼（半身红衣）厮杀，陈歌翻动漫画册放出鬼影围攻新郎鬼。女鬼最终被许音吞食，许音带着满身血迹回到磁带——他正在向红衣蜕变。',  choices:[
    {label:'引开全村鬼怪，让老魏白大爷先带孩子走', next:'p5_breakout'}
  ]
},

p5_breakout:{
  ch:'第三百三十一章 · 一定要把孩子带出去', title:'阴丧',
  act:s=>{ if(!s.clues.includes('阴丧队伍')) s.clues.push('阴丧队伍'); },
  text:'轿鬼（两个涂脸小孩）跟在后面，白大爷喊出它的名字后追悔莫及。阴丧队伍——死人给死人送葬——堵住去路，抬棺鬼扛着黑棺。陈歌一锤砸在棺材正中央，木屑纷飞，棺材里几道残念对他作揖后随风消散。四个抬棺鬼脸色发绿，全村鬼怪开始疯狂追赶他。\n\n\n陈歌把地图塞给白大爷，独自站在路中央挡住阴丧队伍："就当是为了那个婴儿，他出生在黑暗之中，还没有见过这世界的美好，你们一定要带他离开！"白大爷和老魏抱着孩子跑向村外，陈歌领着一村子的鬼怪冲向村子西边——那里，朱淑梅抱着红衣鬼婴，正与两个黑袍人对峙。朱新柔（江铃姐姐）被一只六道身影交织的瘦长鬼影压制。陈歌大喊"跟紧我"，把全村鬼群引向黑袍人：祸水东引！',  choices:[
    {label:'趁乱躲进角落，看黑袍人放出熊青', next:'p5_xiong'}
  ]
},

p5_xiong:{
  ch:'第三百三十三章 · 全都乱套了', title:'熊青红衣',
  act:s=>{ if(!s.clues.includes('熊青红衣')) s.clues.push('熊青红衣'); },
  text:'黑袍人打开木盒，黑色血渍凝成红衣——<b>熊青</b>！本该在医院抢救的偏侧综合征患者成了红衣厉鬼，半边身体被血丝撕烂。陈歌被血丝裹住拖向熊青，口袋里的漫画册自己翻动，闫大年画出熊青的外貌——红衣停顿不到一秒，陈歌钻出血丝缝隙逃出生天。\n\n\n另一个黑袍人（第三病栋九号病人<b>吴非</b>）唤出满身是脸的红衣，来自"门"后的世界。怪谈协会的真正目的：吞掉活棺村那个受伤的顶级红衣女鬼。血脸红衣钻入村民身体验证，黑袍人摊牌：林官村三十四口人全被做成纸人，唯独江铃不在——女鬼最可能附身在江铃身上。\n\n满身是脸的红衣扑向江铃。陈歌从墙角冲出，一手抱一个孩子狂奔："以后要叫我叔叔！"江铃的声音突然变得像成年女人："往村子西边靠，进左数第三个宅院。"',  choices:[
    {label:'冲进第三处宅院，看江铃推开血门', inf:'r_wufei', next:'p5_door'}
  ]
},

p5_door:{
  ch:'第三百三十六章 · 噩梦开始的地方', title:'江铃的血门',
  act:s=>{ if(!s.clues.includes('江铃的血门')) s.clues.push('江铃的血门'); },
  text:'江铃咬破手腕，血淋在掌心，轻轻靠在木门上——门上浮现厚厚的血渍："这些血都是我曾经留下的，这屋子就是我噩梦的开始。"她推开血门，门后是血红色的世界：浓雾、畸形村民，全是她噩梦里村民的样子。\n\n\n任务提示在此刻解开：<span class="clue">"那一天，除了我，他们都来了"——那是"我"的葬礼，他们来为"我"送丧。破局的关键和葬礼有关。</span>村子中心，畸形村民跪成一片"忏悔"，祠堂门口堵着一副红棺。江铃掀开头发，后脑缺少一块骨头。她走入红棺，把自己的血涂在棺中女人手上。满身是脸的红衣追进血门，黑袍人拿着血丝瓶子逼近——那是怪谈协会在门后找到的、隐藏着红衣秘密的东西。',  choices:[
    {label:'放白猫咬走瓶子，唤女鬼苏醒', inf:'r_jiangling', next:'p5_cat'}
  ]
},

p5_cat:{
  ch:'第三百三十八章 · 哪来的猫？', title:'欠你一块骨头',
  act:s=>{ if(!s.items.includes('范郁的玉镯')) s.items.push('范郁的玉镯'); if(!s.clues.includes('白猫吞血丝')) s.clues.push('白猫吞血丝'); },
  text:'黑袍人的血丝快要钻进江铃后脑，陈歌甩出背包——白猫从包里窜出，一口咬住瓶子窜上房顶，瓶口滑落的血丝掉进它嘴里，被一口吞下！黑袍气到发抖："给我抓住它！我要剖开它的肚子！"满身是脸的红衣被引开，陈歌抡锤追杀黑袍："人还是要靠自己！"\n\n\n红棺里的女人睁开眼睛，双瞳倒映着江铃："我欠你一块头骨，以后我可以帮你做一件事情。"她操纵全村血雾锁住血脸红衣，把怪物身上所有的脸取下来扔进红棺，又吊起跪倒的畸形村民。她送给范郁一只玉镯："你能看到它们，戴上这个，它们就不会欺负你了。"黑袍被自己的血丝吞食，死前留下最后一句话：<span class="clue">"会长就在你身边，他一直关注着你。"</span>吴非死了——但黑色手机没有收到提示。',  choices:[
    {label:'带两个孩子走出血门，等天亮', inf:'r_baimao', next:'p5_end'}
  ]
},

p5_end:{
  ch:'第三百四十章 · 裂开了', title:'阶段五 · 完',
  act:s=>{ if(!s.scenes.includes('活棺村')) s.scenes.push('活棺村'); if(!s.talents.includes('厉鬼眷顾者·五次')) s.talents.push('厉鬼眷顾者·五次'); s.grievance+=25; s.tourists+=350; s.reputation+=35; },
  text:'范郁用玉镯渗出的血推开血门，带陈歌和昏迷的江铃离开门后世界。二层小楼里的老太太失踪了——她早已离去。村子西边传来一声枪响，天边泛起蒙蒙亮光。\n\n\n朱淑梅瘫倒在水井旁，口中重复着两个字：<span class="clue">"裂开了、裂开了。"</span>十号已经离开，熊青和鬼婴都不见了踪影。吴非之死没有触发黑色手机提示——会长另有其人，他就在陈歌身边。\n\n阶段五落幕：\n· 桃林挖出朱新柔遗骸，触发三星试炼<b>活棺村</b>。\n· 304 凶宅：无法打开的抽屉里藏着漫画家<b>闫大年</b>（红衣之下最强厉鬼）的漫画册，五个故事拼出五房客的过去，<b>雇佣闫大年</b>。\n· 血防站三起挖眼凶杀，背部刻着江铃的画像；范郁江铃失踪，四张画指向活棺村。\n· 冥村之夜：白灯笼、红寿衣、三副活棺、阴丧队伍、嫁衣女鬼、喊魂——许音吞食嫁衣女鬼，向红衣蜕变。\n· 江铃推开血门（她噩梦开始的地方），白猫吞下红衣秘密的血丝，女鬼苏醒撕碎怪谈协会的红衣，欠江铃一块头骨。\n· 吴非死而不亡，<b>怪谈协会会长</b>身份成谜——"他就在你身边"。\n· 三星场景<b>活棺村</b>解锁，闫大年入住鬼屋。',  choices:[
    {label:'进入阶段十 · 地下尸库与怪谈协会（Ch341 绣娘的嫁衣）', hint:'三星试炼：高医生的门', next:'p10_start'},
    {label:'进入阶段十 · 地下尸库与怪谈协会（Ch341 绣娘的嫁衣）', hint:'三星试炼：高医生的门', next:'p10_start'},
    {label:'进入阶段六 · 荔湾镇与影子（Ch531 把所有红衣都叫上）', hint:'三星半：血雾之城，冥楼与冥胎', next:'p6_start'},
    {label:'打开黑色手机，查看完整推理树与新场景', tag:'', next:'__phone__'},
    {label:'回到阶段四尾声', next:'p4_end'},
    {label:'回到开篇，重温起始', next:'start'}
  ]
},

// ===================== 阶段十 · 地下尸库与怪谈协会会长 =====================
p10_start:{
  ch:'第三百四十一至三百四十二章', title:'绣娘的嫁衣',
  act:s=>{ if(!s.items.includes('绣娘的嫁衣')) s.items.push('绣娘的嫁衣'); if(!s.employees.includes('绣娘的残念')) s.employees.push('绣娘的残念'); if(!s.clues.includes('活棺村完成度7%')) s.clues.push('活棺村完成度7%'); },
  text:'活棺村三星试炼落幕。黑色手机结算：\n\n<span class="clue">"幸运的厉鬼眷顾者！恭喜你完成随机三星试炼任务——活棺村！全新恐怖场景已解锁！任务完成度：百分之七。获得随机任务奖励——绣娘的嫁衣！用我的骨做针，用我的血做线，用我的皮做衣。"</span>\n\n"恭喜你获得特殊种类厉鬼——绣娘的残念。"\n\n陈歌消化着信息：活棺村是一座坟，村民都是陪葬的纸人，朱姓女人是守墓人，女鬼想要重生。江铃和范郁已从门后世界回来，范郁手里多了一枚血红纹玉镯。\n\n"完成度只有百分之七……因为怪谈协会搅局，祭祀没有完成。"陈歌把绣娘的嫁衣收好。\n\n鹤山打来电话："老大！高汝雪的室友好像出了问题——她的灵魂被掉包了！"',
  choices:[
    {label:'去法医学院，查高汝雪室友的事', tag:'', inf:'r10_shouji', next:'p10_shouji'}
  ]
},

p10_shouji:{
  ch:'第三百四十三至三百七十章', title:'手机鬼',
  act:s=>{ if(!s.employees.includes('许音·红衣')) s.employees.push('许音·红衣'); if(!s.clues.includes('手机鬼')) s.clues.push('手机鬼'); if(!s.clues.includes('流泪的雕像')) s.clues.push('流泪的雕像'); },
  text:'高汝雪的室友马颖、刘娴娴为解心结，三次夜探法医学院老教学楼地下室，找"眼睛流血的石膏雕像"。第六夜回来时，队伍里多了第三个人。\n\n"往后看。"陈歌的回复是唯一正常的——其他人收到的短信都来自一个"鬼"。\n\n黑色手机震动，陈歌循着线索进入法医学院老教学楼。复读机自动启动，磁带转动，<b>许音</b>苏醒。\n\n"高汝雪"的电话一直在响，陈歌揭穿：从早上六点起，就是鬼在冒充她打电话，一步步引他过来。\n\n许音撕碎了三只小鬼——他的外衣大片染红，只有心脏处仍是空白："缺少一颗心。"\n\n地下二层，福尔马林的脚印。陈歌赶往栖霞湖小区救下高汝雪——一个骨瘦如柴的小孩趴在她头顶，蒙蔽她的感知，那是<b>手机鬼</b>的实体。\n\n黑色手机发布隐藏试炼任务"消失的妻子"。与此同时，第三病栋试炼任务完成度突破百分之九十，获得隐藏道具——<span class="gift">第三病栋的病例单</span>（十个病人的鬼魂）。',
  choices:[
    {label:'深夜追踪——韩宝儿现身', tag:'', inf:'r10_hanbao', next:'p10_hanbao'}
  ]
},

p10_hanbao:{
  ch:'第三百七十一至三百七十二章', title:'韩宝儿',
  act:s=>{ if(!s.items.includes('第三病栋的病例单')) s.items.push('第三病栋的病例单'); if(!s.clues.includes('韩宝儿·挖眼案')) s.clues.push('韩宝儿·挖眼案'); s.grievance+=12; },
  text:'栖霞湖小区二十三层，健身教练裘猛的家。陈歌识破"家暴现场"是伪造的——裘猛想替女友顶罪。\n\n卧室里走出的女人，美得病态："如开在墓地上的玫瑰。"\n\n她是<b>韩宝儿</b>，第三病栋六号病房的患者，患有身体畸形恐惧症。五起挖眼凶杀案的真凶——九江连发五起挖眼案，案发点连成圆圈，圆心正对陈歌的新世纪乐园。\n\n"我不想杀你们，你们非要找死。"韩宝儿操控血丝召唤小鬼。\n\n陈歌召出许音与漫画册三鬼，闫大年发动能力，把手机鬼拖进漫画册！\n\n灭尽小鬼，韩宝儿浑身婴儿手印，昏死过去。裘猛双臂被锤断。\n\n警察赶到，颜队归还碎颅锤。陈歌盯着韩宝儿："五起挖眼案是仪式——五个罪人之眼，嵌进那扇血门上的恶鬼图案。他们真正的目的……是门。"',
  choices:[
    {label:'回鬼屋——血门上的恶鬼图案活了过来', tag:'', next:'p10_diaoxiang'}
  ]
},

p10_diaoxiang:{
  ch:'第三百七十三至三百八十七章', title:'流泪的雕像',
  act:s=>{ if(!s.clues.includes('消失的妻子')) s.clues.push('消失的妻子'); if(!s.items.includes('沾血长钉')) s.items.push('沾血长钉'); if(!s.clues.includes('笔仙遗书')) s.clues.push('笔仙遗书'); },
  text:'深夜，陈歌在血门前发现被划破的布偶——罗董女儿的守护灵。门后嵌着的十眼恶鬼图案活了过来，血丝染红九只眼，第十只被戳瞎染不红。\n\n笔仙留下一封遗书：<span class="clue">"凶手背着一具尸体，他称呼那具尸体为妻子！帮我照顾好王欣，为我报仇！"</span>\n\n"来者是十号。"陈歌收起笔仙遗书，血门上多了一只戳瞎的眼睛——十眼恶鬼成为护门门神。\n\n另一边，刘娴娴与马颖深夜进入废弃教学楼地下室，找到那座"流泪的雕像"。马颖问"姐姐是否已遇害"，雕像流出血泪，仓库开始异变——桌椅自移、电脑浮出人脸、光头肿胀的男人追赶。\n\n陈歌手持碎颅锤现身救下两人，逼问雕像："怪物来自地下尸库。尸库里有比它更恐怖的存在——有人暗中帮助它。"\n\n"怪谈协会会长是谁？"陈歌抡锤："是颜队吗？"雕像灵消散——指向怪谈协会。\n\n刘娴娴认出陈歌："陈老板？"她约陈歌去见心上人——法医学院的辅导员刘哲，一个坚信七年前车祸亡妻仍活着的人。',
  choices:[
    {label:'追踪刘哲——他每周三进入地下尸库', tag:'', next:'p10_xiaoxiao'}
  ]
},

p10_xiaoxiao:{
  ch:'第三百九十至三百九十一章', title:'安魂',
  act:s=>{ if(!s.talents.includes('安魂')) s.talents.push('安魂'); if(!s.clues.includes('高医生的过去')) s.clues.push('高医生的过去'); },
  text:'平安公寓灭门案的老人病危，陈歌抱着小小赶到医院。老人遗嘱分四份遗产，陈歌拒收。\n\n高医生在病房里，自述亡妻车祸离世后他曾想一了百了。陈歌注意到：高医生见过碎颅医生面具、熟悉法医学院、手指修长——他符合怪谈协会十号的所有特征。\n\n小小的好感度升至"相依为命"，解锁稀有特殊能力<span class="gift">安魂</span>——安抚厉鬼，洗涤灵魂。\n\n调查刘哲：他是刘娴娴的心上人，也是高医生的小舅子。他与罐中人头对话、编造亡妻故事、每周三进入地下尸库、浑身福尔马林味。\n\n"红色通道内不能出声。"刘娴娴最后补充道。\n\n张力——海明公寓的保安，妹妹张诗涵因马颖姐姐失踪案被造谣排挤。他答应做陈歌的线人，拍下地下尸库的建筑图："尸库扩建时，工人掉进停尸池被人抓住……尸体数量会变化，池底布满血管，泥土发红含丝线。"',
  choices:[
    {label:'接受噩梦任务——白龙洞隧道', tag:'', inf:'r10_guier', next:'p10_guier'}
  ]
},

p10_guier:{
  ch:'第三百九十四至四百章', title:'鬼耳',
  act:s=>{ if(!s.talents.includes('鬼耳')) s.talents.push('鬼耳'); if(!s.clues.includes('白龙洞隧道')) s.clues.push('白龙洞隧道'); s.grievance+=8; },
  text:'黑色手机刷新出血红色的噩梦难度日常任务：\n\n<span class="clue">"它们说，隧道尽头埋着另一个你。凌晨两点四十四分，进入一条长度至少在四十四米以上的隧道，走出四十四步，喊四十四声自己的名字。不能携带任何鬼怪和道具。"</span>\n\n唯一符合条件的，是东郊的白龙洞隧道。凌晨两点四十四分，陈歌独自走进隧道。\n\n头顶蜘蛛状的阴影爬过，身后响起脚步声，一个红衣女人迎面而来——她的头颅凹陷变形，也开始喊陈歌的名字。\n\n第四十二步，手机熄灭。第四十四步，灵魂下坠——黑暗中出现一个男孩被大人掐住脖颈的画面：<b>"找到了！"</b>\n\n那是很多年前的陈歌。\n\n血色身影（张雅）驱散黑暗，白猫咬醒他。任务完成，获得天赋技能<span class="gift">鬼耳</span>——可以听见另一个世界的声音。\n\n陈歌回头救那个红衣女人，她却说："我已经不需要谁来救我了。"她退回隧道深处。\n\n隧道口的地面上，被刻下一行血字：<b>"他是……我的！"</b>——张雅在吃醋。',
  choices:[
    {label:'哄好张雅，回鬼屋——手机鬼归顺', tag:'', inf:'r10_shouji', next:'p10_tongtong'}
  ]
},

p10_tongtong:{
  ch:'第四百零三至四百零五章', title:'童童入册',
  act:s=>{ if(!s.employees.includes('手机鬼·童童')) s.employees.push('手机鬼·童童'); if(!s.clues.includes('童童')) s.clues.push('童童'); s.grievance+=6; },
  text:'闫大年等说服手机鬼加入恐怖屋，但它有一个请求。\n\n手机鬼是挂着一部老式手机的干瘦小孩——手机里有99个未接来电，备注都是"老妈"。\n\n东郊荔湾镇普明公寓楼顶的水缸里，陈歌找到了它的干尸。手机号七年，每个月都有人充话费。\n\n童童花店——手机鬼的母亲守候了七年。\n\n"报警吧，不要让她再等了。"手机鬼发出这条信息，与母亲隔街相望，大哭。\n\n陈歌报警，人贩子被揪出。手机鬼（童童）正式入册——它的能力：干扰游客拍照，防止鬼屋被偷拍。\n\n罗董事送来定制的游客小程序和测量手环（编号000，心率/定位）。刘哲投案自首，但状态异常，似被催眠。',
  choices:[
    {label:'夜访第三病栋，请门楠出山', tag:'', inf:'r10_mennei', next:'p10_menan'}
  ]
},

p10_menan:{
  ch:'第四百零九至四百一十二章', title:'门楠论红衣',
  act:s=>{ if(!s.scenes.includes('妻子的房间')) s.scenes.push('妻子的房间'); if(!s.employees.includes('雕塑鬼·马颖姐姐')) s.employees.push('雕塑鬼·马颖姐姐'); if(!s.clues.includes('门楠论红衣')) s.clues.push('门楠论红衣'); },
  text:'血门之后，门楠主人格为陈歌解惑：\n\n"推门人死后，直接成为红衣。厉鬼要晋升红衣，必须成为门的主人，或者吞食完整的红衣。"\n\n"许音的心口缺一块——厉鬼的心由极致情绪构成，他的情绪太混杂：绝望、痛苦、不甘，还藏着一丝渴望。只有纯粹的执念才能撑起红衣的心。"\n\n门楠凝视陈歌的影子："张雅……她要么是推门人，要么吞食过推门人。"\n\n陈歌把一星场景<b>妻子的房间</b>建成——还原马颖姐姐的死亡现场。雕塑鬼（马颖姐姐的灵魂）入伙，流着血泪与马颖相认。\n\n暮阳中学的账本上，第一捐赠人是"高医生"。合影里，高医生、陈医生与一个模糊的女人站在一起——那女人的体型，像高医生亡妻，也像十号背上的灰白女人。',
  choices:[
    {label:'第八条支线触发——永生，出发！', tag:'', inf:'r10_shiku', next:'p10_chufa'}
  ]
},

p10_chufa:{
  ch:'第四百一十九至四百二十章', title:'出发·永生',
  act:s=>{ if(!s.clues.includes('永生支线')) s.clues.push('永生支线'); },
  text:'张力发来地下尸库的建筑图。江铃交出蜘蛛瓶。陈歌从范郁处借来血红玉镯，带上全部员工：许音、闫大年、笔仙、无头女鬼、小小、张忆……\n\n黑色手机显示：\n\n<span class="clue">"支线任务八：永生（在地下尸库的未开放区域，住着一群永生的人）。提示：生命的意义不在于是否会呼吸，而在于其他东西。要求：午夜凌晨之前进入九江法医学院地下尸库核心区域！存活至天亮！"</span>\n\n"这是通灵鬼校的最后一条支线。"陈歌把碎颅锤别在腰间："完成它，四星试炼的最终任务就会解锁。"\n\n深夜，九江法医学院西校区，五条通道。陈歌带着马威（火化工）潜入地下尸库。',
  choices:[
    {label:'进入地下尸库', tag:'⚠ 三星试炼', inf:'r10_shiku', next:'p10_shiku'}
  ]
},

p10_shiku:{
  ch:'第四百二十一至四百三十一章', title:'地下尸库',
  act:s=>{ if(!s.clues.includes('地下尸库')) s.clues.push('地下尸库'); if(!s.clues.includes('卫九卿')) s.clues.push('卫九卿'); s.grievance+=15; },
  text:'运尸通道的墙壁上写满血字警告。中型尸库的人体模型盯着苹果。火化工马威、李旭偷倒解剖残渣——停尸池的地洞里，藏着巨力怪物。\n\n"八号库房"——现实档案里没有记录的房间，泡着福尔马林、睁着眼睛的大体老师刘正义。\n\n陈歌破开血色密道，发现"血苔藓"下全是尸体垒成的墙——<b>尸行道</b>。白猫引路，穿过层层尸墙进入核心区域。\n\n在核心区，他救出被囚禁的九江儿童福利院陈医生——自称"不姓陈"，受一个"也姓陈的人"之托来西郊办事。\n\n走廊尽头，一间手术室里，两个"碎颅医生"正在解剖活人——隗医生走私器官，王医生剥皮。陈歌清剿试验室，走到手术台前。\n\n一个穿着白大褂的男人转过身："你来了。"\n\n<b>高医生</b>。',
  choices:[
    {label:'与高医生对峙——他放出了红衣熊青', tag:'', inf:'r10_gao', next:'p10_huizhang'}
  ]
},

p10_huizhang:{
  ch:'第四百三十二至四百四十三章', title:'会长·高医生',
  act:s=>{ if(!s.clues.includes('怪谈协会会长=高医生')) s.clues.push('怪谈协会会长=高医生'); if(!s.employees.includes('卫九卿·急救小组')) s.employees.push('卫九卿·急救小组'); s.grievance+=18; },
  text:'核心区的照片墙揭示了真相：所谓"受害者"，全是怪谈协会的"治疗方案"——41号患者、荔枝案……\n\n<b>怪谈协会会长=地下尸库主人=高医生。</b>\n\n他为复活亡妻推开血门，以尸垒库，创立了"精神病人互助会"。那三张照片——三个孩童、婚纱照、遗照——指向他车祸离世的妻子。\n\n零点，血丝涌出，尸体苏醒。血门开启，陈歌与火化工被卷入<b>门后世界</b>——由血肉脏器构成的高医生内心。\n\n在这里，陈歌装成学生，跟着解剖教师刘正义学解剖（天赋殓容）。七号库房的"后勤人员"是被害者残念的拼合。\n\n一个穿着白大褂的男人站在走廊尽头，问："我到底死了没有？"——<b>卫九卿</b>，九江法医学院教授，肺癌患者，死后捐献遗体。他记得一切。\n\n"你是唯一一个……进入这里还能保持自我的人。"卫九卿低声道："高医生，就在最深处等你。"',
  choices:[

p10_mennei:{
  ch:'第四百四十四至四百四十八章', title:'门内世界',
  act:s=>{ if(!s.employees.includes('陈医生·福利院')) s.employees.push('陈医生·福利院'); if(!s.clues.includes('高医生现身')) s.clues.push('高医生现身'); s.grievance+=12; },
  text:'八号库房的铁门被碎颅锤砸开，被囚禁的九江儿童福利院陈医生获救——他受"那个男人"（与陈歌父亲相似）之托来西郊办事，学会了关门的方法，被高医生囚禁。\n\n门内世界的深处，高医生坐在手术台边，像老朋友一样开口：\n\n"陈歌，我一直在等你。"\n\n"你拥有一扇门——你鬼屋卫生间里就有一扇。你是推门人，你知道吗？"\n\n哲学辩论中，高医生放出了红衣<b>熊青</b>（第三病栋八号病人，被怪谈协会用木盒黑血造出的红衣）。\n\n手术室血池中，一个穿红衣的女人缓缓睁开眼——<b>高医生的妻子</b>，灰白皮肤的"尸体"，她苏醒后血丝铺满整个门内世界。\n\n"松手。"陈歌身后，布偶裂开，张雅借人偶苏醒，黑发如汪洋倾泻，吞没门内世界。',

p10_zhanya:{
  ch:'第四百四十九至四百五十三章', title:'张雅苏醒',
  act:s=>{ if(!s.employees.includes('张雅·苏醒')) s.employees.push('张雅·苏醒'); if(!s.clues.includes('高医生成红衣')) s.clues.push('高医生成红衣'); s.grievance+=20; },
  text:'黑发遮天蔽日。张雅与高医生的妻子（血鸟）厮杀，与残尸怪物缠斗——她击退二者，手臂却渗出血来。\n\n许音、门楠、白秋林围杀红衣熊青。\n\n"爸！"高汝雪的声音从门外传来，高医生的妻子握住了高汝雪的刀，动作停住。\n\n高医生看着这一切，突然笑了："陈歌，我想和你做一个交易。"\n\n"照顾我的女儿高汝雪。还有——关掉荔湾镇那扇失控的门。"\n\n"作为回报，我给你怪谈协会的底蕴，还有关门的方法：找到推门人，让他承受绝望，然后将他囚禁在门外。"\n\n他递来一张照片——<span class="clue">陈歌的父母，失踪前一周，在荔湾镇与一个红衣小女孩对话。</span>\n\n"你的父母不是失踪，他们……是自己走进门的。"\n\n高医生说完，将手术刀刺入自己的心口。他要成为门后世界的神——红衣之上。',
  choices:[
    {label:'高医生自杀成红衣之上——接手他的遗产', tag:'', inf:'r10_jiaoyi', next:'p10_jiaoyi'}
  ]
},

p10_jiaoyi:{
  ch:'第四百五十四至四百五十八章', title:'高医生的交易',
  act:s=>{ if(!s.items.includes('会长的委任书')) s.items.push('会长的委任书'); if(!s.items.includes('关门的方法')) s.items.push('关门的方法'); if(!s.clues.includes('父母在荔湾镇')) s.clues.push('父母在荔湾镇'); if(!s.employees.includes('白秋林·准红衣')) s.employees.push('白秋林·准红衣'); },
  text:'高医生的血衣飘落，他的灵魂在血门后成神——红衣之上。\n\n白秋林吞下红衣熊青，蜕变为准红衣。许音拒绝吞食——"我要找到自己的心。"\n\n黑色手机疯狂震动，任务结算：\n\n<span class="clue">"恭喜你完成三星试炼任务——地下尸库！任务完成度：百分之六十。"</span>\n\n"第三病栋隐藏任务——怪谈协会已完成！获得——会长的委任书（高医生亲笔字迹）。"\n\n"恐怖屋满足第三次扩建条件！正式升级为——<b>颤栗迷宫</b>！"\n\n"三星恐怖场景地下尸库已解锁！获得特殊建筑——<b>尖嚎之门</b>！"\n\n陈歌捏着那张照片，久久不语。父母失踪前在荔湾镇与红衣小女孩对话……\n\n"我的父母，是自己走进那扇门的。"他低声说："我会找到那扇门，把他们都带回来。"',
  choices:[
    {label:'颤栗迷宫开张——迎战第一批游客', tag:'', inf:'r10_chansu', next:'p10_chansu'}

p10_chansu:{
  ch:'第四百五十九至四百八十三章', title:'颤栗迷宫',
  act:s=>{ if(!s.scenes.includes('颤栗迷宫')) s.scenes.push('颤栗迷宫'); if(!s.scenes.includes('地下尸库')) s.scenes.push('地下尸库'); if(!s.scenes.includes('尖嚎之门')) s.scenes.push('尖嚎之门'); s.tourists+=600; s.reputation=Math.min(100,s.reputation+20); },
  text:'恐怖屋升级为颤栗迷宫。地下尸库开放营业——通关条件：找到五张受害者的照片。\n\n十二名游客报名挑战：法医学院三学生（杨辰、王琰、李雪）、惊悚杂志编辑阿楠/虎牙/尾巴、厨师范大德/范聪、机修小李……还有两位"老熟人"：老周和段月（陈歌的员工）。\n\n熄灯的无脸怪、停尸柜里的轮回噩梦——游客们一个接一个被吓晕。\n\n杨辰在晕倒前推理出真相："五张照片=五个鬼。"\n\n陈歌推着两车晕倒的游客出场："全被吓晕了？我一个拖不动，麻烦叫几副担架。"\n\n陈医生讲述"那个男人"的故事：他貌似陈歌的父亲，救过陈医生，教他关门，临走前嘱托："千万不要去找他们。"\n\n东郊的怪谈在发酵：鬼火焚楼、吃人公路、隧道灵车、水鬼、冥胎……小顾深夜下班，上了一辆不该出现的公交车。',
  choices:[
    {label:'范聪的游戏——午夜灵车', tag:'', inf:'r10_lingche', next:'p10_lingche'}
  ]
},

p10_lingche:{
  ch:'第四百八十四至四百九十三章', title:'午夜灵车',
  act:s=>{ if(!s.clues.includes('午夜灵车')) s.clues.push('午夜灵车'); if(!s.employees.includes('红雨衣女人')) s.employees.push('红雨衣女人'); s.grievance+=10; },
  text:'范聪讲起一个换装游戏"小布"——妈妈睡衣里藏着地牢钥匙，对应一桩真实凶杀案。\n\n深夜，小顾拦下一辆104路末班车——这条线路早已停运。\n\n车上全是"乘客"：医生（窃尸案的爬行影）、情侣（荔湾商城的冤魂）、三个男人（东郊水库的溺亡者）。\n\n陈歌在电话里指挥小顾逃命。车停，一个穿红雨衣的女人拦在路中间，声音沙哑：\n\n"你见过我的孩子吗？"\n\n陈歌赶到，与红雨衣女人对视。她的孩子，消失在104路灵车上。\n\n"一周之内，我会帮你找到他。"陈歌说。\n\n红雨衣女人凝视他良久，消失在夜色中——她曾是红衣，死于荔湾镇。',
  choices:[
    {label:'东郊自来水厂——影子怪', tag:'', inf:'r10_yingzi', next:'p10_hongyuyi'}
  ]
},

p10_hongyuyi:{
  ch:'第四百九十四至五百零四章', title:'红雨衣与影子怪',
  act:s=>{ if(!s.clues.includes('影子怪')) s.clues.push('影子怪'); if(!s.clues.includes('东郊十大怪谈')) s.clues.push('东郊十大怪谈'); s.grievance+=12; },
  text:'东郊自来水厂，陈歌遇上一个怪物——<b>影子怪</b>，它自称"被你杀死的孩子"。\n\n门楠、许音、张雅都对它十分忌惮。它是东郊十大怪谈之首，张雅曾与它交手，手臂上留下裂痕。\n\n"你杀了我一次，还想杀我第二次吗？"影子怪的声音忽远忽近。\n\n手机鬼（童童）在陈歌口袋里震动，提示三个字："她死在荔湾镇。"\n\n贾明的丈夫被鬼附身——真正的贾明灵魂被困在末班车上。陈歌推断：午夜灵车是二星场景。\n\n范聪的游戏里有四条坏结局，对应现实中的凶杀案：黑袋藏尸、104路泥塑、水缸藏童（手机鬼案）。\n\n"他们为什么需要那么多小孩？"陈歌皱眉。\n\n人贩子马福交代：买家指定东郊明阳小区三单元104号。而明阳小区的三个投资商，全部离奇死亡。',
  choices:[
    {label:'明阳小区104号——壁画与藏尸', tag:'', inf:'r10_xiao', next:'p10_mingyang'}
  ]
},

p10_mingyang:{
  ch:'第五百零五至五百三十章', title:'明阳小区·小布',
  act:s=>{ if(!s.clues.includes('小布·布忆')) s.clues.push('小布·布忆'); if(!s.clues.includes('明阳小区104号')) s.clues.push('明阳小区104号'); if(!s.clues.includes('姜龙一家')) s.clues.push('姜龙一家'); s.grievance+=15; },
  text:'明阳小区三单元104号房的天花板上，画着一幅壁画：姜龙、张初语、姜白、姜小虎一家四口，咬着女孩的四肢。\n\n陈歌一锤砸出墙壁里的女尸左臂——四栋楼对应壁画上的四张脸，藏着四具尸。\n\n凶手骑电动车取走双腿——那是被鬼附身的贾明（姜龙）。\n\n范聪家，陈歌一命通关小布的游戏：引双杀人狂互杀、放提头女鬼清旅馆、冰箱女鬼灭提头女鬼，最后得到一把菜刀。\n\n"小布是推门人。"陈歌盯着屏幕："布忆——三年前东郊失踪的女孩，分尸案的受害者。她母亲是姜龙的情人。"\n\n李政通报：分尸案女尸确认是布忆。\n\n陈歌去精神病院见姜小虎——那个咬住壁画中女孩四肢的男孩，疯了，刺伤了心理医生。三年前的诊断反反复复。\n\n"布忆就是小布。"陈歌看向东郊："她推开的门……就在东郊。"',
  choices:[
    {label:'阶段十 · 完。东郊的阴影越来越近', tag:'', next:'p10_end'}
  ]
},

p10_end:{
  ch:'第五百三十一章 · 东郊的阴影', title:'阶段十 · 完',
  act:s=>{ if(!s.scenes.includes('午夜灵车')) s.scenes.push('午夜灵车'); if(!s.employees.includes('许音·红衣')) s.employees.push('许音·红衣'); if(!s.talents.includes('鬼耳')) s.talents.push('鬼耳'); s.grievance+=20; s.tourists+=600; s.reputation=Math.min(100,s.reputation+20); },
  text:'从活棺村到地下尸库，从手机鬼到红雨衣女人——陈歌的恐怖屋，已经成了真正的颤栗迷宫。\n\n阶段十落幕：\n· 恐怖屋升级<b>颤栗迷宫</b>；三星场景<b>地下尸库</b>、特殊建筑<b>尖嚎之门</b>解锁；一星场景<b>妻子的房间</b>建成。\n· 员工：<b>绣娘的残念</b>、<b>手机鬼·童童</b>、<b>雕塑鬼</b>入册；<b>许音</b>苏醒成红衣；<b>白秋林</b>吞熊青成准红衣；<b>卫九卿</b>等医生组成急救医疗小组；<b>陈医生</b>获救。\n· 天赋：<b>鬼耳</b>（听见另一个世界）、<b>安魂</b>（安抚厉鬼）。\n· 真相：<b>怪谈协会会长=高医生</b>，为复活亡妻推门，死后成红衣之上；<b>韩宝儿</b>（六号病人）是挖眼案真凶；挖眼案是仪式，目标=鬼屋的血门。\n· 交易：高医生赠<b>关门的方法</b>与<b>会长的委任书</b>，托付高汝雪与荔湾镇失控的门；照片揭示——<b>陈歌父母失踪前在荔湾镇与红衣小女孩对话</b>。\n· 新线：午夜灵车（104路末班车）、<b>红雨衣女人</b>（孩子失踪）、<b>影子怪</b>（东郊十大怪谈之首）、<b>明阳小区/小布（布忆）</b>——东郊的阴影，正在逼近。\n\n接下来：把所有红衣都叫上——荔湾镇的血雾，已经漫过来了。',
  choices:[
    {label:'进入阶段六 · 荔湾镇与影子（Ch531 把所有红衣都叫上）', tag:'三星半', next:'p6_start'},
    {label:'回到阶段五尾声', next:'p5_end'},
    {label:'打开黑色手机，查看推理树与新场景', tag:'', next:'__phone__'},
    {label:'回到开篇', next:'start'}
  ]
},

p6_start:{
  ch:'第五百三十一章 · 把所有红衣都叫上', title:'东郊的阴影',
  act:s=>{ if(!s.clues.includes('明阳小区为鬼修建')) s.clues.push('明阳小区为鬼修建'); if(!s.clues.includes('红雨衣的约定')) s.clues.push('红雨衣的约定'); },
  text:'精神病院里，陈歌单独审问姜小虎。这孩子早熟得可怕："姜龙说过，明阳小区开发项目是骗局，是有人逼他做的，那四座楼不是给人住的，是专门为鬼修的。"他怀疑父亲的身体里住进了另外一个人——被自己的影子取代了。\n\n裴医生讲了东郊病人的遭遇：凌晨开车回家，两侧建筑变得陌生，路灯变暗，后视镜里一辆公交车缓缓驶来，车上乘客全在冲他招手喊他的名字——直到他病逝奶奶的电话将他唤回现实。\n\n陈歌心中已有计划：荔湾镇的门失控了，他要联合所有红衣平推东郊。红雨衣还在等他，一星期之约已过三天。',
  choices:[
    {label:'雨夜骑电瓶车，沿104路公交线蹲守灵车', inf:'r_yuanyu', next:'p6_bus'}
  ]
},

p6_bus:{
  ch:'第五百三十五章 · 绝命灵车', title:'104路末班车',
  act:s=>{ if(!s.items.includes('104路末班车')) s.items.push('104路末班车'); if(!s.employees.includes('司机唐骏')) s.employees.push('司机唐骏'); if(!s.clues.includes('绝命灵车')) s.clues.push('绝命灵车'); },
  text:'凌晨暴雨，陈歌骑着范聪的电瓶车在104路沿线蹲守。那辆如移动棺椁般的公交车出现，却过站不停——它不许活人上车。陈歌不要命地追了三站路，每一站都有人上车：裹成粽子的中年男、四肢不协调的哑巴、如胶似漆的情侣。\n\n陈歌终于追上，抡起碎颅锤砸向车门："你自己开门，还是我帮你开？"司机唐骏怂了。上车后陈歌发现：司机是溺水而死的鬼，被一道影子胁迫"载够一千位乘客重获自由"；车上还有四个病号服女病人，和一个牵着昏迷男孩的中年女人。\n\n任务完成——<span class="gift">104路末班车</span>入手（保留车辆选项），司机<b>唐骏</b>入册。黑色手机同时解锁六个新任务：双生水鬼（二星）、鬼火焚楼（三星）、隧道深处（三星）、荔湾鬼镇（三星半）、冥胎（四星）、新海中心医院诅咒游戏（四星）。',
  choices:[
    {label:'收好灵车，回鬼屋抽奖——诅咒游戏邀请函', inf:'r_lingche', next:'p6_phone'}
  ]
},

p6_phone:{
  st:"daily",
  ch:'第五百五十三章 · 再抽最后一次！', title:'被死者亲吻的号码',
  act:s=>{ if(!s.items.includes('诅咒游戏邀请函')) s.items.push('诅咒游戏邀请函'); if(!s.items.includes('被死者亲吻的号码')) s.items.push('被死者亲吻的号码'); if(!s.clues.includes('厉鬼眷顾者·四次')) s.clues.push('厉鬼眷顾者·四次'); },
  text:'在灵车上抽奖，指针两次停下：<span class="gift">诅咒游戏邀请函</span>（概率百分之一，指向新海中心医院）——"诅咒和死亡在这座医院里轮回上演"；以及<span class="gift">被死者亲吻的电话号码</span>（概率千分之五，仅次于张雅）——"警察发现，每一位死者在生命的最后时刻都拨打了这个电话"。\n\n这是第四次抽中厉鬼，再抽一次，厉鬼眷顾者称号将升级。陈歌拨通号码：电话那头是燃烧的火焰声，一个男人缓缓讲述自己的一生——网文作者、屡遭退稿、手断七根手指也要写、卖老房发红包争榜、被污蔑是刷子……最后他说："这把火烧得好大啊。"电话断了。\n\n陈歌赶到废弃儿童乐园，捡到一件破旧的机器猫人偶服。',
  choices:[
    {label:'再拨那个号码，救一位卧轨的肺癌患者', inf:'r_haoma', next:'p6_zhang'}
  ]
},

p6_zhang:{
  ch:'第五百五十七章 · 野比大雄', title:'自杀干预接线员',
  act:s=>{ if(!s.clues.includes('自杀干预接线员')) s.clues.push('自杀干预接线员'); if(!s.employees.includes('张文宇(待遗愿)')) s.employees.push('张文宇(待遗愿)'); },
  text:'第二个电话：机器猫人偶装束者，大雄胖虎综合征，重度抑郁被网暴，父亲患白血病瞒着他——"我今年三十岁，不想那么累了，想好好睡一觉。"陈歌赶到，人已逝，只留下机器猫服口袋里一张父子的照片。\n\n第三个电话：肺癌晚期患者，瞒着家人出走，要去"高处"——陈歌从火车的鸣笛声和铁轨的枕木中识破真相，拼命赶到，在火车撞上之前，把那个坐在铁轨中央的黑影拉开。\n\n黑影站起，半边脸上是无数张人脸重叠的纹身——<span class="clue">红衣！自杀干预接线员<b>张文宇</b></span>。他承载着所有自杀者的执念："本来你会遇到七个求助者，你通过了考验。"他提出交换：陈歌帮他完成自杀者的遗愿（作家拍电影、人偶还水电费、癌病患者照顾家人），他帮陈歌做事。\n\n陈歌替他垫付了三百元水电费，收下约定。',
  choices:[
    {label:'回鬼屋，接待特殊游客——雯雯父女', inf:'r_wenzhang', next:'p6_wenwen'}
  ]
},

p6_wenwen:{
  st:"sub",
  ch:'第五百六十六章 · 水鬼', title:'雯雯与种种',
  act:s=>{ if(!s.clues.includes('种种')) s.clues.push('种种'); if(!s.clues.includes('雯雯的姐姐')) s.clues.push('雯雯的姐姐'); },
  text:'鬼屋来了一对特殊游客：智力缺陷的父亲带着女儿雯雯，从东郊东岗来。雯雯在笔仙宿舍的白纸上歪歪斜斜写下"姐姐"两个字——笔仙陈雅琳正飘在她背后给她编辫子，那两个字是她自己写的。\n\n父亲送她回家后，邻居老太太讲出真相：<span class="clue">种种</span>——把第一个孩子的命"种"进第二个孩子体内。雯雯的姐姐被父母带出家门，再也没有回来；雯雯出生后，头部有轻微畸形，遗传病缠身。\n\n老太太还透露：每到凌晨，楼道里会有水滴声和湿拖把拖地的声音，一个浑身湿透、缠着水草的女人停在雯雯家门外，嘴里念叨着雯雯的名字。陈歌脱口而出："姐姐？"',
  choices:[
    {label:'夜探东岗水库，撞见钓"鱼王"的怪人', inf:'r_zhongzhong', next:'p6_fish'}
  ]
},

p6_fish:{
  st:"sub",
  ch:'第五百七十一章 · 东岗水库', title:'钓鱼男',
  act:s=>{ if(!s.clues.includes('东岗水库的水鬼')) s.clues.push('东岗水库的水鬼'); },
  text:'东岗水库，一个钓鱼男扬言要钓"鱼王"——他钓了三次，每次鱼线都在关键时刻被咬断。陈歌发现他用的饵料有古怪：特制的夜光漂里，塞着一截断指。\n\n钓鱼男划船去捡鱼漂，水下浮起成片"水草"——那是无数具缠绕着黑发的尸体！他扔出饵料吸引它们，才捡回一条命。\n\n陈歌尾随他回家，发现他院子里埋着尸体——他曾杀害一个流浪汉，抛尸水库。陈歌将他制服报警。警察告诉他：西郊最近七起儿童失踪案，都发生在雨夜，唯一找到的孩子，就是他救下的那个昏迷男孩。',
  choices:[
    {label:'培养缸鬼，深夜潜入康复学校寻水鬼', inf:'r_shuigui', next:'p6_school'}
  ]
},

p6_school:{
  ch:'第五百七十八章 · 找到我了吗？', title:'康复学校',
  act:s=>{ if(!s.employees.includes('水鬼·赵双儿')) s.employees.push('水鬼·赵双儿'); if(!s.clues.includes('双生水鬼')) s.clues.push('双生水鬼'); },
  text:'雯雯被姑姑送进康复学校，午睡时老师倒掉她水杯里的水（里面有一根头发），雯雯崩溃大哭。夜里，洗漱间的镜子里浮现一个泡得发白的女孩，对老师伸出手：<span class="clue">"找到我了吗？"</span>——那是雯雯的姐姐。\n\n女鬼从水管道钻出，追着老师和雯雯。陈歌破窗而入，抡碎颅锤砸裂水管："到手的水鬼，我还能让你跑了？"水鬼钻进管道逃窜，陈歌一路追进隔壁小区，在十三楼一户人家堵住她——许音和白秋林夹击，将她塞进一瓶洗发水里。\n\n雯雯摸着洗发水瓶安静下来。黑色手机震动：<span class="clue">双生水鬼任务触发！今夜凌晨之前抵达东岗水库，独自打捞出"姐姐"的尸体。</span>',
  choices:[
    {label:'深夜独驾小船，下水库捞尸', inf:'r_shuangsheng', next:'p6_reservoir'}
  ]
},

p6_reservoir:{
  ch:'第五百八十七章 · 家', title:'水库深处的棺材',
  act:s=>{ if(!s.items.includes('溺水者的外衣')) s.items.push('溺水者的外衣'); if(!s.scenes.includes('双生水鬼')) s.scenes.push('双生水鬼'); if(!s.clues.includes('以城市为母体')) s.clues.push('以城市为母体'); },
  text:'雯雯的姑姑在桥边说出了那个秘密：<span class="clue">"种种需要三种东西——种子、胎儿、母体。将一个孩子的命种进另一个孩子的身体，这是种种；如果将很多人的命同时种进一个人的身体，以整个城市做母体，那会长出一个什么样的怪物？"</span>她曾偷偷跟父母去过荔湾镇。\n\n深夜，陈歌独驾小船至水库中心。浓雾升起，一个熟悉的声音在呼唤他的名字——雾里出现一个孩子，那是幼年的他，脖颈被折断，五官变形，被一个大人高高举起扔进水库："这次肯定死透了，应该不会再回来了。"\n\n张雅出手惊退幻影。陈歌潜入水底，穿过缠绕的黑发与尸体，打开一口封棺——棺内是无数写着名字的人偶娃娃，那才是"尸体"。他带着棺盖和人偶浮出水面。任务完成，<span class="gift">溺水者的外衣</span>入手，水下恐怖场景解锁。棺盖上刻着与怪谈协会鬼屋门上一样的恶鬼图案。',

},

p6_jiaming:{

  act:s=>{ if(!s.clues.includes('没有影子的人')) s.clues.push('没有影子的人'); },
  text:'黄玲的老公贾明昏迷在白龙洞隧道入口，被警方带走。陈歌到医院看他，贾明却指着他尖叫："鬼！他是鬼！我亲眼看见他被人杀死了！"\n\n贾明讲了他的故事：几年前他亲眼看见姜龙跪地满身鲜血，旁边一个和陈歌一模一样的男人拿着刀；从那天起，有个东西一直跟着他——楼道里老太太说"你们走路轻点"（他身后还有人）；三楼拐角有小孩的脚；镜子里的人不回头；电视里浮现女人的脸。\n\n陈歌找到贾明当年的房东老太太，她说：那晚站在贾明门口的人，和陈歌长得一样，灯光照到他身上——<span class="clue">"那个人好像没有影子。"</span>老宅里的女鬼用笔写下：影子吃掉了我丈夫，它说要回西郊亲手推开那扇门。陈歌心一沉——那扇门，是他的恐怖屋卫生间里的门。',
  choices:[
    {label:'接受三星试炼——隧道深处，蒙眼入洞', inf:'r_meiyouyingzi', next:'p6_tunnel'}
  ]
},

  text:'三星试炼"隧道深处"：午夜之前进入白龙洞隧道，提示<span class="clue">"蒙上双眼，或许你才能看到真正的世界"</span>。出租车载着一个无脚的女人和提着黑袋的小孩一路向北——小孩说："快找齐了，就差一只手了。"\n\n陈歌蒙上眼，跟随脚步声和孩子的呼救声，救出一个卡在车窗里的男孩——睁眼才发现，那是隧道女鬼的孩子：上半身是人，下半身是巨大的蜘蛛，由无数执念与厉鬼组成，它是推门人，门就卡在它的身体里。它在当年隧道大火中被卡在车窗里活活烧死，母亲回来陪它一起死。\n\n男孩讲了影子的秘密：影子每年都来一次，想抓它去荔湾镇帮助"冥胎"；影子的身体里包藏着一个小孩的影子。隧道女鬼选择跟陈歌离开。任务完成度20%，隧道场景解锁。',

p6_night:{

  choices:[

  text:'血雾中每栋建筑都是一个怪谈：医院里有玩捉迷藏的孩子（刘飞明日记记录了他被逼疯的全过程）；二层小楼里是披着人皮的狗——黑狗的灵魂和主人的身体互换。陈歌一锤一锤地清场，把拖把鬼、捉迷藏的病鬼、人面狗全部收入漫画册。\n\n饭店里，胖老板用沾血的指甲扎晕了三个乘客，被陈歌锤断四肢。真正的解药是活的血丝——剪刀第一个喝下。纹身男供出情报：<span class="clue">冥楼在明阳小区，影子是"一个活人的影子，被那个活人抛弃了"；它把大部分身体种在一个未出生的孩子身上，那就是冥胎。</span>\n\n黑色手机收编了黑犬（狂犬能力：七天一次进入活人身体）。陈歌直觉：那影子，和他有关。',

p6_hotel:{

  text:'无头女鬼追着陈歌闯进饭店，惊醒了厨房里沉睡的<b>暴食女鬼</b>——一个能单独撑起三星场景的顶级红衣，无数张嘴长在巨大的身体上，被铁链囚禁在饭店地窖。红色高跟鞋的绷带女人也出现了，一滴血一个诅咒，灼烧着暴食女鬼。\n\n两虎相争，陈歌坐收渔利：许音刺穿暴食女鬼的脖颈，取出那颗血红色心脏——<span class="gift">暴食之心</span>。他将心放在自己的影子上，张雅将心吞入。暴食女鬼的丈夫（老人）招供：妻子是影子养的，影子定期来投喂。\n\n陈歌收起重伤的无头女鬼和病号服男孩，接管饭店。他回头看向自己的影子——那影子，正在变成一个女人的形状。',

p6_ming:{
  ch:'第六百六十二章 · 关不上的门', title:'冥楼',
  act:s=>{ if(!s.clues.includes('失控的门')) s.clues.push('失控的门'); },
  text:'李政押着贾明出现在饭店——陈歌一眼识破其中有诈，但没声张。他带着所有乘客赶到范聪的小区，那扇失控的门就在姜龙家的密室里：门板缺了四肢和头颅的位置，无数黑红色的手指从门板下方伸出，抓住门板不让它闭合。\n\n纹身男说：门缺损的部分，对应着被分藏在明阳小区的小布残肢——明阳小区就是冥楼。陈歌带队闯入冥楼：每层楼都是被抽离记忆、只会麻木画画的孩子。剪刀、李政、贾明、醉汉、医生陆续被拖走。手机鬼童童被孩子们撕扯，发来求救短信："好多孩子！速来！"\n\n陈歌提着碎颅锤一层层杀上楼顶，唤醒从白龙洞带出的隧道女鬼开路。通往天台的画上，一遍遍画着一个孩子以各种死法死去，那些黑色图案最终组成一个人形轮廓——和陈歌一模一样。',

p6_gao:{
  ch:'第六百七十章 · 你，到底是谁！', title:'影子',
  act:s=>{ if(!s.clues.includes('影子的真身')) s.clues.push('影子的真身'); if(!s.talents.includes('许音·红衣')) s.talents.push('许音·红衣'); },
  text:'陈歌放出了狗舍里那只黑狗——它看到"李政"后愣住了。李政瘫倒，他的影子却站了起来，身体一点点拔高，变成和陈歌一模一样："可笑，我这辈子就做了这么一件好事，竟然成了你破局的关键。应该杀了它的。"\n\n影子开口，声音也逐渐与陈歌重合："你生活在阳光下，被温暖包裹，享受着所有美好——但你遭受的那些诅咒、谩骂、深深的恶意，却全部转移到了我的身上！我是你被抛弃的影子！绝望的我，在你家的门后听到了呼唤你名字的声音，我替你做出了回应！"\n\n影子要同化陈歌，掐住他的脖子。许音扑上来，无数诅咒涌入他的身体，崩裂的血肉中，那颗空白的心终于被染红——<span class="clue">许音，成为红衣！</span>高医生的锁链也从窗外袭来，影子被迫松手。',

  text:'陈歌从背包夹层取出那封珍藏的情书，点燃："我不需要再用这些东西来搪塞了。张雅，和我永远在一起吧——我不信这个世界上，还有比一生一世形影不离更浪漫的事！"\n\n情书化为灰烬，张雅的寄托从纸变成了陈歌本身。黑发如汪洋倾泻，苍白的手刺穿影子——她正式成为陈歌的影子，再无分别。门楠、老周夺回小布的四肢与头颅；笑脸男与红雨衣护住残肢。影子在张雅与高医生的夹击下彻底崩碎，胸口的婴儿——<span class="clue">冥胎</span>——破体而出，却也被两位顶级红衣撕裂，心脏一分为二，落入张雅与高医生手中。\n\n高医生带着半颗心遁入血雾，张雅在陈歌影中沉睡。小布重获自由，红雨衣留在荔湾镇寻找自己的孩子。\n\n阶段六落幕：\n· <b>绝命灵车</b>入手，司机唐骏入册，解锁六个东郊新任务。\n· <b>被死者亲吻的号码</b>——自杀干预接线员<b>张文宇</b>（红衣），遗愿交换之约。\n· <b>双生水鬼</b>：活捉水鬼赵双儿，水库捞回人偶棺材，解锁水下场景。\n· <b>隧道深处</b>：白龙洞蜘蛛男孩（推门人），隧道女鬼入册。\n· <b>荔湾镇（三星半）</b>：暴食女鬼之心喂张雅，冥楼揭秘，影子伏诛。\n· 真相：<b>影子是陈歌被抛弃的影子</b>，承载他所有的诅咒与恶意；冥胎尚未出世，四星任务开启。\n· <b>张雅</b>烧毁情书、形影不离——她成了陈歌的影子，也是这世间最深的羁绊。',

  text:'荔湾镇的战斗结束。小布——那个被当作"小布"的推门人——选择留下守门："门已经失控，每天只能打开一分钟。我会替你守好它。"\n\n黑色手机结算：\n\n<span class="clue">"恭喜你完成三星半试炼任务——荔湾镇！任务完成度：百分之九十四！获得隐藏道具——镇长的遗书！"</span>\n\n"镇长的遗书：恐怖屋突破颤栗迷宫等级后，可凭此以荔湾镇为场景开设分店。"\n\n"追加奖励——开膛手套装：雾都风衣、黑色信封、幸运剪刀、特效外科手术。"\n\n三星半场景荔湾镇（无人小镇）正式开放：荔湾住宅区、私立医院、十字路口、笑面犬、负二层电梯、深夜饭店——三十二条线索。\n\n陈歌招了三位活人员工：剪刀、醉汉张敬酒、医生。张雅吞下暴食女鬼之心与半颗红衣之上的心脏，沉睡难醒。白秋林已蜕变为半身红衣。许音正式成红衣。\n\n"剪刀，这套开膛手套装给你。"陈歌递过去："你的角色，是变态杀人狂。"',

  text:'闫大年解锁红衣之下最强能力——<span class="gift">心想事成</span>：每周一次，使用时漫画册会永久消失一页。\n\n"这是我攒了一辈子的执念。"闫大年翻开漫画册："你想画什么？"\n\n黑崎大蛇（李饱富）专程求见，与闫大年合作出版《灵楼鬼客》《阴间校园》，五五分账。\n\n陈歌前往白龙洞，向隧道深处的蜘蛛男孩示警——冥胎即将出世。他拨通自杀干预接线员张文宇的电话："帮我找冥胎的下落。"\n\n张文宇："可以。但你要帮我一个忙——第三个执念，帮一个作家拍电影。"\n\n陈歌查"左眼剧组"的旧闻：编剧身亡、女主发疯、男主失踪、剧组失火——导演常孤，失踪。\n\n六月十一日，陈歌的生日。徐婉送来烤糊的蛋糕和一张贺卡。陈歌把它收进背包，连夜赶往永陵山。',
  choices:[
    {label:'永陵山度假村——死人放映厅', tag:'', inf:'r11_zuoyan', next:'p11_fangying'}
  ]
},

p11_fangying:{
  ch:'第七百零八至七百一十四章', title:'死人放映厅',
  act:s=>{ if(!s.scenes.includes('死人放映厅')) s.scenes.push('死人放映厅'); if(!s.clues.includes('常孤')) s.clues.push('常孤'); s.grievance+=8; },
  text:'永陵山度假村，一个盲人看门人领陈歌来到地下——原永陵山744号房被推平改建，这里藏着<strong>死人放映厅</strong>。\n\n黑色手机震动：\n\n<span class="clue">"二星特殊任务——左眼的故事！第一部分：半小时内前往死人放映厅，观看一部完整影片。"</span>\n\n放映厅里只有恐怖片可播。盲人想装瞎逃走，被陈歌抓回："导演是谁？""常孤。"\n\n影片开始——<b>《同桌》</b>，25分钟，第一视角。\n\n画面里是常雯雨和贺秋美。旁白说：<span class="clue">"她的眼睛，是两个世界的交点。"</span>\n\n补习班的同桌。秋美的奶奶影子越来越短。女孩说："你照顾不了她的，我的左眼，全部都看见了。"\n\n毕业聚会后，雯雨被秋美拽入黑暗的家——镜中脸是无数女人拼合而成，左眼一模一样。\n\n陈歌解读："操控雯雨身体的，其实是秋美。"',
  choices:[
    {label:'继续看《名字》——不存在的人', tag:'', inf:'r11_shijie', next:'p11_mingzi'}
  ]
},

p11_mingzi:{
  ch:'第七百一十五至七百二十章', title:'《名字》与不存在的人',
  act:s=>{ if(!s.clues.includes('通灵鬼校=含江私立大学')) s.clues.push('通灵鬼校=含江私立大学'); if(!s.clues.includes('父母曾去过鬼校')) s.clues.push('父母曾去过鬼校'); },
  text:'员工福利——《名字》上映。影片里，雯雨（秋美的灵魂）深夜去夜校，网友"不存在的人"警告她：<span class="clue">"含江私立大学——那是通灵鬼校！不要回去！"</span>\n\n陈歌瞳孔骤缩——通灵鬼校，就是含江私立大学！\n\n"不存在的人"用死人的手机打来电话："你是陈歌？你的父母……也曾去过那所学校。"\n\n陈歌手指收紧。父母失踪前最后的轨迹，指向含江私立大学。\n\n影片继续：雯雨执意回鬼校找人。她找到那家医院——鬼校普通校区改建的废弃医院。一个假扮医生的男人拦住她："学校已经被取缔了。"\n\n那个男人摘下口罩——<b>常孤</b>，常雯雨的亲哥哥。\n\n"他想挖掉雯雨的左眼。"陈歌盯着屏幕："这双眼来自通灵鬼校，宿主不断更替。常孤要破除这个诅咒。"',
  choices:[
    {label:'交换的眼睛——秋美现身', tag:'', inf:'r11_qiumei', next:'p11_jiaohuan'}
  ]
},

p11_jiaohuan:{
  ch:'第七百二十一至七百二十三章', title:'交换的眼睛',
  act:s=>{ if(!s.clues.includes('秋美')) s.clues.push('秋美'); s.grievance+=12; },
  text:'"这眼睛诅咒了我妹妹一辈子。"常孤的手术刀落下——换眼手术。\n\n手术失败。常孤的眼渗出鲜血，一个红衣的身影从雯雨体内走出——<b>秋美</b>。\n\n日记揭示了真相：秋美被红衣引入雯雨体内，成了替身。她保住人性，左眼却空洞。换眼之后，她成了新的红衣。\n\n"常孤！你为什么要挖我的眼睛！"红衣秋美扑向常孤。\n\n更恐怖的是——厉鬼竟从屏幕里走了出来！\n\n"一起上！别让她回去！"陈歌怒吼。全体员工列阵迎战。\n\n常孤瘫在地上，陈歌蹲下来："你的父母也去过那所鬼校。帮我找到通灵鬼校，我帮你妹妹。"\n\n"秋美……她是个温柔的人。"',
  choices:[
    {label:'收服秋美，常孤入伙', tag:'', inf:'r11_qiumei', next:'p11_qiumei'}
  ]
},

p11_qiumei:{
  ch:'第七百二十四至七百二十六章', title:'秋美入册',
  act:s=>{ if(!s.employees.includes('秋美·特殊红衣')) s.employees.push('秋美·特殊红衣'); if(!s.employees.includes('常孤·合作者')) s.employees.push('常孤·合作者'); if(!s.clues.includes('左眼任务')) s.clues.push('左眼任务'); },
  text:'常孤睁开眼——他的左眼是雯雨的眼睛，右眼已经失明。\n\n"我答应你。"他攥紧拳头："找通灵鬼校。"\n\n漫画册翻开，秋美被收入其中。黑色手机提示：\n\n<span class="clue">"恭喜你获得特殊类型红衣厉鬼——秋美！离电影后实力大降，特殊能力？？？（待解锁）"</span>\n\n左眼任务第一、二部分完成。第三部分解锁：<span class="clue">"前往含江精神病院，看清楚雯雨梦的颜色！"</span>\n\n奖励：二星场景<b>死人放映厅</b>解锁，大量电影拍摄工具入手。\n\n"张雅还在沉睡。"陈歌看着自己的影子："通灵鬼校任务之前，她恐怕醒不过来了。"\n\n噩梦学院在论坛发帖质疑陈歌的鬼屋。陈歌收拾背包："去新海，会会他们。"',
  choices:[
    {label:'赴新海——恶梦学院', tag:'', inf:'r11_emn', next:'p11_emn'}
  ]
},


p11_emn:{
  ch:'第七百二十七至七百三十八章', title:'恶梦学院',
  act:s=>{ if(!s.clues.includes('恶梦学院')) s.clues.push('恶梦学院'); if(!s.clues.includes('摄影部校服女鬼')) s.clues.push('摄影部校服女鬼'); if(!s.clues.includes('四角游戏')) s.clues.push('四角游戏'); s.grievance+=15; },
  text:'新海，恶梦学院——一座六层鬼屋。陈歌带着许音、秋美买票入场，随身只带复读机、漫画册和圆珠笔，独得一支红色手电筒。\n\n电梯在黑暗中升空，游客入场。\n\n摄影部：合影照片里多出一个穿校服的女鬼。录像连放五遍后，血脸从幕布后钻出。陈歌识破"开门+员工通道"的机关，反手把假装被怪物抓走的学长塞进门锁死："手滑。"\n\n欢迎仪式的教室里，怪物砸门。投影与日记指向一个禁忌游戏——<b>四角游戏</b>。\n\n三个学生松手——实为演员布局孤立陈歌。但四角游戏真的招来了第五个人，演员们自己先乱了。\n\n"她穿的校服跟我们不一样。"监控里，四个人没动，却有脚步声。\n\n陈歌带着笔仙、老周假扮三道鬼影，吓疯了李坡。日记第一篇：三个孩子用稻草娃娃整死幼童——头七夜，床下的娃娃来找他们了。<span class="clue">催命、勾魂、离魄。</span>',
  choices:[
    {label:'仓库的笔仙——曲长林', tag:'', inf:'r11_sigou', next:'p11_quchang'}
  ]
},

p11_quchang:{
  ch:'第七百三十九至七百四十六章', title:'曲长林',
  act:s=>{ if(!s.employees.includes('曲长林·人偶师')) s.employees.push('曲长林·人偶师'); if(!s.clues.includes('曲长林')) s.clues.push('曲长林'); s.reputation=Math.min(100,s.reputation+8); },
  text:'仓库的笔仙场景里，假笔仙骗女演员"小蝶"杀人。陈歌以真笔仙念出咒语，写下她暗恋者的名字——曲长林。\n\n小蝶再问姻缘，真笔仙写下"去死"，吓瘫了她。\n\n曲长林——厕所怪谈里那个"小林"，一个拼命合群却始终孤独的人偶天才。陈歌翻出他的日记：满是合群的孤独。\n\n"做最好的自己，蝴蝶自来。"陈歌背他去院长室，互留电话。\n\n楼道里传来"爸爸"的声音。黑色香炉下，一张黑白照片——戴口罩的男人和小孩。封条封门，与女鬼对峙时，女鬼看见许音惊呼："他又出来了！"逃走。\n\n沉默的女人是失踪男孩的姐姐。陈歌独自走下负一层，发现十三级台阶。',
  choices:[

  ]
},

p11_514:{
  ch:'第七百四十七至七百五十五章', title:'514病房',
  act:s=>{ if(!s.clues.includes('血丝缝字日记')) s.clues.push('血丝缝字日记'); if(!s.clues.includes('514病房')) s.clues.push('514病房'); if(!s.items.includes('血丝缝字日记')) s.items.push('血丝缝字日记'); s.grievance+=15; },
  text:'许音红衣降临——滴血、黑线缠绕诅咒。音乐教室里，弹琴的许音唤起心底的记忆，钢琴里的女演员反而被吓晕；全楼员工跳窗逃命。\n\n演员们集体晕厥，老板上官轻鸿被吓昏在电梯里——他转进了<b>含江中央医院514号乐园专属病室</b>，业内治晕厥第一名，实则是被陈歌鬼屋吓晕的受害者病房。\n\n蔡队查陈歌的档案，李政说出陈歌父母失踪、深夜查案的苦衷。\n\n负一层封禁场景的课桌里，陈歌找到一本用血丝缝字的日记——来自门后。末页写着：<span class="clue">"我，死，一三，通灵鬼校，逃。"</span>\n\n"恶梦学院是按这本日记，还原了门后的场景。"\n\n514病房里，上官轻鸿与虚拟未来工程师等受害者结盟，密谋报复。陈歌现身逼问日记来源——上官轻鸿谎称日记是自编的。',
  choices:[
    {label:'清场病房，单独审问上官轻鸿', tag:'', inf:'r11_514', next:'p11_qianye'}
  ]
},

p11_qianye:{
  ch:'第七百五十六至七百五十九章', title:'前夜',
  act:s=>{ if(!s.clues.includes('通灵鬼校即将截止')) s.clues.push('通灵鬼校即将截止'); if(!s.clues.includes('常孤的左眼')) s.clues.push('常孤的左眼'); s.grievance+=10; },
  text:'病房清场，陈歌单独审上官轻鸿。\n\n"那本日记……是我从一个植物人男孩的母亲手里买的。男孩苏醒两天就死了，他母亲也病逝了。"上官轻鸿颓然："日记只是个空壳，真正的内容，我一个字都看不懂。"\n\n陈歌回到鬼屋。黑色手机的提示让他呼吸一滞：\n\n<span class="clue">"四星试炼任务——通灵鬼校！该任务将在二十七小时后截止！任务截止后，该场景将永远无法解锁！"</span>\n\n笔仙拒绝前往鬼校："我会选择自杀。"真理雕像流下血泪。\n\n秋美引路，永陵山护林小屋——常孤在那里。\n\n"进过那所学校的不止雯雨。"常孤的眼半睁半闭："学生家长逼问挖眼……雯雨被左眼恶灵控制，秋美是唯一保住人性的替身。"\n\n"用这只眼睛，我见过那扇门。"常孤闭上眼："普通的门，不断逼近床边……门后就是通灵鬼校。"\n\n左眼任务第三部分解锁：<span class="clue">"？？？——注意！该任务充满不确定性！极可能引发严重后果，请慎重选择！"</span>\n\n常孤决意今夜推门。',
  choices:[
    {label:'凌晨的守夜——等待那扇门', tag:'', inf:'r11_qianye', next:'p11_end'}
  ]
},

  text:'曲长林白天来投奔，带来一万三，改造僵尸复活夜场景。陈歌没有等到那扇门。\n\n晚上八点，常孤的电话打进来：<span class="clue">"我在含江精神疾病中心。"</span>\n\n距离通灵鬼校任务截止，只剩大约四小时。\n\n阶段十一落幕：\n· 三星半场景<b>荔湾镇</b>开放（无人小镇），<b>镇长的遗书</b>与<b>开膛手套装</b>入手。\n· 员工：<b>剪刀/张敬酒</b>（活人）、<b>红色高跟鞋</b>、<b>秋美</b>（特殊红衣）、<b>常孤</b>（合作者）、<b>曲长林</b>（人偶师）入册；<b>许音</b>红衣诅咒渐清；<b>闫大年</b>解锁心想事成。\n· 二星场景<b>死人放映厅</b>解锁，左眼任务推进——<b>通灵鬼校=含江私立大学</b>，父母曾去过。\n· 真相：<b>雯雨的眼是世界的交点</b>；<b>秋美</b>是唯一保住人性的替身；恶梦学院按<b>血丝缝字日记</b>还原门后场景。\n· 前夜：<b>通灵鬼校任务27小时后截止</b>，截止后场景永远无法解锁；常孤的左眼看见了那扇普通的门。\n\n雨夜，含江精神疾病中心。四星试炼——通灵鬼校，就在前方。',
  choices:[

p7_start:{
  ch:'第七百六十一章 · 通灵鬼校', title:'四星试炼任务',
  act:s=>{ if(!s.clues.includes('通灵鬼校')) s.clues.push('通灵鬼校'); s.grievance+=20; },
  text:'常雯雨的病房里，镜子碎片铺满地面。陈歌睁开眼——经历了一夜，他终于从通灵鬼校的世界回来了。\n\n口袋里的黑色手机疯狂震动，屏幕亮起一行行血字：\n\n<span class="clue">"幸运的厉鬼眷顾者！你已成功抵达含江西郊那所消失的学校，触发四星试炼任务——通灵鬼校。"</span>\n\n"四星试炼……"陈歌摸了摸怀里的黑色手机。上一晚他追着常雯雨留下的线索，在雨夜找到了那所早已废弃的学校，推开门的一瞬间，世界颠倒——门后是另一个通灵鬼校。\n\n"任务完成度会实时更新。要么活着走出来，要么成为那里的学生。"\n\n夜深了，陈歌再次站在那扇锈迹斑斑的校门前。这一次，他带上了所有员工。',
  choices:[
    {label:'推开校门，进入通灵鬼校（D班夜校）', tag:'', next:'p7_dclass'},
    {label:'先查看黑色手机的"试炼任务"细则', hint:'任务信息更详尽', next:'p7_start'}
  ]
},

p7_dclass:{
  ch:'第七百六十二章 · D班', title:'夜校与林思思',
  act:s=>{ if(!s.clues.includes('D班的夜校')) s.clues.push('D班的夜校'); if(!s.employees.includes('林思思·D班学生')) s.employees.push('林思思·D班学生'); },
  text:'通灵鬼校的夜晚，灯火通明。教学楼里传来朗朗读书声——这里的"学生"从不离开，他们早已死去，却仍在重复生前的日常。\n\n陈歌换上校服，混进D班。讲台上，一个梳着马尾的女孩正在发作业本，她看见陈歌，愣了愣："新来的？我叫林思思，D班的班长。坐那边吧，最后一排。那里……暂时没人。"\n\n陈歌落座，余光扫过教室——每一张课桌都摆着作业本，写满密密麻麻的字。他翻开手边那本，扉页上写着：<span class="clue">"如果我还能回家，我想把作业写完。"</span>\n\n"这所学校里的学生，都是"被门选中"的孩子。"林思思压低声音："他们生前大多失去了家人，死后执念不散，被这扇门吸了进来。你一个活人混进来……不想被老师发现的话，就少说话。"',
  choices:[
    {label:'向林思思打听"门"与画家的传闻', inf:'r7_linsisi', next:'p7_dorm413'},
    {label:'趁夜翻查学生档案，寻找异常', hint:'支线：档案室', next:'p7_dorm413'}
  ]
},

p7_dorm413:{
  ch:'第七百七十六章 · 413号宿舍', title:'钉子与替死鬼',
  act:s=>{ if(!s.clues.includes('413号宿舍的钉子')) s.clues.push('413号宿舍的钉子'); if(!s.talents.includes('阴瞳·洞悉')) s.talents.push('阴瞳·洞悉'); },
  text:'深夜，D班学生回到宿舍。陈歌被安排住进413号宿舍——据说这间宿舍很久没人敢住了。\n\n床板下，整整齐齐钉着七根生锈的铁钉。陈歌用阴瞳看去，钉子上缠绕着发黑的怨气，像是……在钉着什么。\n\n"你果然能看见。"一个怯生生的声音从角落传来。\n\n一个瘦小的男孩缩在阴影里，身上残留着钉子钉穿的伤口，怀里紧紧抱着一把糖果："我是……替死鬼。画家把我钉在这里，替他承受鬼校的怨气。钉子每多一根，我就更离不开这间宿舍。"\n\n他小心翼翼地递出一颗糖果："这糖是用灵魂做的，很甜。你要吃吗？"\n\n陈歌盯着那孩子，忽然笑了："你一直替别人受罪？那你愿意换个地方吗——比如，躲进我的影子里？"',
  choices:[
    {label:'收留替死鬼，让它躲进影子', tag:'OK', act:s=>{ if(!s.employees.includes('替死鬼·影子')) s.employees.push('替死鬼·影子'); }, inf:'r7_dingzi', next:'p7_mirror'},
    {label:'先观察，不轻信陌生"鬼"', hint:'谨慎路线', next:'p7_mirror'}
  ]
},

p7_mirror:{
  ch:'第七百八十七章 · 图书馆的镜子', title:'镜子世界',
  act:s=>{ if(!s.clues.includes('图书馆的镜子')) s.clues.push('图书馆的镜子'); if(!s.items.includes('灵魂糖果')) s.items.push('灵魂糖果'); },
  text:'鬼校图书馆，深夜。书架尽头立着一面巨大的穿衣镜——镜中映出的不是陈歌，而是另一个灯火通明的图书馆。\n\n镜子里，一个穿着深色长袍的身影正在作画。他背对着陈歌，画笔落在画布上，画的是——陈歌自己。\n\n"镜子里的世界，和这里一模一样。"陈歌伸手触碰镜面，指尖泛起涟漪。\n\n"别碰！"林思思追过来拉住他："那是画家的眼睛。他能透过镜子看见鬼校的每一个角落，也能顺着命运的脉络，画出任何人的未来。"\n\n陈歌收回手，若有所思："画家……他是谁？"\n\n"鬼校里最接近"推门人"的存在。他把自己画成了神，想在门后建一座属于绝望者的"天堂"。"林思思低下头："但天堂里没有他想要的东西。他一直在找一个人……一个能替他推开那扇门的人。"',
  choices:[
    {label:'在镜前留下线索，引画家现身', inf:'r7_jingzi', next:'p7_painter'},
    {label:'先去找常雯雨，弄清门的位置', inf:'r7_changwenyu', next:'p7_changwenyu'}
  ]
},

p7_painter:{
  ch:'第七百九十一章 · 画家的天堂', title:'顶级红衣',
  act:s=>{ if(!s.clues.includes('画家的天堂')) s.clues.push('画家的天堂'); },
  text:'镜中世界。陈歌推开门，走进画家笔下的"天堂"——上下颠倒的走廊，倒挂的教室，所有画布上都绘着同一张脸：一个微笑的男人。\n\n画家转过身，漆黑的眼瞳没有一丝光："你是这一百年来，第一个敢走进我画布的人。"\n\n"听说你想在门后建一座天堂。"陈歌直视他："可你的天堂里，所有人都挂着微笑——包括死人。"\n\n画家沉默了很久："我已经画了十几年，只差最后一块画布。画完它，我就能推开那扇门，成为真正的推门人。"\n\n他抬起沾血的手指："而你，陈歌——你身上有我画的痕迹。有人提前把你画进了我的故事里。你本来不该出现在这里。"\n\n陈歌瞳孔微缩："谁画的？"\n\n"你的影子。"画家意味深长地笑了。',
  choices:[
    {label:'追问"影子"的来历', inf:'r7_huajia', next:'p7_changwenyu'},
    {label:'直接与画家交手，试探实力', hint:'高难度路线', next:'p7_changwenyu'}
  ]
},

p7_changwenyu:{
  ch:'第七百九十四章 · 常雯雨', title:'想毁掉门的女人',
  act:s=>{ if(!s.clues.includes('常雯雨与三头恶鬼')) s.clues.push('常雯雨与三头恶鬼'); },
  text:'鬼校操场，血月当空。一个身穿血色校服的女人背对陈歌站立——常雯雨，鬼校另一位顶级红衣。\n\n"你就是那个混进来的活人？"她缓缓转身，猩红的独眼里满是嘲弄："有趣。画家把你当棋子，把你往"门"那里引。"\n\n"你和画家有仇？"\n\n"仇？"常雯雨狂笑："我只是想毁掉那扇门！门后是血色世界，一旦进入，就再也回不来了。那些学生——他们本来可以回家的，是画家把他们骗进来的！我宁愿让整座鬼校陪葬，也不愿他们永远困在门后！"\n\n她身后的阴影中，三头恶鬼的图案缓缓浮现："所以，活人，我给你一个选择：帮我毁掉门，或者，成为门的一部分。"\n\n远处，蒙眼男人与林思思的身影悄然逼近——画家的眼线已经盯上了陈歌。',
  choices:[
    {label:'假意答应常雯雨，借她牵制画家', inf:'r7_changwenyu', next:'p7_tisigui_plan'},
    {label:'表面中立，暗中把两边都算计进去', hint:'权谋路线', next:'p7_tisigui_plan'}
  ]
},

p7_tisigui_plan:{
  ch:'第八百九十九章 · 最后的底牌', title:'替死鬼骗局',
  act:s=>{ if(!s.clues.includes('替死鬼骗局')) s.clues.push('替死鬼骗局'); s.grievance+=10; },
  text:'鬼校的混战一触即发。常雯雨、画家、病号服三位顶级红衣围绕"门"厮杀，而陈歌只是这场棋局中不起眼的一枚棋子。\n\n"陈歌！你影子里到底藏着什么？"蒙眼男人步步紧逼："能让雷主任都忌惮的东西，绝不可能只是一个替死鬼！"\n\n陈歌微微一笑，从背包里掏出一大袋灵魂糖果，当着所有人的面，一颗一颗扔进自己的影子。\n\n糖果没入阴影，如冰雪消融。影子深处，传来若有若无的咀嚼声。\n\n"那个替死鬼……喂得饱吗？"雷主任脸色煞白："不对！他影子里真的有什么在苏醒！"\n\n围观的红衣们骚动起来。常雯雨死死盯着陈歌的影子："顶级红衣……不，比那更可怕的气息……"\n\n只有陈歌自己知道：他的影子里只有一个瘦小的替死鬼。他要用这袋糖果，让全校厉鬼相信——他影子里藏着一位红衣之上的存在。\n\n"一个普通人，要对抗三位顶级红衣，只能靠骗。"陈歌低声自语："把所有人的力量拧成一股绳，才有赢的可能。"',
  choices:[
    {label:'继续喂糖果，把骗局演到极致', tag:'OK', inf:'r7_tisigui', next:'p7_paint_shadow'},
    {label:'提前告知替死鬼：若败露，立刻藏好', hint:'稳妥之策', next:'p7_paint_shadow'}
  ]
},

p7_paint_shadow:{
  ch:'第九百零一章 · 凶神！', title:'画家的最后一画',
  act:s=>{ if(!s.clues.includes('画家画出替死鬼')) s.clues.push('画家画出替死鬼'); },
  text:'"陈歌！遮住你的影子！"\n\n人群惊呼。画家抬起沾血的手指，将最后一张画布对准了陈歌——他要顺着命运的脉络，画出陈歌影子里的"顶级红衣"。\n\n人皮画布上，陈歌的影子逐渐清晰。所有厉鬼屏住呼吸，等待那位传说中的凶神现身。\n\n画布上，影子的模样变了——一个瘦弱胆小的男孩，身上残留着钉子钉穿的伤口，怀里抱着一把糖果。\n\n"替死鬼？"画家失声。\n\n全场死寂。陈歌身后的影子被割裂，矮小的替死鬼怯生生地站在他旁边，怀里的糖果滚落一地。\n\n"我们被骗了？"常雯雨脸上的笑容彻底消失。\n\n雷主任气得发抖："你利用我！从进入女生寝室那些禁地开始，你就在利用我！"\n\n陈歌苍白的脸露出真诚的笑："我影子里确实没有顶级红衣。我这么做，只是想把你们的力量拧成一股绳——没人愿意做待宰的羔羊。一个人终究太弱，只有把大家聚在一起，才有一丝对抗的资格。"\n\n话音落下，他身后碎裂的影子并未消散，而是像一片黑色的汪洋，向四周扩散——\n\n"影子里的替死鬼骗过了所有人，可你们别忘了……"陈歌喃喃自语："我喂了他一整袋糖果，他吃饱了，就该干活了。"',
  choices:[
    {label:'呼唤影中沉睡的存在——张雅！', tag:'', inf:'r7_zhangya', next:'p7_zhangya'},
    {label:'独自抵挡围攻，为张雅苏醒争取时间', hint:'险中求胜', next:'p7_zhangya'}
  ]
},

p7_zhangya:{
  ch:'第九百零二章 · 最耀眼的红', title:'红衣之上·凶神',
  act:s=>{ if(!s.employees.includes('张雅·凶神')) s.employees.push('张雅·凶神'); if(!s.talents.includes('凶神之影·形影不离')) s.talents.push('凶神之影·形影不离'); s.grievance+=40; },
  text:'通灵鬼校的门即将崩碎。常雯雨将三头恶鬼的图案烙在门板上，以身为桥，要毁掉这扇门。\n\n裂缝从门底蔓延到门头。就在门要四分五裂的刹那——一只苍白的手从门后伸出，按在门上。\n\n黑发如同狂潮，从鬼校八方涌入，仿佛一朵黑色的彼岸花要将整座鬼校包裹。发丝垂落，苍白的皮肤与黑红色的血衣形成鲜明反差，一个个痛苦的红衣灵魂如同被囚禁的鱼，在她血衣上哀嚎。\n\n"她是谁？""她杀了多少红衣？""她的气息……已经超出了红衣的极限！"\n\n陈歌凝望着门边的血衣女人，脑中闪过高医生临死前的话："如果说善对应着恶，美对应着丑……那和人相对的究竟是什么？有的人说是鬼，还有的人说是——神！"\n\n"张雅……"陈歌轻声唤出那个名字。\n\n画家面如死灰，手臂无法抬起："我只能画鬼……那个女人，已经快要成为凶神。"\n\n"红衣之上，便是凶神。"林思思第一次听到这个词，浑身发冷。\n\n黑发遮蔽天空，淹没地面。天地之间，所有人眼中只剩一道身影——她身穿红衣，是这世界里唯一的血红。\n\n她踩着通灵鬼校的门，把鬼校的意志踩在脚下，血雨在她面前崩碎，连诅咒都被她撕成了粉末。',
  choices:[
    {label:'与张雅并肩，收拾残局', tag:'', next:'p7_painter_leave'},
    {label:'捡起常雯雨遗落的校服——黑色手机就在里面', hint:'关键道具', next:'p7_painter_leave'}
  ]
},

p7_painter_leave:{
  ch:'第九百零三章 · 画家的告别', title:'范郁与井',
  act:s=>{ if(!s.clues.includes('画家的告别')) s.clues.push('画家的告别'); },
  text:'张雅苏醒，鬼校大局已定。画家站在操场中央，看着踩门而立的凶神，终于放弃。\n\n"陈歌。"画家叫住他，这是最后一次交谈："每个人心底都有一口深不可测的井。我的井里藏着颠倒的世界——你呢？"\n\n陈歌沉默。他想起了范郁——那个会画画的男孩，他画的黑房子里挤满红色小人。画家与范郁，就像他与自己的影子。\n\n"你真的是范郁吗？"陈歌问出心底最想问的问题。\n\n"我不是范郁，我是画家。"画家转身，带着林思思与蒙眼男人跳入枯井，逃入血色城市："最深的绝望里，总能遇见最美的意外。我不会杀你，但你也活不了太久——她还未完全苏醒，红衣之上的气息，会慢慢吞掉你。"\n\n黑发渐退，张雅穿过陈歌的身体，重新沉入他的影子。血雨停了，鬼校的学生们愣愣地看着这片狼藉。\n\n"结束了。"陈歌弯腰，捡起常雯雨遗落在地上的血色校服——那件普通得不能再普通的校服口袋里，鼓鼓囊囊，硌得手心发疼。',
  choices:[
    {label:'搜常雯雨的校服口袋', tag:'关键', act:s=>{ if(!s.items.includes('黑色手机·回归')) s.items.push('黑色手机·回归'); }, inf:'r7_phone', next:'p7_return'},
    {label:'先安抚鬼校学生，组织善后', hint:'先人后己', next:'p7_return'}
  ]
},

p7_return:{
  ch:'第九百零四章 · 黑色手机', title:'任务完成·我们回家吧',
  act:s=>{ if(!s.scenes.includes('通灵鬼校')) s.scenes.push('通灵鬼校'); if(!s.employees.includes('老校长·通灵鬼校')) s.employees.push('老校长·通灵鬼校'); if(!s.employees.includes('樱红/樱白')) s.employees.push('樱红/樱白'); s.tourists+=800; s.reputation=Math.min(100,s.reputation+20); },
  text:'黑色手机屏幕亮起，十几条未读信息涌入——常雯雨并不知道黑色手机的秘密，这恐怕是最好的消息。\n\n"常雯雨掉包了你的手机，所以你进入鬼校后，手机里的提示你一条都没看到。"白秋林站在陈歌身后。\n\n陈歌滑动屏幕：\n\n<span class="clue">"幸运的厉鬼眷顾者！恭喜你完成四星试炼任务——通灵鬼校！任务完成度百分之九十！"</span>\n\n· 最高难度可选任务"画家的天堂"已完成——解锁特殊建筑<b>红衣画室（颠倒的世界）</b>：十三位红衣留下十三个地狱。\n· 可选任务"左眼"已完成——解锁常雯雨专属页面（灰色）：<span class="clue">残魂，仍旧存在</span>。\n· 可选任务"红白之间"已完成——解锁樱红、樱白员工栏：<b>"我是世上最恶毒的花，我喜欢红色，我会为你承受所有的疼痛。"</b>\n\n陈歌看向教学楼顶层——通灵鬼校的门静静立在那里，等待新的推门人。\n\n"老校长，以后这里就是你的学校。"陈歌把老校长推向前："鬼校意志是由每一个学生的意志组成的。等你获得他们所有人的认同，你自然会成为真正的推门人。"\n\n愿意离开的执念们跟在陈歌身后。他抱着张雅宿舍里取出的礼物盒，回头最后看了一眼鬼校："噩梦结束了。如果你们离开后无处可去，就去含江西郊新世纪乐园找我——我的鬼屋，就是你们的另一个家。"',
  choices:[
    {label:'推开通灵鬼校的门，返回现实', tag:'', next:'p7_final'},
    {label:'查看黑色手机，确认新员工与新场景', tag:'', next:'__phone__'}
  ]
},

p7_final:{
  ch:'第九百零五章 · 我们回家吧', title:'阶段七 · 完',
  act:s=>{ if(!s.scenes.includes('红衣画室')) s.scenes.push('红衣画室'); if(!s.employees.includes('常雯雨·残魂')) s.employees.push('常雯雨·残魂'); if(!s.clues.includes('血城与善念')) s.clues.push('血城与善念'); s.grievance+=25; s.tourists+=300; },
  text:'耳朵传来一声脆响。陈歌缓缓睁开眼——地面是镜子碎片，眼前是医院白色的床单。\n\n他回来了。常雯雨静静躺在病床上，一动不动，像一具失去生机的尸体。常孤七窍流血，躺在不远处。\n\n黑色手机持续震动，最后一条信息浮现：\n\n<span class="clue">"任务完成度百分之九十。最高难度可选任务已完成——通灵鬼校已纳入你的鬼屋版图。"</span>\n\n陈歌站在病房窗前，看向远处灰蒙蒙的天际线。通灵鬼校、红衣画室、常雯雨的残魂、愿意跟他回家的执念学生们……\n\n"我的鬼屋，越来越大了。"\n\n但他心里清楚，这一切还远未结束。画家逃入了血色城市，高医生带着冥胎的半颗心沉入血雾，而黑色手机的通讯录里，那个始终拨不通的号码——属于他的父母。\n\n"下一个四星任务……被诅咒的医院。"陈歌握紧手机："等我。我会把你们找回来的。"\n\n阶段七落幕：\n· 四星场景<b>通灵鬼校</b>入手，老校长接任推门人，樱红/樱白入册。\n· <b>红衣画室</b>（特殊建筑）：十三位红衣留下十三个地狱。\n· <b>常雯雨</b>残魂入册——灰色专属页面：残魂，仍旧存在。\n· 真相：<b>画家是范郁的映照</b>；影中的替死鬼骗过全校，张雅借机苏醒为<b>凶神</b>。\n· 承诺：去血城，找回父母。',
  choices:[
    {label:'进入阶段十二 · 冥胎与血色城市（Ch906 睡前故事书）', hint:'四星试炼：九夜捉迷藏', next:'p12_start'},
    {label:'进入阶段十二 · 冥胎与血色城市（Ch906 睡前故事书）', hint:'四星试炼：九夜捉迷藏', next:'p12_start'},
    {label:'黑色手机震动——四星任务【被诅咒的医院】强制触发', tag:'NEXT', next:'p8_start'},
    {label:'打开黑色手机，查看推理树与场景', tag:'', next:'__phone__'},
    {label:'回到阶段六尾声', next:'p6_final'}
  ]
},

// ===================== 阶段八 · 被诅咒的医院 =====================

// ===================== 阶段十二 · 冥胎与血色城市 =====================
p12_start:{
  ch:'第九百零六至九百三十五章', title:'通灵鬼校营业',
  act:s=>{ if(!s.clues.includes('通灵鬼校营业')) s.clues.push('通灵鬼校营业'); if(!s.clues.includes('怪谈教室')) s.clues.push('怪谈教室'); s.tourists+=500; s.reputation=Math.min(100,s.reputation+15); },
  text:'通灵鬼校四星场景解锁，鬼屋上了热搜。游客从全国各地赶来挑战——最高难度任务开放，敢死队一批批进场，一批批被担架抬出来。\n\n"不存在的美术社""三个小游戏""上下颠倒""413宿舍"——鬼校的每个角落都藏着执念学生的故事。怪谈教室里，陈歌用黑色手机接管了一个直播间："你的直播间，已经被我接管了。"\n\n电梯里的陌生人、纸团、摄像机——游客们在鬼校里留下一段段"高能"视频，恐怖屋的名气越来越大。\n\n张雅的睡前故事书被翻到最后一页：死后的世界、好久不见。陈歌知道，下一个四星任务已经在路上了。\n\n"我们的鬼屋，是九江最强的招牌。"陈歌站在鬼屋门口，看着排队的人群："可有些账，还没算清。"',
  choices:[
    {label:'江源小区的噩梦任务——邻居', tag:'', inf:'r12_linxiu', next:'p12_linxiu'}
  ]
},

p12_linxiu:{
  ch:'第九百三十六至九百四十八章', title:'灵嗅',
  act:s=>{ if(!s.talents.includes('灵嗅')) s.talents.push('灵嗅'); if(!s.clues.includes('江源小区')) s.clues.push('江源小区'); s.grievance+=10; },
  text:'黑色手机刷新噩梦任务——<span class="clue">"邻居：请在含江东郊寻找一栋十五层以上的居民楼，拥有地下室，没有第十四层。两点整进入楼道，从你踏上楼梯那一刻起闭上双眼。顺利从一楼走到顶楼，任务完成。禁止携带任何厉鬼、执念和恐怖屋物品！"</span>\n\n江源小区，十七层，没有十四层。凌晨两点，陈歌蒙上黑布，以白猫为"眼"，独自上楼。\n\n二楼夫妻争吵丢子（大宝），三楼尾随酒味，四楼白饭祭品。墙上摸到寻人启事孩子的脸——陈歌开导大宝，获得信任，牵手同行。\n\n十一楼有人欲拖他入屋（寻替死鬼）。十二楼遇冰冷女鬼，陈歌脱外衣相赠、陪她聊天——她是被厌食症仇人分尸藏在冰柜里的。\n\n"十三层上面是十四层。"女鬼警告。\n\n十四楼闻饭香，听见父亲的声音："陈歌，回家了。"邻居私语：幼年陈歌曾被新海医生治疗，开始给影子讲噩梦。\n\n十八层——陈歌睁眼，看见一个白大褂医生将年幼的自己推下楼。那是与隧道噩梦同一个凶手。\n\n任务完成，黑色手机：<span class="gift">"获得全新天赋能力——灵嗅！阴瞳能看见梦境的颜色，鬼耳能听到记忆的声音，灵嗅能闻到情绪的气味，殓容能装扮枯萎的灵魂，活偶能制作阴神的躯壳。你还差最后一种能力。"</span>',
  choices:[
    {label:'虚拟未来乐园——轮回鬼屋', tag:'', inf:'r12_huanyuan', next:'p12_lunhui'}
  ]
},

p12_lunhui:{
  ch:'第九百四十九至九百七十六章', title:'轮回鬼屋',
  act:s=>{ if(!s.clues.includes('红衣眷顾者')) s.clues.push('红衣眷顾者'); if(!s.clues.includes('诅咒之屋')) s.clues.push('诅咒之屋'); if(!s.employees.includes('戏服红衣')) s.employees.push('戏服红衣'); s.tourists+=300; },
  text:'陈歌率红衣员工（红色高跟鞋、无头女鬼、秋美）赴虚拟未来乐园"团建"。轮回主题场馆，设计师清明。陈歌直播勾选全部四十个地狱场景融合，中心电脑卡顿，腕表抽中职业"义工"。\n\n回魂夜电影院、地狱屠夫、拼人偶尸块——陈歌破解轮回噩梦：死者是被自己反复杀死的李想（被害妄想症），反复杀妻分尸。\n\n诅咒之屋（日式老宅）：血手印墙、DV里的祖宅故事——"桌上的神龛供神，角落的神龛养鬼"。女佣被女主人害死，半仙立龛封咒，此后开龛者皆遭厄运。\n\n大众旅馆（缓冲区）：十二房门钉孔连成黄道十二宫，七页死亡预告对应七人。陈歌扮碎颅医生持电锯追吓众演员，穿过监牢、澡堂、医院长廊。\n\n老宅：24张残缺恶鬼图，神龛内断头泥塑写"陈歌"。许音取像，影子吸走黑血，泥像碎裂。戏服红衣被收编。\n\n陈歌速通8400分登顶。清明崩溃——转盘抽到"没有面容的照片"，第五次抽到厉鬼，称号升级：<span class="gift">"红衣眷顾者！不幸、厄运、压抑、痛苦，红衣的眷顾……你会获得真相，也同时失去了一切。"</span>',
  choices:[
    {label:'将拆公园——方鱼与张忆', tag:'', inf:'r12_fangyu', next:'p12_fangyu'}
  ]
},

p12_fangyu:{
  ch:'第九百七十七至九百八十七章', title:'方鱼与张忆',
  act:s=>{ if(!s.employees.includes('张忆·夺忆')) s.employees.push('张忆·夺忆'); if(!s.clues.includes('方鱼')) s.clues.push('方鱼'); if(!s.items.includes('没有面容的照片')) s.items.push('没有面容的照片'); s.grievance+=10; },
  text:'转盘抽到的"没有面容的照片"，背面日期12月21日。陈歌循照片来到将拆的公园，遇见一个纹满"方鱼"名字的女人——<b>方鱼</b>，失忆症，每天重复同一天，忘掉自己名字后以纹身铭记。\n\n福利院看门大爷回忆：方鱼与一个话唠男孩是朋友，男孩在东郊水库春游时失踪于"种满鲜花的房屋"。陈歌幼年也遇过同一间屋——靠罗若雨布偶脱险。两条过去交织。\n\n水库小屋二楼刻满"方鱼"。背神龛的无脸怪物（泥塑写"方鱼"）能抹除红衣记忆。许音失忆仍护陈歌；无头女鬼撕开泥塑，露出被诅咒包裹的真身——<b>张忆</b>。\n\n张忆自述：被影子/冥胎所害，影子欲以方鱼为身体。他答应随陈歌。\n\n黑色手机：<span class="clue">"厉鬼张忆：强大的执念让他拥有一种极为少见的能力——他可以剥夺活人和鬼怪的记忆，潜力极大。"</span>',
  choices:[
    {label:'四星试炼·冥胎强制开启', tag:'', inf:'r12_mingtai', next:'p12_mingtai'}
  ]
},

p12_mingtai:{
  ch:'第九百八十八至一千章', title:'冥胎试炼开启',
  act:s=>{ if(!s.clues.includes('四星试炼·冥胎')) s.clues.push('四星试炼·冥胎'); if(!s.clues.includes('九座神龛')) s.clues.push('九座神龛'); s.grievance+=15; },
  text:'黑色手机强制开启四星试炼：\n\n<span class="clue">"以整座城市为舞台，这是一场生与死的捉迷藏！九座神龛代表着九个孩子，冥胎就藏在他们某一个人的身上！你必须要在九个夜晚之内找到它！否则等他做鬼的时候你必死无疑！"</span>\n\n倒计时九天。陈歌借白龙洞隧道车祸红衣母子的门（逃生通道，仅借一晚）；荔湾镇红雨衣、推门人小布同意同行；第三病栋唤出门楠。\n\n门楠探江铭家：小孩床边有若隐若现的血门。江源小区水鬼红衣揭穿：当夜欲拽陈歌者正是贾明（体内恶灵）。地下室寻得无泥塑神龛。\n\n手机鬼+门楠同寄一部手机跟踪江铭。培智学院遇吴声（天生不会说话）——"每一个孩子都是残缺的"。\n\n江铭家保险柜：寄养协议（生父江大武，月付五千）、泥塑"江铭"。孩子真名江铭，江九的干儿子原名江伟，改名江铭。\n\n午夜零点，孩子床边血门再现。门楠留守，陈歌独自推门而入——门后是破旧的合租公寓，男孩记忆深处。',
  choices:[
    {label:'江铭的门——寻找蜗牛的男孩', tag:'', inf:'r12_jiuzi', next:'p12_jiangming'}
  ]
},

p12_jiangming:{
  ch:'第一千零一至一千零七章', title:'江铭·蜗牛',
  act:s=>{ if(!s.clues.includes('还愿师称号')) s.clues.push('还愿师称号'); if(!s.clues.includes('冥胎九分之一')) s.clues.push('冥胎九分之一'); if(!s.employees.includes('吴金鹏·活人员工')) s.employees.push('吴金鹏·活人员工'); s.grievance+=15; },
  text:'江铭的门后世界安静无声——出声就会引来杀不死的"醉鬼父亲"。陈歌找到躲在衣柜里的江铭，阿婆（残念）写下提示："小心蜗牛。"\n\n屋顶坍塌出巨型血色蜗牛——江铭所有负面情绪与灾厄的化身。多位红衣破壳，见婴儿脸（冥胎幼年样）。婴儿化血污，留下一件木制玩具——陈歌父亲所送、曾失踪的玩具。\n\n真相：蜗牛=人工耳蜗，江铭的母亲攒钱想给先天听力缺陷的他做手术。\n\n江铭苏醒，阿婆入漫画册。陈歌以"还愿师"身份警告江铭拆神龛，救出被家暴的江铭母亲，把江铭的恐惧血丝塞进父亲脑中。\n\n黑色手机：<span class="clue">"冥胎任务已完成九分之一，冥胎听力遭受重创！幸运的红衣眷顾者，你的时间已经不多了！"</span>\n\n陈歌借咨询接近流浪歌手吴金鹏——照顾痴呆弟弟吴坤的顶梁柱。黑色手机提示：<span class="clue">"恭喜你累积获得一百次厉鬼或执念的祝福！获得还愿师称号！真正的救赎，并不是厮杀后的胜利，而是能在苦难之中找到生的力量和心的安宁。"</span>',
  choices:[
    {label:'吴声的门——被缝住的嘴巴', tag:'', inf:'r12_jiuzi', next:'p12_wusheng'}
  ]
},

p12_wusheng:{
  ch:'第一千零八至一千零一十八章', title:'吴声·还愿师',
  act:s=>{ if(!s.clues.includes('冥胎九分之二')) s.clues.push('冥胎九分之二'); if(!s.clues.includes('吴金鹏')) s.clues.push('吴金鹏'); s.grievance+=12; },
  text:'午夜，陈歌推门进入吴声的门后世界——老城区，被缝嘴的怪物象征保守秘密。\n\n记忆版吴金鹏（高大伟岸）带陈歌躲避戴红发卡的无脸女人、双头人、虐猫女孩。吴声目睹大黄狗被街坊打死、母亲遗弃的真相。\n\n无脸女人=吴声的母亲，她的脸变成男婴脸（冥胎），被红衣围杀，掉落一颗刻字的牙齿（被影子收走）。\n\n现实里，吴声终于哭出声音。黑色手机：<span class="clue">"已完成九分之二，冥胎无法再通过声音对你进行诅咒。"</span>\n\n吴坤（吴金鹏的痴呆弟弟）递出风扇，暗示手是被人按进风扇的。老城区邻居送来神龛供泥塑。\n\n陈歌招吴金鹏为第五位活人员工。老城区205房，由九部分构成的诅咒壁画写满"什么是人"——房东供出205租客是离家出走的初中生，其母在东郊怀爱医院任护士长。\n\n李政急电：贾明一伙被围捕，北野被击毙，贾明带男孩甄真脱逃——目标疑为陈歌。',
  choices:[
    {label:'方鱼的门——灰白失忆世界', tag:'', inf:'r12_fangyu', next:'p12_fangyu2'}
  ]
},


p12_fangyu2:{
  ch:'第一千零二十九至一千零三十二章', title:'方鱼之门',
  act:s=>{ if(!s.clues.includes('冥胎九分之四')) s.clues.push('冥胎九分之四'); if(!s.items.includes('血红金鱼')) s.items.push('血红金鱼'); s.grievance+=12; },
  text:'方鱼的门后世界灰白褪色，处处是镜。陈歌找到抱血红金鱼的"方鱼"——金鱼才是方鱼的本体。\n\n张忆试探，识破冥胎的寄托物。近十位红衣碾压，冥胎留下一颗弹珠——里面是影子的记忆：年幼的影子深夜溜出，进入鬼屋卫生间的血门，遇见满手血污的小孩后黑化。\n\n带出血红金鱼，方鱼听到"张忆"的名字开始头痛。黑色手机：<span class="clue">"已完成九分之四，冥胎丢失了最重要的一段记忆！"</span>',
  choices:[
    {label:'于见的门——心底住着恶魔', tag:'', inf:'r12_jiuzi', next:'p12_yujian'}
  ]
},

p12_yujian:{
  ch:'第一千零三十三至一千零四十九章', title:'于见·张雅老师',
  act:s=>{ if(!s.clues.includes('冥胎九分之五六')) s.clues.push('冥胎九分之五六'); if(!s.clues.includes('张雅当老师')) s.clues.push('张雅当老师'); s.grievance+=20; },
  text:'东郊怀爱医院护士的儿子于见——情感表达障碍综合征，没有"爱"的概念，是冥胎的最佳选择，而且主动接纳过冥胎。\n\n陈歌推门进入的，是"自己高中+于见遭遇"融合的荔湾镇。新来的英语老师竟是<b>张雅</b>。\n\n陈歌体验于见的过去：被孤立、被谣言针对。放学与张雅共伞去车站，去张雅家做饭，互诉往事——张雅因舞蹈室被污蔑放弃舞蹈。张雅成了于见生命中唯一的光。\n\n灾厄步步紧逼：记忆版父亲病倒（诅咒）、罗若雨烫伤、杜明妈妈传谣言逼走张雅。杜明跳窗被陈歌救下，他的母亲露出婴儿脸——冥胎现身。\n\n近十位红衣围杀冥胎（它能污染红衣之心）。唤醒于见，冥胎被撕碎，留下一张陈歌幼时的全家福——画上陈歌身后多出一片阴影（影子）。\n\n张雅告别消散："抱紧我。"红雨染红睡前故事书，末页出现温馨之梦：她梦见自己是老师，他是学生。\n\n黑色手机：<span class="clue">"冥胎任务已完成九分之五，冥胎失去了活人的情绪！已完成九分之六，冥胎失去了自己的心脏！"</span>',
  choices:[
    {label:'应瞳的门——永夜', tag:'', inf:'r12_jiuzi', next:'p12_yingtong'}
  ]
},

p12_yingtong:{
  ch:'第一千零五十一至一千零六十五章', title:'应瞳·永夜',
  act:s=>{ if(!s.clues.includes('冥胎九分之七')) s.clues.push('冥胎九分之七'); if(!s.employees.includes('红小姐')) s.employees.push('红小姐'); s.grievance+=18; },
  text:'应臣——"爱心猫咪"网站负责人，倒放虐猫视频的变态。他的弟弟应瞳是个盲人，极度惧怕哥哥。\n\n午夜血门出现，陈歌推门——门后是完全黑暗的永夜世界，他双眼失明。黑暗中摸出应瞳的卧室：盲人手机、坏音乐盒、扭曲人偶；应臣房间藏着用毛发包裹的肉块，床底绑着一具无头尸体。\n\n三胞胎阿目/阿童/阿应——各患利器/密闭/尖叫恐惧症，都是应臣"发现"的孤儿，实为应瞳被虐待后分裂出的承压人格。裙子女士、木头先生、红小姐是应臣杀害后留下的尸体。\n\n陈歌带应瞳逃出，讲"光的故事"鼓励他。应瞳倾诉身世：父母车祸双亡，应臣虐杀动物（昆虫→鸟→猫）、床底藏尸，三次逃跑被三次"警告"——利器、囚禁、惊吓，于是患上三种恐惧症。\n\n红衣围杀应臣——他化作婴儿=冥胎残念，被撕碎。掉落陈歌父亲拍摄的旧照（花海、幼年陈歌）。\n\n黑色手机：<span class="clue">"冥胎任务已完成九分之七，冥胎失去了看穿人心的双眼，无法再洞察你的想法！"</span>\n\n红小姐成为员工。应瞳泥塑中囚着裙子女士、木头先生、吴阿姨的残念，全部放走入册。',
  choices:[
    {label:'活棺村异变——第九个孩子向暖', tag:'', inf:'r12_xiangnuan', next:'p12_huoguan3'}
  ]
},

p12_huoguan3:{
  ch:'第一千零六十六至一千零六十八章', title:'向暖',
  act:s=>{ if(!s.clues.includes('向暖')) s.clues.push('向暖'); if(!s.clues.includes('投井女鬼失踪')) s.clues.push('投井女鬼失踪'); s.grievance+=10; },
  text:'活棺村门后世界被夷平——锁链与诅咒的痕迹，投井女鬼与鬼婴失踪，疑似高医生所为。朱姓女人透露：转生需要"埋葬过去的棺材+盛放新生的躯体"，村子每十年选无缺陷女婴入"门"房。\n\n东岗水库，陈歌遇见母子——男孩<b>向暖</b>，疑似冥胎第九个孩子。听到"冥胎"二字，向暖停止哭闹。\n\n水鬼红衣等入水库洞穴：洞连含江数条大江，内有连小布都忌惮之物——找到刻有陈歌父母名字的残缺塑像。\n\n"第九个孩子……向暖。"陈歌看着那个男孩："冥胎最后的宿主。"',
  choices:[
    {label:'噩梦小区——黑雾孤岛', tag:'', inf:'r12_xiangnuan', next:'p12_emeng'}
  ]
},

p12_emeng:{
  ch:'第一千零六十九至一千零八十六章', title:'噩梦小区',
  act:s=>{ if(!s.clues.includes('噩梦小区')) s.clues.push('噩梦小区'); if(!s.clues.includes('黑雾孤岛')) s.clues.push('黑雾孤岛'); s.grievance+=20; },
  text:'金华小区与九鸿小区相连。陈歌为向暖家解决退房问题，发现一栋怪楼：阳台晾头发的美发师、望远镜偷窥者、晾内衣+黑塑料袋的姐妹、装疯被儿子丢弃的李婆婆、大学生小孙（房东的猎物）、太平间看守黄大爷（脸布满咬痕，房间藏着"尸体墙"）。\n\n五楼504屈贵被杀，满墙诅咒血图。陈歌推断被诅咒医院怪物与屈赢共谋夺房藏身。\n\n"黑雾！"陈歌追凶至楼顶：黑雾如黑色海洋，小区如孤岛，黑雾内有巨大阴影。捡到向暖的无头泥塑，黑雾中传来疑似荔湾镇女人的求救声。\n\n黄大爷自砍"血肉墙"——墙是他的血肉砌成，内堆房东家人尸体。布娃娃断臂=臭味源头，疑似冥胎分割身体作镇楼基石。\n\n向暖家墙上贴满辱骂他母亲的传单，所有邻居门缝都塞着向暖的"死亡通知单"——被诅咒医院收集全小区恶意，诅咒向暖。',
  choices:[
    {label:'坟楼——0004号病人', tag:'', inf:'r12_yingzi2', next:'p12_fenlou'}
  ]
},

p12_fenlou:{
  ch:'第一千零八十七至一千零九十二章', title:'坟楼',
  act:s=>{ if(!s.clues.includes('0004号病人')) s.clues.push('0004号病人'); if(!s.clues.includes('布娃娃=冥胎')) s.clues.push('布娃娃=冥胎'); s.grievance+=15; },
  text:'九鸿一号楼=冥胎的过去（坟楼）。204房血字床单：布娃娃闯入民宅被丢弃/拆解/焚烧/埋土，一次次归来，最后钻进女主人的肚子。\n\n404房：红衣女孩=活人做的"布娃娃"（白布缚椅、无魂）。全家福中唯女孩脸未被刮花，照片后写"我才是你的家人"；抽屉十三张照片记录女孩捡到布娃娃→被弃垃圾堆——冥胎第一次被遗弃。\n\n504房门缝布条"不井来"=向暖笔迹（"进"写成"井"）。屋内档案袋：医生治疗"垃圾"的记录——<span class="clue">"不幸福是一种病"</span>，教布娃娃"先创造不幸再看幸福"。\n\n四份档案：医生如何调教"垃圾"（布娃娃）——摘鸟翅、教报复女孩。第四份：医生把布娃娃定为<b>0004号病人</b>（0001未见、0002在门另一边、0003藏匿含江），医生的"老师"亲自诊断。\n\n504房床下找到布娃娃左腿——引动满楼鬼孩子暴走。陈歌推断：这所恐怖医院=新海/含江交界的被诅咒医院，20年前就开始研究门。',
  choices:[
    {label:'九鸿二号楼——关于医院的记忆', tag:'', inf:'r12_yingzi2', next:'p12_yiyuan3'}
  ]
},

p12_yiyuan3:{
  ch:'第一千零九十三至一千零九十八章', title:'医院记忆',
  act:s=>{ if(!s.clues.includes('高医生日记')) s.clues.push('高医生日记'); if(!s.clues.includes('黑色手机的真正目的')) s.clues.push('黑色手机的真正目的'); s.grievance+=15; },
  text:'九鸿二号楼=医院病房结构，门号=病号。\n\n0097房日记：恋丑癖病患与"垃圾"同住，"垃圾"给自己起名<b>陈歌</b>——"那个怎么都杀不死的小孩"叫陈歌。\n\n0049房九本日记=九重人格，记述冥胎的恐怖能力：<span class="clue">"从嘴里说出的诅咒有一定概率成真，越恶毒越容易实现"</span>——每杀人身上臭味增一分。\n\n0011房日记=<b>高医生</b>的自述！他曾是医院夜班医生，后成0011号患者，与布娃娃同囚，帮其世界观"正常化"，联手逃跑失败（布娃娃被关黑门，高医生被诅咒），借一号病人与血色城市之机第二次逃出。\n\n0005房墙壁血字（5号病人）：杀院长、妻子被体内怪物杀死、医院在找"能背负整座城市罪孽的灵魂"以建造血色城市。\n\n陈歌联想高医生背负地下尸库、冥胎锁罪孽建"人性孤岛"，怀疑：<span class="clue">黑色手机的真正目的，也是建造血色城市。</span>\n\n二楼黑铁门全部上锁（冥胎最后秘密）。布娃娃头颅冲出大楼，黑雾开始入侵。温晴被无形之力（向暖）拽走——向暖与冥胎可能一体。\n\n卫生间镜子映出两张一样的脸：陈歌与冥胎。',
  choices:[
    {label:'冥胎=影子——第一位醒来的员工', tag:'', inf:'r12_yingzi2', next:'p12_yingzi4'}
  ]
},


p12_yingzi4:{
  ch:'第一千零九十九至一千一百章', title:'冥胎=影子',
  act:s=>{ if(!s.clues.includes('冥胎=影子')) s.clues.push('冥胎=影子'); if(!s.clues.includes('第一位醒来的员工')) s.clues.push('第一位醒来的员工'); s.grievance+=15; },
  text:'镜子里的冥胎掐住陈歌的脖子，强迫他观看共同记忆——结尾是三扇血门同时推开。冥胎想夺陈歌的身体：陈歌也是九子之一。\n\n小布成为第一个回应陈歌的员工。红色高跟鞋偷偷突破束缚隐藏。三扇门：江源小区的门（陈歌幼年所推）、被诅咒医院冥胎的黑铁门、恐怖屋卫生间的门。\n\n人头怪物破门而入，红色高跟鞋以鞋跟击杀（黑色纹路缠绕十分钟）。陈歌收集黑雾颗粒。\n\n黑雾绿化带里，冥胎化身的男孩回到陈歌的影子上："找到你了。"\n\n"主动逃走的是你，为什么还要回来找我？"陈歌说："让开吧，从你逃走的那一刻起，你和我之间就没有什么关系了。"\n\n男孩如影随形，跟在他身后。',
  choices:[
    {label:'门后大战——冥胎终章', tag:'', inf:'r12_mingtai', next:'p12_dazhan'}
  ]
},

p12_dazhan:{
  ch:'第一千一百零一至一千一百零九章', title:'门后大战',
  act:s=>{ if(!s.scenes.includes('九鸿小区·黑雾的世界')) s.scenes.push('九鸿小区·黑雾的世界'); if(!s.scenes.includes('救赎之门')) s.scenes.push('救赎之门'); if(!s.employees.includes('向暖·孤岛')) s.employees.push('向暖·孤岛'); if(!s.clues.includes('绝望乐园')) s.clues.push('绝望乐园'); s.grievance+=30; s.tourists+=800; },
  text:'冥胎以陈歌幼时模样站在他的影子上，欲夺身体。红色高跟鞋挣脱门后束缚，员工全体挣脱。\n\n金华小区B栋现无脸医生（人皮血衣，被诅咒医院方，疑似凶神）。头顶出现庞大的怪物——<b>"过去"</b>，巨蝉形血肉怪物，头部深嵌向暖。\n\n冥胎诱导向暖："他就是你未来的身体。"\n\n张雅现身——她脚下踩着一座血色城市，冲撞"过去"。陈歌识破冥胎计划：降生前吞掉两位凶神（无脸医生+张雅）。张雅是唯一变数。\n\n"过去"封天锁地。无脸医生以温晴威胁，布娃娃拼死抵抗被撕碎。向暖操控"过去"吞掉无脸医生。温晴主动跳入"过去"巨嘴："因为……你是我的孩子。"\n\n张雅以血城虚影碾碎冥胎心脏。向暖开始吸纳"过去"全部罪孽，冥胎魂飞魄散。温晴化巨鲸守护。\n\n无脸医生重伤爬出，被陈歌套话：医院早盯上冥胎；含江曾有"诅咒/约定"阻止医院进入，因施咒的夫妻已死而破除——暗指陈歌父母。张雅困杀无脸医生并将其吞食——成为吞掉凶神的凶神。\n\n黑色手机结算：<span class="clue">"四星试炼任务冥胎完成！任务完成度百分之八十！奖励：含江变态图鉴、特殊建筑九鸿小区（黑雾的世界）！恐怖屋升级为——绝望乐园！解锁特殊建筑救赎之门！"</span>\n\n常孤的死讯传来——死状诡异，临死前喊着陈歌的名字。',
  choices:[
    {label:'含江日常——电影《那年夏天我十八》', tag:'', next:'p12_dianying'}
  ]
},

p12_dianying:{

  text:'回鬼屋营业。收新员工：孙小军（诅咒之种）等七位。常孤的鬼魂现于病房，陈歌收他入漫画册。\n\n江九透露：冥胎曾去找过陈歌父母，此后永不踏入含江西郊——"含江城特殊，你父母因某些原因无法离开，或是在守护什么。"\n\n常孤请求救妹妹常雯雨（残念藏于新海一高女生身上）。常雯雨知晓：黑色手机曾出现在另一个人身上。\n\n兑现张文宇的执念——拍电影。选角：笔仙演女主，许音演男主。\n\n常孤按恐怖片拍法拍校园喜剧<b>《那年夏天我十八》</b>——"穿帮镜头"成了真实恐怖特效，电影爆火，破了恐怖片票房记录。\n\n马峰（虚拟未来乐园新掌舵）收集情报，密谋砸场。',

p12_yuke:{
  ch:'第一千一百一十五至一千一百三十三章', title:'游客大逃杀',
  act:s=>{ if(!s.clues.includes('101号病人')) s.clues.push('101号病人'); if(!s.clues.includes('左寒/王老师')) s.clues.push('左寒/王老师'); s.grievance+=20; s.tourists+=400; },
  text:'九名全国顶级鬼屋从业者上门挑战冥胎场景，签赌约。含江法医学院王老师抓逃课学生（鹤山、左寒）误入。马峰化名混入。\n\n任务：一小时找齐布娃娃残肢。无言小镇、静谧之家、暗楼……小孙误触静谧之家镜中机关（血色蜗牛门），打开密道，梁二梁三进入隐藏场景黑雾世界。小孙弄坏机关，黑雾泄漏，全场景难度飙升。\n\n红色高跟鞋在隐藏场景还原冥胎记忆。游客接连"消失"：梁二被诅咒缠住、梁三被婴儿鬼吓晕、付伯乐被红雨衣抓住、上官轻鸿崩溃、马峰被应臣虐猫房折磨……\n\n陈歌查明系小孙蝴蝶效应。伏击查文——被医院<b>101号病人</b>附身，医院自爆眼珠断线索。张忆读残存记忆：医院分白班/夜班医生，一位二十年前陪院长去含江的老夜班医生在含江失踪，引发医院大规模渗透含江；院长撕下孩子脸取名"不笑"。\n\n左寒团队找到布娃娃头颅（可驱散黑雾），推断：找齐残躯=亲手放出魔鬼，真通关是"感化"。\n\n卫医生认出王老师（王庆之），隐瞒身份，令张忆删其记忆。左寒装晕被卫医生点破："死者不会说话，法医要为死者发言。"',
  choices:[

  ]
},

  text:'罗董买下上官轻鸿的新海鬼屋赠予陈歌——新海分店"恶梦学院"开业。\n\n陈歌在虚拟未来乐园鬼屋三十连抽：时过（稀有厉鬼/时间天赋）、厕鬼、蝴蝶发卡（秋蝶）、血容（红衣）、白秋林的断手、许音的乐谱、残缺出生证明（门楠）、白色情人节糖果、蓝雨衣……\n\n发礼物：白秋林断手地址、门楠母亲的信、小孙婚戒（定位保命）、蓝雨衣——红雨衣孩子（诅咒与新海医院有关），红雨衣正式入职。\n\n许音的乐谱：许音觉醒，心口刻下黑色纹路——种下凶神种子。\n\n白秋林讨回断手。带十红衣劝降厕鬼（董文涛）。收时过（地铁幽灵，回10秒前能力，月限一次）、秋蝶（半身红衣）、血容/薛容（伊人阁红衣）。\n\n薛容=原被诅咒医院夜班整容医生，红色高跟鞋当年的主治医生——她偷走了红色高跟鞋最美的脸。取回脸。医院诅咒无解，除非让院长魂飞魄散。',
