<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>LilyMap</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="64x64" />
    <style>
      :root {
        --bg: #f6f3ee;
        --panel: #fffdf9;
        --ink: #272d3a;
        --muted: #6f7888;
        --line: #e6e0d7;
        --accent: #586b9a;
        --accent-2: #788bb7;
        --accent-ink: #fff;
        --accent-soft: #e9edf8;
        --danger: #b35e6a;
        --danger-soft: #f8e8ea;
        --danger-ink: #fff;
        --shadow: 0 14px 36px #28324612;
        --shadow-sm: 0 2px 9px #2832460f;
        --r: 12px;
        --r-sm: 8px;
      }
      [data-theme="dark"] {
        --bg: #151821;
        --panel: #1d2130;
        --ink: #e7eaf2;
        --muted: #9ca5b7;
        --line: #30384a;
        --accent: #a5b4e6;
        --accent-2: #7c8fc4;
        --accent-ink: #151a29;
        --accent-soft: #28324a;
        --danger: #e09aa4;
        --danger-soft: #412c35;
        --danger-ink: #331820;
        --shadow: 0 18px 48px #000a;
        --shadow-sm: 0 3px 14px #0008;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.65 "Segoe UI Variable",
          "Noto Sans SC",
          "Microsoft YaHei",
          ui-sans-serif,
          system-ui,
          sans-serif;
        letter-spacing: 0.005em;
        -webkit-font-smoothing: antialiased;
      }
      ::selection {
        background: var(--accent-soft);
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--line);
        border-radius: 8px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--muted);
        border: 2px solid transparent;
        background-clip: content-box;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      input:focus-visible,
      textarea:focus-visible,
      select:focus-visible {
        outline: none;
      }
      button,
      input,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      .app {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 224px 1fr;
      }
      .side {
        padding: 28px 14px;
        border-right: 1px solid var(--line);
        position: sticky;
        top: 0;
        height: 100vh;
        background: var(--panel);
      }
      .brand {
        display: flex;
        gap: 11px;
        align-items: center;
        padding: 0 10px 28px;
      }
      .mark {
        background: var(--accent);
        color: var(--accent-ink);
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        font: 700 17px Georgia;
        border-radius: 9px;
        box-shadow: var(--shadow-sm);
      }
      .brand b {
        display: block;
        font-size: 16px;
      }
      .brand small,
      .muted {
        color: var(--muted);
      }
      .nav {
        display: grid;
        gap: 3px;
      }
      .nav button {
        border: 0;
        background: transparent;
        text-align: left;
        padding: 10px 12px;
        border-radius: var(--r-sm);
        color: var(--muted);
        position: relative;
        transition:
          background 0.18s,
          color 0.18s;
      }
      .nav button:hover {
        background: var(--accent-soft);
        color: var(--ink);
      }
      .nav button.on {
        background: var(--accent-soft);
        color: var(--accent);
        font-weight: 600;
      }
      .nav button.on::before {
        content: "";
        position: absolute;
        left: 0;
        top: 22%;
        height: 56%;
        width: 3px;
        border-radius: 3px;
        background: var(--accent);
      }
      .nav button.publish-nav {
        color: var(--danger);
        margin-top: 12px;
        border-top: 1px solid var(--line);
        border-radius: 0;
        padding-top: 16px;
      }
      .nav button.publish-nav.on {
        background: var(--danger);
        color: var(--danger-ink);
      }
      .nav button.publish-nav.on::before {
        background: var(--danger-ink);
      }
      .side-foot {
        position: absolute;
        bottom: 22px;
        left: 24px;
        right: 24px;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.7;
      }
      .main {
        max-width: 1180px;
        width: 100%;
        margin: 0 auto;
        padding: 42px 48px 80px;
      }
      .top {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: flex-start;
        margin-bottom: 34px;
      }
      .top h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: -0.04em;
      }
      .top p {
        margin: 5px 0 0;
        color: var(--muted);
      }
      .actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .btn {
        border: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
        padding: 8px 12px;
        border-radius: var(--r-sm);
        transition:
          border-color 0.18s,
          color 0.18s,
          background 0.18s,
          box-shadow 0.18s,
          transform 0.12s;
      }
      .btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .btn:active {
        transform: translateY(1px);
      }
      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
      }
      .btn.primary:hover {
        background: var(--accent-2);
        border-color: var(--accent-2);
        color: var(--accent-ink);
        box-shadow: var(--shadow-sm);
      }
      .btn.danger {
        color: var(--danger);
      }
      .btn.danger:hover {
        border-color: var(--danger);
      }
      .icon {
        padding: 8px;
      }
      .section {
        margin-top: 34px;
      }
      .section h2 {
        font-size: 13px;
        margin: 0 0 12px;
        color: var(--muted);
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .quick {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }
      .quick button {
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: var(--r);
        background: var(--panel);
        color: var(--ink);
        text-align: left;
        transition:
          border-color 0.18s,
          box-shadow 0.18s,
          transform 0.18s;
      }
      .quick button:hover {
        border-color: var(--accent);
        box-shadow: var(--shadow-sm);
        transform: translateY(-2px);
      }
      .quick button strong {
        display: block;
        font-size: 15px;
        margin-bottom: 2px;
      }
      .quick button span {
        font-size: 12px;
        color: var(--muted);
      }
      .status {
        display: flex;
        gap: 30px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 18px 22px;
      }
      .status b {
        display: block;
        font-size: 13px;
      }
      .status small {
        color: var(--muted);
      }
      .dot {
        color: var(--accent);
      }
      .list {
        display: grid;
        border-top: 1px solid var(--line);
      }
      .row {
        display: grid;
        grid-template-columns: minmax(260px, 1fr) 115px minmax(
            160px,
            0.55fr
          ) 120px;
        gap: 16px;
        align-items: center;
        padding: 14px 10px;
        border-bottom: 1px solid var(--line);
        cursor: pointer;
        transition:
          background 0.15s,
          box-shadow 0.15s;
      }
      .row:hover {
        background: var(--panel);
        box-shadow: inset 3px 0 0 var(--accent);
      }
      .row b {
        display: block;
      }
      .path {
        font:
          12px ui-monospace,
          Consolas;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tag {
        display: inline-block;
        color: var(--accent);
        font-size: 12px;
        margin-right: 7px;
      }
      .badge {
        font-size: 12px;
        padding: 2px 7px;
        border-radius: 5px;
        background: var(--accent-soft);
        color: var(--accent);
        font-style: normal;
      }
      .badge.draft {
        background: #f2ead5;
        color: #89651e;
      }
      [data-theme="dark"] .badge.draft {
        background: #3a3018;
        color: #d3b96c;
      }
      .badge.protected {
        background: var(--danger-soft);
        color: var(--danger);
      }
      .toolbar {
        display: flex;
        gap: 10px;
        margin-bottom: 18px;
      }
      .toolbar input {
        width: 310px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--r-sm);
        padding: 9px 11px;
        color: var(--ink);
        transition:
          border-color 0.18s,
          box-shadow 0.18s;
      }
      .toolbar input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .drop {
        border: 1.5px dashed var(--line);
        background: var(--panel);
        padding: 48px 24px;
        text-align: center;
        border-radius: var(--r);
        transition:
          border-color 0.2s,
          background 0.2s;
      }
      .drop.over {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .drop h2 {
        font-size: 18px;
        color: var(--ink);
        margin: 0 0 4px;
      }
      .drop p {
        color: var(--muted);
      }
      .import-plan {
        max-width: 630px;
        margin: 22px auto;
        text-align: left;
        border-top: 1px solid var(--line);
        padding-top: 16px;
      }
      .kv {
        display: grid;
        grid-template-columns: 150px 1fr;
        gap: 10px;
        padding: 8px 0;
        border-bottom: 1px solid var(--line);
      }
      .kv span:first-child {
        color: var(--muted);
      }
      .drawer-mask,
      .modal-mask {
        background: #14201d66;
        backdrop-filter: blur(2px);
        position: fixed;
        inset: 0;
        z-index: 5;
        animation: fIn 0.2s ease;
      }
      @keyframes fIn {
        from {
          opacity: 0;
        }
      }
      .drawer {
        background: var(--panel);
        position: fixed;
        right: 0;
        top: 0;
        width: min(780px, 100vw);
        height: 100vh;
        z-index: 6;
        overflow: auto;
        box-shadow: var(--shadow);
        padding: 30px;
        animation: dIn 0.3s cubic-bezier(0.22, 0.9, 0.32, 1);
      }
      @keyframes dIn {
        from {
          transform: translateX(48px);
          opacity: 0.4;
        }
      }
      .drawer-head {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: flex-start;
        border-bottom: 1px solid var(--line);
        padding-bottom: 18px;
      }
      .drawer h2 {
        margin: 0;
        font-size: 22px;
      }
      .tabs {
        display: flex;
        gap: 16px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 20px;
      }
      .tabs button {
        padding: 14px 0;
        border: 0;
        border-bottom: 2px solid transparent;
        background: none;
        color: var(--muted);
        transition:
          color 0.18s,
          border-color 0.18s;
      }
      .tabs button:hover {
        color: var(--ink);
      }
      .tabs button.on {
        color: var(--ink);
        border-color: var(--accent);
        font-weight: 600;
      }
      .form {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .field {
        display: grid;
        gap: 5px;
      }
      .field.full {
        grid-column: 1/-1;
      }
      .field label {
        font-size: 12px;
        color: var(--muted);
      }
      .field input,
      .field textarea,
      .settings input {
        background: var(--bg);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: var(--r-sm);
        padding: 8px 10px;
        transition:
          border-color 0.18s,
          box-shadow 0.18s;
      }
      .field input:focus,
      .field textarea:focus,
      .settings input:focus,
      .lbrd-fields input:focus,
      .lbrd-top select:focus,
      .lbrd-top input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .field textarea {
        min-height: 240px;
        font:
          12px/1.5 ui-monospace,
          Consolas;
      }
      .switch {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
      }
      .switch p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }
      .asset-group {
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
      }
      .asset-group b {
        display: block;
      }
      .settings {
        max-width: 760px;
      }
      .settings details {
        border-bottom: 1px solid var(--line);
        padding: 14px 0;
      }
      .settings summary {
        cursor: pointer;
        font-weight: 650;
        transition: color 0.15s;
      }
      .settings summary:hover {
        color: var(--accent);
      }
      .settings-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        padding: 18px 0;
      }
      .settings-grid .field {
        padding: 11px 12px;
        border: 1px solid var(--line);
        border-radius: var(--r-sm);
        background: color-mix(in srgb, var(--panel) 80%, var(--bg));
      }
      .settings-grid .field > span {
        font-size: 12px;
        font-weight: 650;
      }
      .settings-grid .field input,
      .settings-grid .field select {
        width: 100%;
      }
      .settings-grid .field input[type="color"] {
        height: 38px;
        padding: 3px;
        cursor: pointer;
      }
      .settings-grid .field select {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--ink);
        padding: 8px 10px;
      }
      .settings-grid .switch {
        padding: 11px 12px;
        border: 1px solid var(--line);
        border-radius: var(--r-sm);
        background: color-mix(in srgb, var(--panel) 80%, var(--bg));
      }
      .menu-item {
        display: grid;
        grid-template-columns: 1fr 1fr 70px auto;
        gap: 8px;
        margin: 8px 0;
      }
      .lbrd-top {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-bottom: 22px;
      }
      .lbrd-top select,
      .lbrd-top input {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--r-sm);
        padding: 9px 10px;
        color: var(--ink);
        transition:
          border-color 0.18s,
          box-shadow 0.18s;
      }
      .lbrd-chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 24px;
      }
      .lbrd-chip {
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: var(--panel);
        color: var(--muted);
        font-size: 13px;
        cursor: pointer;
        transition:
          color 0.15s,
          border-color 0.15s,
          background 0.15s;
      }
      .lbrd-chip.on {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
      }
      .lbrd-canvas {
        display: grid;
        gap: 16px;
      }
      .lbrd-slot {
        border: 1px solid var(--line);
        border-radius: var(--r);
        background: var(--panel);
        padding: 14px;
      }
      .lbrd-slot-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }
      .lbrd-slot-head b {
        font-size: 14px;
      }
      .lbrd-slot-head span {
        color: var(--muted);
        font-size: 12px;
      }
      .lbrd-blocks {
        display: grid;
        gap: 10px;
      }
      .lbrd-block {
        border: 1px solid var(--line);
        border-radius: var(--r-sm);
        background: var(--bg);
        padding: 12px 14px;
      }
      .lbrd-block-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }
      .lbrd-block-head b {
        font-size: 13px;
      }
      .lbrd-block-head .muted {
        font-size: 12px;
      }
      .lbrd-mini {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .lbrd-mini button {
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 6px;
        padding: 4px 8px;
        font-size: 12px;
        color: var(--muted);
        transition:
          color 0.15s,
          border-color 0.15s;
      }
      .lbrd-mini button:hover {
        color: var(--accent);
        border-color: var(--accent);
      }
      .lbrd-mini button.del {
        color: var(--danger);
      }
      .lbrd-mini button.del:hover {
        border-color: var(--danger);
      }
      .lbrd-fields {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px dashed var(--line);
      }
      .lbrd-fields .field {
        display: grid;
        gap: 4px;
      }
      .lbrd-fields label {
        font-size: 12px;
        color: var(--muted);
      }
      .lbrd-fields input {
        background: var(--panel);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: var(--r-sm);
        padding: 6px 8px;
        transition:
          border-color 0.18s,
          box-shadow 0.18s;
      }
      .lbrd-add {
        border: 1px dashed var(--line);
        border-radius: var(--r-sm);
        padding: 11px;
        background: transparent;
        color: var(--muted);
        font-size: 13px;
        transition:
          color 0.15s,
          border-color 0.15s;
      }
      .lbrd-add:hover {
        color: var(--accent);
        border-color: var(--accent);
      }
      .lbrd-pick {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      .lbrd-studio {
        display: grid;
        grid-template-columns: minmax(160px, 0.72fr) minmax(360px, 1.7fr) minmax(220px, 0.9fr);
        gap: 16px;
        align-items: start;
      }
      .lbrd-palette,
      .lbrd-inspector {
        position: sticky;
        top: 18px;
        border: 1px solid var(--line);
        border-radius: var(--r);
        background: var(--panel);
        padding: 13px;
      }
      .lbrd-palette h2,
      .lbrd-inspector h2 { font-size: 14px; margin: 0 0 8px; }
      .lbrd-palette p,
      .lbrd-inspector p { font-size: 12px; margin: 0 0 12px; }
      .lbrd-palette-list { display: grid; gap: 8px; }
      .lbrd-palette-card {
        width: 100%; text-align: left; border: 1px solid var(--line); border-radius: var(--r-sm);
        background: var(--bg); color: var(--ink); padding: 10px; cursor: grab;
      }
      .lbrd-palette-card:active { cursor: grabbing; }
      .lbrd-palette-card small { display: block; color: var(--muted); margin-top: 3px; }
      .lbrd-device {
        border: 9px solid color-mix(in srgb, var(--ink) 82%, #25324a);
        border-radius: 22px; overflow: hidden; background: var(--bg); box-shadow: var(--shadow);
      }
      .lbrd-device-bar { display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; background: color-mix(in srgb, var(--panel) 90%, var(--ink)); color: var(--muted); font-size: 11px; }
      .lbrd-device-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); opacity: .8; }
      .lbrd-device .lbrd-canvas { padding: 14px; min-height: 520px; background: linear-gradient(135deg, color-mix(in srgb, var(--bg) 94%, var(--accent)), var(--bg) 42%); }
      .lbrd-slot { transition: border-color .15s, background .15s, transform .15s; }
      .lbrd-slot.drag-over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--panel)); transform: scale(1.01); }
      .lbrd-block { cursor: pointer; }
      .lbrd-block[draggable="true"] { cursor: grab; }
      .lbrd-block.selected { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 22%, transparent); }
      .lbrd-block .lbrd-fields { display: none; }
      .lbrd-inspector .lbrd-fields { grid-template-columns: 1fr; margin-top: 0; padding-top: 0; border-top: 0; }
      @media (max-width: 1100px) { .lbrd-studio { grid-template-columns: 190px 1fr; } .lbrd-inspector { grid-column: 1 / -1; position: static; } .lbrd-inspector .lbrd-fields { grid-template-columns: 1fr 1fr; } }
      @media (max-width: 760px) { .lbrd-studio { grid-template-columns: 1fr; } .lbrd-palette, .lbrd-inspector { position: static; } .lbrd-palette-list { grid-template-columns: 1fr 1fr; } .lbrd-inspector .lbrd-fields { grid-template-columns: 1fr; } .lbrd-top { flex-wrap: wrap; } }

      /* LilyMap finishing pass — one calm, blog-aligned visual system. */

        --danger-ink: #ffffff;

        --r-sm: 10px;

      [data-theme="dark"] {

        --accent-2: #a3d0c8;
        --accent-ink: #14211e;

      .publish-progress {
        margin-top: 18px;
        padding: 16px 17px;
        border: 1px solid color-mix(in srgb, var(--accent) 25%, var(--line));
        border-radius: var(--r);
        background: color-mix(in srgb, var(--accent-soft) 48%, var(--panel));
        box-shadow: var(--shadow-sm);
      }
      .publish-progress[hidden] {
        display: none;
      }
      .publish-progress__head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
      }
      .publish-progress__head b {
        color: var(--ink);
        font-size: 14px;
      }
      .publish-progress__head span {
        color: var(--accent);
        font-variant-numeric: tabular-nums;
        font-weight: 750;
      }
      .publish-progress__track {
        position: relative;
        height: 9px;
        margin-top: 11px;
        overflow: hidden;
        border-radius: 999px;
        background: color-mix(in srgb, var(--line) 72%, var(--panel));
      }
      .publish-progress__bar {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 38%, transparent);
        transform: scaleX(0);
        transform-origin: left center;
        transition: transform 0.35s ease;
      }
      .publish-progress__bar::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(100deg, transparent 20%, #ffffff70 50%, transparent 80%);
        animation: publish-shimmer 1.4s linear infinite;
      }
      .publish-progress p {
        min-height: 1.5em;
        margin: 9px 0 0;
        color: var(--muted);
        font-size: 12px;
      }
      .publish-progress.is-complete {
        border-color: color-mix(in srgb, var(--accent) 52%, var(--line));
      }
      .publish-progress.is-complete .publish-progress__bar::after,
      .publish-progress.is-failed .publish-progress__bar::after {
        animation: none;
      }
      .publish-progress.is-failed {
        border-color: color-mix(in srgb, var(--danger) 45%, var(--line));
        background: color-mix(in srgb, var(--danger-soft) 62%, var(--panel));
      }
      .publish-progress.is-failed .publish-progress__head span,
      .publish-progress.is-failed p {
        color: var(--danger);
      }
      .publish-progress.is-failed .publish-progress__bar {
        background: var(--danger);
      }
      @keyframes publish-shimmer {
        from { transform: translateX(-100%); }
        to { transform: translateX(100%); }
      }

      @media (prefers-reduced-motion: reduce) {
        *,

      /* Workspace UI: flat surfaces, compact rhythm and explicit operation state. */
      :root {

        --accent: #8ac8c0;
        --accent-2: #aeddd5;
        --accent-soft: #2a4140;
        --danger: #e29aac;

        --shadow-sm: 0 5px 18px #0003;

      .side { background: color-mix(in srgb, var(--panel) 96%, var(--accent-soft)); border-right: 1px solid var(--line); }
      .mark { background: var(--accent); border-radius: 11px 11px 11px 4px; box-shadow: var(--shadow-sm); }
      .mark::after { display: block; background: #e8839b; }

      .brand b { font-weight: 700; letter-spacing: -0.02em; }

      .module-library .asset-grid { gap: 12px; }

      .module-card[hidden] { display: none; }
      .module-card:hover { transform: translateY(-2px); border-color: var(--accent); }
      .module-card .asset-meta { gap: 7px; padding: 14px; }

      .module-steps > div { display: grid; gap: 2px; padding: 13px 16px; border: 1px solid var(--line); border-radius: 11px; background: color-mix(in srgb, var(--panel) 88%, transparent); }
      .module-steps > div:nth-child(2) { border-color: color-mix(in srgb, #e8839b 25%, var(--line)); background: color-mix(in srgb, var(--panel) 94%, #f4a7b9); }

      .music-track-row { display: grid; grid-template-columns: 22px 30px minmax(0,1fr) auto auto; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line); }

        .module-search input { width: 100%; }
        .music-import__state { border-left: 0; border-top: 2px solid var(--accent); }
        .music-picker { align-items: stretch; flex-direction: column; gap: 6px; }
        .music-track-editor > summary, .music-track-editor__body { padding-inline: 14px; }
        .music-track-row { grid-template-columns: 20px 22px minmax(0,1fr) auto; gap: 6px; padding: 8px; }
        .music-track-row > a { grid-column: 3 / 5; justify-self: end; }
        .music-track-editor__footer .btn { width: 100%; }
        .music-track-editor__footer .muted { margin-left: 0; }
      }
      .operation-progress {
        position: fixed; z-index: 1000; top: 13px; right: 18px;
        width: min(350px, calc(100vw - 36px)); padding: 10px 12px 12px;
        border: 1px solid var(--line); border-radius: 6px;
        color: var(--ink); background: var(--panel);
        box-shadow: 0 10px 28px #10201d24;
      }
      .operation-progress[hidden] { display: none; }
      .operation-progress__head { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; }
      .operation-progress__head small { color: var(--muted); white-space: nowrap; }
      .operation-progress__track { height: 4px; margin-top: 9px; overflow: hidden; background: var(--accent-soft); }
      .operation-progress__bar { display: block; height: 100%; width: 30%; background: var(--accent); animation: operation-sweep 1.4s ease-in-out infinite; }
      .operation-progress.is-complete .operation-progress__bar { width: 100%; animation: none; }
      @keyframes operation-sweep { from { transform: translateX(-110%); } to { transform: translateX(350%); } }
      .drawer-workspace { display: grid; grid-template-columns: minmax(235px, .72fr) minmax(0, 1.28fr); gap: 18px; align-items: start; }
      .drawer-panel { padding: 20px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); }
      .drawer-panel h2 { margin: 0 0 6px; font-size: 17px; }
      .drawer-panel p { margin: 0 0 16px; color: var(--muted); font-size: 13px; line-height: 1.6; }
      .drawer-cards { display: grid; gap: 7px; margin-top: 16px; }
      .drawer-card { width: 100%; padding: 12px 13px; border: 1px solid var(--line); border-radius: var(--r-sm); background: transparent; color: var(--ink); text-align: left; }
      .drawer-card:hover { border-color: var(--accent); }
      .drawer-card.on { border-color: var(--accent); background: var(--accent-soft); }
      .drawer-card strong, .drawer-card small { display: block; }
      .drawer-card small { margin-top: 3px; color: var(--muted); }
      .drawer-editor { display: grid; gap: 16px; }
      .drawer-editor .field { display: grid; gap: 6px; }
      .drawer-editor .field span { font-weight: 600; font-size: 13px; }
      .drawer-editor input[type="text"], .drawer-editor textarea { width: 100%; min-width: 0; padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg); color: var(--ink); }
      .drawer-editor textarea { min-height: 78px; resize: vertical; }
      .drawer-editor__actions, .drawer-editor__head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
      .drawer-article-search { margin: 4px 0 8px; }
      .drawer-article-list { max-height: 350px; overflow: auto; border: 1px solid var(--line); border-radius: var(--r-sm); }
      .drawer-article { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
      .drawer-article:last-child { border-bottom: 0; }
      .drawer-article:hover { background: var(--accent-soft); }
      .drawer-article[hidden] { display: none; }
      .drawer-article input { margin-top: 3px; accent-color: var(--accent); }
      .drawer-article span { min-width: 0; }
      .drawer-article strong, .drawer-article small { display: block; }
      .drawer-article strong { font-size: 13px; font-weight: 600; }
      .drawer-article small { color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
      .drawer-assigned { display: grid; gap: 5px; padding: 0; margin: 0; list-style: none; }
      .drawer-assigned li { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r-sm); font-size: 13px; }
      .drawer-assigned__buttons { display: flex; flex: none; gap: 3px; }
      .drawer-assigned__buttons button { padding: 3px 7px; }
      .drawer-save-hint { color: var(--muted); font-size: 12px; }
      .friend-editor-list { display: grid; gap: 14px; margin-top: 20px; }
      .friend-editor-card { padding: 18px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); }
      .friend-editor-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
      .friend-editor-head strong { font-size: 15px; overflow-wrap: anywhere; }
      .friend-editor-actions { display: flex; flex-wrap: wrap; gap: 6px; }
      .friend-editor-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .friend-editor-fields input { width: 100%; min-width: 0; }
      /* Publishing is a guided setup, not a dense wall of status cards. */
      .publish-setup { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 24px; }
      .publish-setup .section { margin: 0; min-width: 0; }
      .publish-setup .field input { width: 100%; min-width: 0; }
      .publish-step { display: inline-block; margin-bottom: 11px; color: var(--accent-2); font: 800 10px/1.2 "Cascadia Code", Consolas, monospace; letter-spacing: .13em; }
      .publish-setup .section { border-top: 3px solid color-mix(in srgb, var(--accent) 72%, var(--panel)); }
      .publish-setup .section:nth-child(2) { border-top-color: #e8839b; }
      .publish-setup .section p.muted { line-height: 1.65; }
      .publish-setup .section .field { margin-top: auto; }
      .publish-setup .section input { background: color-mix(in srgb, var(--bg) 66%, var(--panel)); }
      .publish-setup + .section .status { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .publish-setup + .section .status > div { min-width: 0; overflow-wrap: anywhere; }
      .section:has(.publish-step) { scroll-margin-top: 24px; }
      @media (max-width: 700px) { .friend-editor-fields { grid-template-columns: 1fr; } .friend-editor-head { align-items: flex-start; flex-direction: column; } }
      @media (max-width: 900px) { .publish-setup { grid-template-columns: 1fr; } }
      @media (max-width: 680px) { .publish-setup + .section .status { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
      @media (max-width: 900px) { .drawer-workspace { grid-template-columns: 1fr; } }
      @media (max-width: 800px) { .main { padding-top: 26px; } .operation-progress { top: auto; bottom: 12px; } }
      </style>
  </head>
  <body>
    <div class="app">
      <aside class="side">
        <div class="brand">
          <div class="mark" aria-hidden="true">L</div>
          <div><b>lilymap</b><small>博客编排工作台</small></div>
        </div>
        <nav class="nav" id="nav" aria-label="LilyMap 功能导航">
          <div class="nav-group"><span class="nav-label">工作台</span>
            <button type="button" data-view="overview" class="on"><span aria-hidden="true">⌂</span>概览</button>
          </div>
          <div class="nav-group"><span class="nav-label">内容</span>
            <button type="button" data-view="articles"><span aria-hidden="true">文</span>文章</button>
            <button type="button" data-view="drawers"><span aria-hidden="true">▥</span>分类抽屉</button>
            <button type="button" data-view="friends"><span aria-hidden="true">链</span>友链</button>
            <button type="button" data-view="profile"><span aria-hidden="true">我</span>个人资料</button>
            <button type="button" data-view="import"><span aria-hidden="true">↥</span>导入文章</button>
            <button type="button" data-view="resources"><span aria-hidden="true">图</span>资源库</button>
          </div>
          <div class="nav-group"><span class="nav-label">设计</span>
            <button type="button" data-view="appearance"><span aria-hidden="true">色</span>外观</button>
            <button type="button" data-view="layouts"><span aria-hidden="true">布</span>页面布局</button>
            <button type="button" data-view="modules"><span aria-hidden="true">模</span>模块库</button>
          </div>
          <div class="nav-group"><span class="nav-label">系统</span>
            <button type="button" data-view="settings"><span aria-hidden="true">设</span>博客设置</button>
            <button type="button" data-view="version"><span aria-hidden="true">诊</span>系统诊断</button>
            <button type="button" data-view="publish" class="publish-nav"><span aria-hidden="true">↑</span>发布上线</button>
          </div>
        </nav>
        <div class="side-foot">
          Typora 写作 · lilymap 编排<br />Local Repository Mode
        </div>
      </aside>
      <main class="main" id="main"></main>
    </div>
    <div class="operation-progress" id="operation-progress" role="status" aria-live="polite" hidden>
      <div class="operation-progress__head"><strong id="operation-label">正在加载</strong><small id="operation-count">请稍候</small></div>
      <div class="operation-progress__track" role="progressbar" aria-label="操作进行中"><i class="operation-progress__bar"></i></div>
    </div>
    <input
      id="file-picker"
      type="file"
      accept=".md,.markdown,text/markdown,image/*"
      multiple
      hidden
    /><input id="folder-picker" type="file" webkitdirectory multiple hidden />
    <script>
      const allowedViews = new Set([
        "overview",
        "articles",
        "drawers",
        "friends",
        "profile",
        "import",
        "resources",
        "layouts",
        "modules",
        "appearance",
        "settings",
        "version",
        "publish",
      ]);
      const requestedView = new URLSearchParams(location.search).get("view");
      const state = {
        view: allowedViews.has(requestedView) ? requestedView : "overview",
        posts: [],
        status: null,
        settings: null,
        theme: localStorage.getItem("desk-theme") || "light",
      };
      let publishTracker = 0;
      document.documentElement.dataset.theme = state.theme;
      const $ = (s) => document.querySelector(s),
        esc = (s) =>
          String(s ?? "").replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          );
      const activeOperations = new Map();
      let operationSequence = 0;
      let operationShowTimer = 0;
      let operationHideTimer = 0;
      function operationLabel(url, method = "GET") {
        if (url.includes("/music/netease/import")) return "正在同步网易云歌单";
        if (url.includes("/music/netease/status")) return "正在检查歌单快照";
        if (url.includes("/media/")) return "正在处理媒体文件";
        if (url.includes("/upload")) return "正在上传文件";
        if (url.includes("/publish")) return "正在检查发布状态";
        if (method !== "GET") return "正在保存更改";
        if (url.includes("/layouts")) return "正在加载页面布局";
        if (url.includes("/modules")) return "正在加载模块库";
        if (url.includes("/files")) return "正在扫描资源文件";
        return "正在加载数据";
      }
      function syncOperationProgress() {
        const box = $("#operation-progress");
        if (!activeOperations.size) return;
        box.hidden = false;
        box.classList.remove("is-complete");
        $("#operation-label").textContent = [...activeOperations.values()].at(-1);
        $("#operation-count").textContent = activeOperations.size > 1 ? `${activeOperations.size} 项任务` : "进行中";
      }
      function beginOperation(label) {
        const id = ++operationSequence;
        clearTimeout(operationHideTimer);
        activeOperations.set(id, label);
        clearTimeout(operationShowTimer);
        operationShowTimer = setTimeout(syncOperationProgress, 120);
        return id;
      }
      function endOperation(id) {
        if (id == null) return;
        activeOperations.delete(id);
        if (activeOperations.size) { syncOperationProgress(); return; }
        clearTimeout(operationShowTimer);
        const box = $("#operation-progress");
        if (box.hidden) return;
        box.classList.add("is-complete");
        $("#operation-count").textContent = "已完成";
        operationHideTimer = setTimeout(() => { if (!activeOperations.size) box.hidden = true; }, 500);
      }
      function updateOperation(id, label) {
        if (activeOperations.has(id)) {
          activeOperations.set(id, label);
          syncOperationProgress();
        }
      }
      async function trackedFetch(url, options = {}, label) {
        const operation = beginOperation(label || operationLabel(url, options.method || "GET"));
        try { return await fetch(url, options); }
        finally { endOperation(operation); }
      }
      async function api(url, o = {}) {
        const { progressLabel, silentProgress, ...requestOptions } = o;
        const operation = silentProgress ? null : beginOperation(progressLabel || operationLabel(url, o.method || "GET"));
        try {
        let r = await fetch(url, {
            ...requestOptions,
            headers: {
              ...(o.body && !(o.body instanceof FormData)
                ? { "content-type": "application/json" }
                : {}),
              ...(o.headers || {}),
            },
          }),
          d = await r.json().catch(() => ({}));
        if (!r.ok) throw Error(d.error || "请求失败");
        return d;
        } finally { endOperation(operation); }
      }
      function toast(t) {
        let n = document.createElement("div");
        n.className = "toast";
        n.setAttribute("role", "status");
        n.setAttribute("aria-live", "polite");
        n.textContent = t;
        document.body.append(n);
        setTimeout(() => n.remove(), 2600);
      }
      async function refresh() {
        const [a, s] = await Promise.all([
          api("/api/posts"),
          api("/api/status"),
        ]);
        state.posts = a.posts;
        state.status = s;
        render();
      }
      function nav() {
        document
          .querySelectorAll("#nav button")
          .forEach((b) => {
            const active = b.dataset.view === state.view;
            b.classList.toggle("on", active);
            if (active) b.setAttribute("aria-current", "page");
            else b.removeAttribute("aria-current");
          });
      }
      function setView(view) {
        if (!allowedViews.has(view)) return;
        if (state.view === 'drawers' && view !== 'drawers' && state.drawerDirty) {
          if (!confirm('分类抽屉还有未保存的更改，确定离开并放弃吗？')) return;
          state.drawerData = null;
          state.drawerDirty = false;
        }
        if (state.view === 'friends' && view !== 'friends' && state.friendsDirty) {
          if (!confirm('友链还有未保存的更改，确定离开并放弃吗？')) return;
          state.friendsData = null;
          state.friendsDirty = false;
        }
        if (state.view === 'profile' && view !== 'profile' && state.profileDirty) {
          if (!confirm('个人资料还有未保存的更改，确定离开并放弃吗？')) return;
          state.profileData = null;
          state.profileDirty = false;
        }
        state.view = view;
        const url = new URL(location.href);
        if (view === "overview") url.searchParams.delete("view");
        else url.searchParams.set("view", view);
        history.replaceState(null, "", url);
        render();
      }
      function page(title, sub, actions = "") {
        let runtimeAlert = state.status && Number(state.status.apiVersion || 0) < 2
          ? `<div class="runtime-alert" role="alert"><span>!</span><div><b>LilyMap 前后端版本不一致</b><small>当前仍是旧后端进程，所以新媒体功能会提示“未知 API”。请关闭 LilyMap 终端后重新运行 npm run admin；仅刷新网页无法更新后端。</small></div></div>`
          : "";
        if (state.view === 'drawers' && state.status && Number(state.status.apiVersion || 0) < 3) runtimeAlert = `<div class="runtime-alert" role="alert"><span>!</span><div><b>分类功能需要新版 LilyMap 后端</b><small>请关闭旧 LilyMap 进程，重新运行 npm run admin 后刷新页面。</small></div></div>`;
        if (state.view === 'friends' && state.status && Number(state.status.apiVersion || 0) < 4) runtimeAlert = `<div class="runtime-alert" role="alert"><span>!</span><div><b>友链管理需要新版 LilyMap 后端</b><small>请关闭旧 LilyMap 进程，重新运行 npm run admin 后刷新页面。</small></div></div>`;
        if (state.view === 'profile' && state.status && Number(state.status.apiVersion || 0) < 5) runtimeAlert = `<div class="runtime-alert" role="alert"><span>!</span><div><b>个人资料管理需要新版 LilyMap 后端</b><small>请重启 LilyMap 后端并刷新页面。</small></div></div>`;
        return `<header class="top"><div><span class="top-kicker">LilyMap Workspace</span><h1>${title}</h1><p>${sub}</p></div><div class="actions">${actions}<button class="btn icon" id="theme" type="button" title="切换明暗" aria-label="切换明暗主题">◐</button></div></header>${runtimeAlert}`;
      }
      function bindCommon() {
        $("#theme")?.addEventListener("click", () => {
          state.theme = state.theme === "light" ? "dark" : "light";
          localStorage.setItem("desk-theme", state.theme);
          document.documentElement.dataset.theme = state.theme;
        });
      }
      function overview() {
        let s = state.status || { changes: [] },
          draft = state.posts.filter((p) => p.draft).length,
          lanUrl = s.blogLanUrl || s.preview?.lanUrl || "";
        $("#main").innerHTML =
          page("概览", "今天只需要知道下一步要做什么。") +
          `<section class="quick"><button id="import-action"><strong>导入文章</strong><span>从 Typora 或 Markdown 开始</span></button><button data-go="articles"><strong>管理文章</strong><span>编辑元数据与发布状态</span></button><button data-go="appearance"><strong>调整外观</strong><span>壁纸、头像与显示效果</span></button><button id="open-blog"><strong>预览博客</strong><span>查看本地最终效果</span></button></section><section class="section"><h2>当前状态</h2><div class="status"><div><b><span class="dot">●</span> Hugo ${s.blogRunning ? "Running" : "未检测到"}</b><small>电脑：${s.blogUrl || "http://localhost:1414/"}${lanUrl ? `<br>手机：${esc(lanUrl)}` : ""}</small></div><div><b>✓ Build</b><small>使用固定 Hugo 工具本地构建</small></div><div><b>Git ${s.changes?.length || 0} Changes</b><small>${esc(s.branch || "main")}</small></div><div><b>Draft ${draft}</b><small>可在文章页集中管理</small></div></div></section>${lanUrl ? `<section class="section"><h2>设备预览</h2><div class="toolbar"><button class="btn" id="copy-lan"><strong>复制手机地址</strong> · ${esc(lanUrl)}</button></div></section>` : ""}<section class="section"><h2>最近文章</h2><div class="list">${state.posts.slice(0, 5).map(row).join("")}</div></section>`;
        $("#import-action").onclick = showImporter;
        $("#open-blog").onclick = () =>
          window.open(
            (state.status && state.status.blogUrl) || "http://localhost:1414/",
            "_blank",
            "noopener",
          );
        $("#copy-lan")?.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(lanUrl);
            toast("地址已复制；首次使用请运行 scripts/enable-lan-preview.ps1 并确认 UAC。\n手机和电脑需连接同一 Wi-Fi。");
          } catch {
            toast(`手机访问：${lanUrl}`);
          }
        });
        document.querySelectorAll("[data-go]").forEach(
          (b) =>
            (b.onclick = () => {
              setView(b.dataset.go);
            }),
        );
        bindRows();
        bindCommon();
      }
      function row(p) {
        return `<div class="row" data-path="${esc(p.path)}"><div><b>${esc(p.title)}</b><span class="path">${esc(p.path)}</span></div><span>${esc(String(p.date || "—").slice(0, 10))}</span><span class="hide-sm">${
          (p.tags || [])
            .slice(0, 3)
            .map((t) => `<i class="tag">#${esc(t)}</i>`)
            .join("") || "—"
        }</span><span>${p.draft ? '<i class="badge draft">草稿</i>' : '<i class="badge">发布</i>'}${p.protected ? ' <i class="badge protected">Protected</i>' : ""}</span></div>`;
      }
      function bindRows() {
        document
          .querySelectorAll("[data-path]")
          .forEach((e) => (e.onclick = () => openArticle(e.dataset.path)));
      }
      function articles() {
        let q = state.query || "",
          list = state.posts.filter((p) =>
            `${p.title} ${p.path} ${(p.tags || []).join(" ")}`
              .toLowerCase()
              .includes(q.toLowerCase()),
          );
        $("#main").innerHTML =
          page(
            "文章",
            "管理文章属性与 Page Bundle；正文仍由 Typora 完成。",
            `<button class="btn" id="new-page">新建页面</button><button class="btn primary" id="import-top">导入 Markdown</button>`,
          ) +
          `<div class="toolbar"><input id="search" placeholder="标题、标签或文件名" value="${esc(q)}"><button class="btn" id="draft-filter">${state.onlyDraft ? "显示全部" : "仅草稿"}</button></div><div class="list">${
            list
              .filter((p) => !state.onlyDraft || p.draft)
              .map(row)
              .join("") || '<div class="empty">没有匹配文章。</div>'
          }</div>`;
        $("#search").oninput = (e) => {
          state.query = e.target.value;
          articles();
        };
        $("#draft-filter").onclick = () => {
          state.onlyDraft = !state.onlyDraft;
          articles();
        };
        $("#import-top").onclick = showImporter;
        $('#new-page').onclick = async () => {
          const title = window.prompt('页面标题（例如：项目）');
          if (!title?.trim()) return;
          const slug = window.prompt('页面路径（例如：projects，对应 /projects/）');
          if (!slug?.trim()) return;
          try {
            const result = await api('/api/pages', { method: 'POST', body: JSON.stringify({ title: title.trim(), slug: slug.trim() }) });
            toast('页面已创建为草稿，可在文章列表中编辑源码。');
            await refresh();
            await openArticle(result.path);
          } catch (error) { toast(error.message); }
        };
        bindRows();
        bindCommon();
      }
      async function drawers() {
        if (!state.drawerData) {
          try { state.drawerData = await api('/api/drawers'); }
          catch (error) { $('#main').innerHTML = page('分类抽屉', '无法加载分类数据。') + `<div class="empty">${esc(error.message)}。请检查 LilyMap 后端是否已重启。</div>`; bindCommon(); return; }
        }
        renderDrawers();
      }
      function renderDrawers() {
        const listScroll = document.querySelector('.drawer-article-list')?.scrollTop || 0;
        const data = state.drawerData;
        const collection = data.drawers;
        const selected = collection.find((item) => item.id === state.drawerEditId) || collection[0];

      async function collectDropFiles(dt) {
        let out = [];
        let entries = [...(dt.items || [])]
          .map((i) => {
            try {
              return i.webkitGetAsEntry && i.webkitGetAsEntry();
            } catch {
              return null;
            }
          })
          .filter(Boolean);
        if (entries.length) {
          for (let en of entries) await walkDropEntry(en, "", out);
          if (out.length) return out;
        }
        return [...dt.files].map((f) => ({
          file: f,
          relativePath: f.webkitRelativePath || f.name,
        }));
      }
      async function walkDropEntry(en, prefix, out) {
        if (en.isFile) {
          let f = await new Promise((r, j) => en.file(r, j));
          out.push({ file: f, relativePath: prefix + en.name });
        } else if (en.isDirectory) {
          let rd = en.createReader();
          let batch;
          do {
            batch = await new Promise((r, j) => rd.readEntries(r, j));
            for (let ce of batch)
              await walkDropEntry(ce, prefix + en.name + "/", out);
          } while (batch.length);
        }
      }

            payload.push({
              name: file.name,
              relativePath:
                f.relativePath || file.webkitRelativePath || file.name,
              type: file.type,
              content: await as64(file),
            });
            updateOperation(operation, `正在读取文件 ${payload.length}/${files.length}`);
          }
          state.import = { payload };
          await runInspect();
        } catch (e) {
          toast(e.message);
        } finally { endOperation(operation); }
      }

        let settings = state.settings?.values || {};
        let isGif = file.type === "image/gif" || /\.gif$/i.test(file.name);
        if (settings["params.performance.optimizeUploads"] === false || isGif) {
          return { body: file, name: file.name, before: file.size, after: file.size, optimized: false };
        }
        let preset = settings["params.performance.imageQuality"] || "high";
        let profiles = {
          compact: { maxEdge: 1920, quality: 0.74 },
          high: { maxEdge: 2560, quality: 0.82 },
          ultra: { maxEdge: 3200, quality: 0.9 },
        };
        let profile = profiles[preset] || profiles.high;
        if (target === "avatar") profile = { ...profile, maxEdge: Math.min(profile.maxEdge, 768) };
        let bitmap;
        try {
          bitmap = await createImageBitmap(file, { imageOrientation: "from-image" });
        } catch {
          // 浏览器暂时无法解码的合法格式（常见于较旧内核的 AVIF）仍可原样保存；
          // 服务端会继续做文件签名校验，不因优化失败而误伤正常素材。
          return { body: file, name: file.name, before: file.size, after: file.size, optimized: false };
        }
        let scale = Math.min(1, profile.maxEdge / Math.max(bitmap.width, bitmap.height));
        let canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(bitmap.width * scale));
        canvas.height = Math.max(1, Math.round(bitmap.height * scale));
        let context = canvas.getContext("2d", { alpha: true });
        context.imageSmoothingEnabled = true;
        context.imageSmoothingQuality = "high";
        context.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
        bitmap.close?.();
        let blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/webp", profile.quality));
        if (!blob) throw new Error("浏览器无法生成 WebP，请换用 PNG 或 JPG 后重试。");
        let useOptimized = blob.size <= file.size * 1.05;
        let body = useOptimized ? blob : file;
        let extension = useOptimized ? "webp" : (file.name.split(".").pop() || "png").toLowerCase();
        return {
          body,
          name: `${target}-${Date.now()}.${extension}`,
          before: file.size,
          after: body.size,
          optimized: useOptimized,
          dimensions: `${canvas.width}×${canvas.height}`,
        };
      }
      async function uploadAsset(e, target) {
        let f = e.target.files[0];
        if (!f) return;
        const mediaOperation = beginOperation("正在准备媒体文件");
        try {
          let isVideo = f.type.startsWith("video/") || /\.(mp4|webm|mov|m4v|mkv|avi)$/i.test(f.name);
          if (isVideo) {
            if (target === "avatar") throw new Error("头像只支持图片；动态壁纸请上传到日间或夜间。");
            if (f.size > 160 * 1024 * 1024) throw new Error("视频超过 160 MB，请改用下方“从本机完整路径导入”。");
            toast("正在上传并转换视频，请保持 LilyMap 页面打开…");
            let response = await trackedFetch(
              "/api/media/upload?name=" + encodeURIComponent(f.name) + "&target=" + encodeURIComponent(target),
              { method: "POST", headers: { "content-type": f.type || "application/octet-stream" }, body: f },
              "正在上传并转换视频",
            );
            let result = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(result.error || "视频上传失败。");
            setAppearanceMedia(target, result.path);
            let saving = result.sourceSize > 0 ? Math.max(0, Math.round((1 - result.outputSize / result.sourceSize) * 100)) : 0;
            toast(`视频已优化 ${readableBytes(result.sourceSize)} → ${readableBytes(result.outputSize)}${saving ? `（-${saving}%）` : ""}；点击“应用外观”生效。`);
            return;
          }
          toast(/\.gif$/i.test(f.name) || f.type === "image/gif" ? "正在读取 GIF，动画帧会原样保留…" : "正在本机优化图片…");
          let prepared = await optimizeAppearanceImage(f, target);
          let area = prepared.optimized
            ? `static/assets/img/optimized/${target === "avatar" ? "avatars" : "wallpapers"}`
            : "static/assets/img";
          let r = await trackedFetch(
            "/api/asset/upload?name=" +
              encodeURIComponent(prepared.name) +
              "&area=" + encodeURIComponent(area),
            { method: "POST", headers: { "content-type": prepared.body.type || f.type }, body: prepared.body },
            "正在上传优化后的图片",
          );
          let j = await r.json();
          if (!r.ok) throw new Error(j.error || "上传失败。");
          let newPath = j.path;
          setAppearanceMedia(target, newPath);
          let saving = prepared.before > 0 ? Math.max(0, Math.round((1 - prepared.after / prepared.before) * 100)) : 0;
          toast(prepared.optimized
            ? `已优化 ${readableBytes(prepared.before)} → ${readableBytes(prepared.after)}（-${saving}% · ${prepared.dimensions}）；点击「应用外观」生效。`
            : `已上传 ${f.name}；点击「应用外观」生效。`);
        } catch (error) {
          let message = /未知 API|Unknown API/i.test(error.message || "")
            ? "当前是旧版 LilyMap 后端。请关闭 LilyMap 终端并重新运行 npm run admin。"
            : error.message || "媒体处理失败。";
          toast(message);
        } finally {
          endOperation(mediaOperation);
          e.target.value = "";
        }
      }
      async function publish() {
        let s = await api("/api/publish/status");
        let ok = s.tokenPresent && s.remoteOk && s.workflowPresent;
        let chg = s.changes.length;
        let card = (a, b) => {
          let on = a === true,
            c = a === false ? "danger" : "";
          return `<div><b class="${c}">${b}</b><small>${a === true ? "已就绪" : a === false ? "未就绪" : a}</small></div>`;
        };
        $("#main").innerHTML =
          page(
            "发布",
            "把 Hugo 源码推送到选定的 GitHub 仓库，触发仓库中的构建工作流。",
            `<button class="btn" id="pub-refresh">刷新状态</button>`,
          ) +
          `<div class="publish-setup"><section class="section"><span class="publish-step">01 / DESTINATION</span><h2>发布目标</h2><p class="muted">选择你有写入权限的 GitHub 仓库；仓库中还需配置适用的构建工作流。</p><label class="field"><span>GitHub 仓库地址</span><input id="pub-target" value="${esc(s.allowedRemote)}" placeholder="https://github.com/owner/repo.git" autocomplete="off" spellcheck="false"></label><p><button class="btn" id="pub-target-save" type="button">保存发布目标</button></p></section><section class="section"><span class="publish-step">02 / CREDENTIAL</span><h2>认证令牌</h2><p class="muted">只写入本机忽略的 .token 文件，不会回显、导出或提交到 Git。更换时输入新令牌即可。</p><label class="field"><span>GitHub Token · ${s.tokenPresent ? "已配置" : "未配置"}</span><input id="pub-token" type="password" autocomplete="new-password" spellcheck="false" placeholder="粘贴新的 token（留空表示不更改）"></label><p><button class="btn" id="pub-token-save" type="button">保存认证令牌</button></p></section></div><section class="section"><span class="publish-step">03 / READINESS</span><h2>部署前置检查</h2><div class="status">${card(ok, "整体就绪")}${card(s.remoteOk, "目标仓库 " + esc(s.allowedRemote))}${card(s.tokenPresent, "认证 token")}${card(s.systemProxyDetected ? "已接入" : "直连", "GitHub 网络")}${card(s.workflowPresent, "Actions Workflow")}${card("分支 " + esc(s.branch), "当前分支")}${card(chg + " 处变更", "工作区")}</div></section><section class="section"><h2>本次推送内容</h2><pre class="path">${esc(s.changes.map((x) => x.status.padEnd(3) + " " + x.path).join("\n") || "（工作区干净，无新增变更）")}</pre></section><section class="section"><span class="publish-step">04 / DEPLOY</span><h2>发布操作</h2><p class="muted">提交信息可选；留空使用默认信息。普通发布会先同步远程 main；强制替换只用于你明确要覆盖目标仓库时。</p><label class="field"><span>提交信息</span><input id="pub-msg" placeholder="e.g. chore: publish blog updates"></label><p><button class="btn primary" id="pub-go">发布</button> <button class="btn danger" id="pub-force">⚠ 首次上线（强制替换）</button></p><div class="publish-progress" id="pub-progress" role="status" aria-live="polite" aria-atomic="true" hidden><div class="publish-progress__head"><b id="pub-stage">正在准备发布</b><span id="pub-percent">0%</span></div><div class="publish-progress__track" id="pub-track" role="progressbar" aria-label="发布进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i class="publish-progress__bar" id="pub-bar"></i></div><p id="pub-detail">正在连接发布服务…</p></div><p class="muted">发布会自动沿用 Windows 系统代理，并推送到上方选定的仓库。</p></section>`;
        bindCommon();
        $("#pub-refresh").onclick = () => publish();
        $('#pub-target').closest('.section').querySelector('label.field').insertAdjacentHTML('afterend', `<label class="field"><span>目标分支</span><input id="pub-branch" value="${esc(s.allowedBranch || 'main')}" autocomplete="off" spellcheck="false" placeholder="main"></label>`);
        $('#pub-target-save').onclick = async () => {
          const remote = $('#pub-target').value.trim();
          const branch = $('#pub-branch').value.trim();
          if (!confirm(`将 LilyMap 发布目标改为 ${remote} 的 ${branch} 分支？`)) return;
          try { await api('/api/publish/target', { method: 'PUT', body: JSON.stringify({ remote, branch }) }); toast('发布目标已保存到本机。'); await publish(); }
          catch (error) { toast(error.message); }
        };
        $('#pub-token-save').onclick = async () => {
          const token = $('#pub-token').value.trim();
          if (!token) return toast('请先输入新的认证令牌。');
          if (!confirm('替换本机的 GitHub 认证令牌？旧令牌将被覆盖。')) return;
          try {
            await api('/api/publish/token', { method: 'PUT', body: JSON.stringify({ token }) });
            $('#pub-token').value = '';
            toast('认证令牌已保存到本机。');
            await publish();
          } catch (error) { $('#pub-token').value = ''; toast(error.message); }
        };
        const progressBox = $("#pub-progress");
        const setBusy = (busy) => {
          $("#pub-go").disabled = busy;
          $("#pub-force").disabled = busy;
          $("#pub-msg").disabled = busy;
          if (!busy) {
            $("#pub-force").dataset.armed = "";
            $("#pub-force").textContent = "⚠ 首次上线（强制替换）";
          }
        };
        const showProgress = (job) => {
          if (!job) return;
          const progress = Math.max(0, Math.min(100, Number(job.progress) || 0));
          progressBox.hidden = false;
          progressBox.classList.toggle("is-complete", job.status === "complete");
          progressBox.classList.toggle("is-failed", job.status === "failed");
          $("#pub-stage").textContent = job.stage || "正在发布";
          $("#pub-percent").textContent = `${Math.round(progress)}%`;
          $("#pub-track").setAttribute("aria-valuenow", String(Math.round(progress)));
          $("#pub-bar").style.transform = `scaleX(${progress / 100})`;
          $("#pub-detail").textContent = job.status === "failed"
            ? job.error || "发布未完成，请检查配置后重试。"
            : job.status === "complete"
              ? `${job.message || "源码已推送。"} GitHub Actions 已接手线上构建。`
              : job.force
                ? "首次上线模式：完成前请不要关闭 LilyMap。"
                : `正在安全提交并同步 ${s.allowedBranch || 'main'} 分支，请不要重复点击。`;
        };
        const track = async (id) => {
          const tracker = ++publishTracker;
          while (tracker === publishTracker && state.view === "publish") {
            try {
              const job = await api(`/api/publish/progress?id=${encodeURIComponent(id)}`, { silentProgress: true });
              showProgress(job);
              if (job.status !== "running") {
                setBusy(false);
                toast(job.status === "complete" ? "发布完成，GitHub Actions 正在构建。" : `发布失败：${job.error || "未知错误"}`);
                return;
              }
            } catch (error) {
              showProgress({ status: "failed", progress: Number($("#pub-track").getAttribute("aria-valuenow")), stage: "无法读取发布进度", error: error.message });
              setBusy(false);
              return;
            }
            await new Promise((resolve) => setTimeout(resolve, 450));
          }
        };
        async function run(force) {
          let msg = $("#pub-msg").value.trim();
          if (
            force &&
            !confirm(
              "这会把线上 main 强制替换为当前 Hugo 源码。\n确定要继续吗？",
            )
          )
            return;
          if (force && $("#pub-force").dataset.armed !== "1") {
            $("#pub-force").dataset.armed = "1";
            $("#pub-force").textContent = "再次点击确认强制替换";
            return;
          }
          setBusy(true);
          showProgress({ status: "running", progress: 1, stage: "正在连接发布服务", force });
          try {
            const job = await api("/api/publish", {
              method: "POST",
              body: JSON.stringify({ commit: msg, force }),
              silentProgress: true,
            });
            showProgress(job);
            track(job.id);
          } catch (error) {
            showProgress({ status: "failed", progress: 1, stage: "发布未能开始", error: error.message });
            setBusy(false);
            toast("发布失败：" + error.message);
          }
        }
        $("#pub-go").onclick = () => run(false);
        $("#pub-force").onclick = () => run(true);
        if (s.publishJob) {
          showProgress(s.publishJob);
          if (s.publishJob.status === "running") {
            setBusy(true);
            track(s.publishJob.id);
          }
        }
      }
      async function render() {
        nav();
        if (state.view === "overview") overview();
        else if (state.view === "articles") articles();
        else if (state.view === "drawers") await drawers();
        else if (state.view === "friends") await friends();
        else if (state.view === "profile") await profile();
        else if (state.view === "import") importPage();
        else if (state.view === "layouts") await layouts();
        else if (state.view === "modules") await modules();
        else if (state.view === "appearance") await appearance();
        else if (state.view === "resources") await resources();
        else if (state.view === "settings") await settings();
        else if (state.view === "publish") await publish();
        else version();
      }
      document.querySelectorAll("#nav button").forEach(
        (b) =>
          (b.onclick = () => {
            setView(b.dataset.view);
          }),
      );
      $("#file-picker").onchange = (e) => readFiles([...e.target.files]);
      $("#folder-picker").onchange = (e) => readFiles([...e.target.files]);
      refresh().catch((e) => {
        $("#main").innerHTML =
          '<div class="empty">无法连接 lilymap API：' +
          esc(e.message) +
          "</div>";
      });
    </script>
  </body>
</html>
