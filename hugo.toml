baseURL = "https://lily2663.top/"
locale = "zh-CN"
defaultContentLanguage = "zh-cn"
title = "lily'epitaph"
theme = "lily-epitaph"
timeZone = "Asia/Shanghai"
enableRobotsTXT = true
hasCJKLanguage = true
ignoreLogs = ["warning-goldmark-raw-html"]

[pagination]
  pagerSize = 10

[params]
subtitle = "the house of the dead"
description = "记录"
author = "lilyzero"
avatar = "/assets/img/optimized/b_d06ff1a0814bc6d063e847e30ce0fd8b.webp"

[params.theme]
accent = "#7fb5b0"
accentLight = "#a8d5d1"
paper = "#fafaf8"
panel = "#ffffff"
ink = "#2c3e50"
codeBackground = "#f8f9fa"
fontPreset = "editorial"
webFonts = false
readingWidth = "standard"

[params.welcome]
enabled = true
background = "/assets/img/optimized/wallpapers/welcome-1789547451700.webp"
backgroundDark = "/assets/img/optimized/wallpapers/night-1789542813605.webp"
backgroundFit = "cover"
backgroundEffect = "original"
titleBefore = "Welcome to "
accent = "Lily's"
titleAfter = " House"
subtitle = "the house of the dead"
enterText = "Enter"
hint = "Press any key or click to enter"
particles = 30

[params.pet]
enabled = true
image = "/assets/img/optimized/pet/tuanzi.webp"

[params.mobileHub]
enabled = true
defaultModule = "profile"
rememberTab = true
petSize = 88
panelHeight = 68

[params.layout.desktop]
pageWidth = 1200
pageGutter = 24
cardPaddingAdjust = 0
cardGapAdjust = 0
cardRadius = 12

[params.layout.mobile]
pageGutter = 16
cardPaddingAdjust = 0
cardGapAdjust = 0
cardRadius = 12
headerLayout = "compact"
headerTitleSize = 22
headerPadding = 4
showHeaderDate = true
showHeaderSubtitle = true

[params.performance]
offlineCache = true
optimizeUploads = true
imageQuality = "high"

[params.search]
enabled = true

[params.protected]
enabled = true

[params.article]
toc = true
codeCopy = true

[params.comments]
enabled = false
api = "https://api.lily2663.top"

[params.footer]
copyright = "用 Hugo 驱动的技术博客"
note = "喵喵喵"

[params.features]
prefetch = true
viewTransition = true

[[menus.main]]
  name = "首页"
  url = "/"
  weight = 10

[[menus.main]]
  name = "分类"
  url = "/categories/"
  weight = 15

[[menus.main]]
  name = "友链"
  url = "/links/"
  weight = 20

[[menus.main]]
  name = "关于"
  url = "/about/"
  weight = 30
[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false
  [markup.highlight]
    noClasses = false
    lineNos = false
    codeFences = true
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 6
    ordered = false

[sitemap]
  changefreq = "weekly"
  priority = 0.5

[caches]
  [caches.images]
    dir = ":cacheDir/images"
