baseURL = "https://lily2663.top/"
locale = "zh-CN"
defaultContentLanguage = "zh-cn"
title = "lily'epitaph"
theme = "lily-epitaph"
timeZone = "Asia/Shanghai"
enableRobotsTXT = true
hasCJKLanguage = true
paginate = 12
ignoreLogs = ["warning-goldmark-raw-html"]

[params]
subtitle = "the house of the dead"
description = "记录"
author = "lilyzero"
avatar = "/assets/img/mmexport1768138528389.jpg"

[params.theme]
accent = "#7FB5B0"
accentLight = "#A8D5D1"
paper = "#FAFAF8"
panel = "#FFFFFF"
ink = "#2C3E50"
codeBackground = "#F8F9FA"
fontPreset = "editorial"
readingWidth = "standard"

[params.welcome]
enabled = true
background = "/assets/img/【哲风壁纸】书屋-大海-晴天.jpg"
backgroundDark = "/lily-epitaph/night-watercolor.jpg"
  titleBefore = "Welcome to "
accent = "Lily's"
  titleAfter = " House"
  subtitle = "the house of the dead"
enterText = "Enter"
  hint = "Press any key or click to enter"
particles = 30

[params.pet]
enabled = true
  image = "/assets/img/pet/tuanzi.png"

[params.search]
enabled = true

[params.protected]
  enabled = true

[params.article]
toc = true
codeCopy = true

[params.comments]
enabled = false
  api = "https://api.lily2663.top"

[params.footer]
copyright = "用 Hugo 驱动的技术博客"
note = "喵喵喵"

[params.features]
prefetch = true
viewTransition = true

[[menus.main]]
  name = "首页"
  url = "/"
  weight = 10

[[menus.main]]
  name = "友链"
  url = "/links/"
  weight = 20

[[menus.main]]
  name = "关于"
  url = "/about/"
  weight = 30
[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false
  [markup.highlight]
    noClasses = false
    lineNos = false
    codeFences = true
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 6
    ordered = false

[sitemap]
  changefreq = "weekly"
  priority = 0.5

[caches]
  [caches.images]
    dir = ":cacheDir/images"
