apiVersion: lily-module/v1
id: weather
name: Weather
version: 1.0.0
category: live
icon: "☁"
description: 使用 Open-Meteo 显示当前位置或指定坐标的实时天气；不需要 API 密钥。
context: any
allowedSlots:
  - home.sidebar
  - home.main
  - page.sidebar
  - page.main
  - article.sidebar
  - article.after
template:
  partial: lily/modules/weather/render.html
assets:
  scripts:
    - lily/modules/weather.js
  styles:
    - lily/modules/weather.css
capabilities:
  network:
    - https://api.open-meteo.com
defaults:
  title: 天气
  latitude: 31.2304
  longitude: 121.4737
  unit: celsius
schema:
  title:
    type: string
    label: 标题
    help: 例如“上海天气”或“当前位置”。
  latitude:
    type: number
    label: 纬度
    min: -90
    max: 90
    step: 0.0001
    help: 天气位置纬度，范围 -90 到 90。
  longitude:
    type: number
    label: 经度
    min: -180
    max: 180
    step: 0.0001
    help: 天气位置经度，范围 -180 到 180。
  unit:
    type: select
    label: 温度单位
    help: 国内日常使用建议选择摄氏度。
    options:
      - value: celsius
        label: 摄氏 °C
      - value: fahrenheit
        label: 华氏 °F
