apiVersion: lily-module/v1
id: music
name: Lily Radio
version: 2.0.0
category: media
icon: "♫"
description: 薄荷色歌单播放器，支持网易云歌单快照和站内/公开音频。
context: any
allowedSlots:
  - home.sidebar
  - page.sidebar
  - article.sidebar
template:
  partial: lily/modules/music/render.html
assets:
  styles:
    - lily/modules/music.css
  scripts:
    - lily/modules/music.js
capabilities:
  audio: true
  playlist: true
  neteaseSnapshot: true
defaults:
  title: Lily Radio
  artist: ""
  source: ""
  cover: ""
  playlistId: ""
  showPlaylist: true
  rememberPlayback: true
schema:
  title:
    type: string
    label: 曲名
    help: 播放器主标题。
  artist:
    type: string
    label: 作者 / 专辑
    help: 可留空。
  source:
    type: url
    label: 音频地址
    help: 填写 /assets/... 本地路径或 https:// 地址；留空时显示配置提示。
  cover:
    type: url
    label: 封面地址
    help: 可选，填写站内图片路径或 https:// 图片地址。
  playlistId:
    type: string
    label: 网易云歌单 ID
    help: 先在 LilyMap 模块库中安全导入歌单，再填写这里；Cookie 不会进入博客。
  showPlaylist:
    type: boolean
    label: 显示播放列表
    help: 允许访客展开并切换曲目。
  rememberPlayback:
    type: boolean
    label: 记住播放位置
    help: 只保存在访客自己的浏览器中。
