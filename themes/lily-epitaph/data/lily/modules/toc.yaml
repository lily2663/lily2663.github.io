id: toc
name: TOC
version: 0.1.0
type: content
description: 文章目录，读取 Hugo .TableOfContents；无目录或非文章页不渲染
context: article
allowedSlots:
  - article.sidebar
template:
  partial: lily/modules/toc/render.html
defaults:
  title: 目录 · Contents
  position: sticky
  offset: 100
schema:
  title:
    type: string
    label: 目录标题
    help: 显示在文章目录上方。
  position:
    type: select
    label: 滚动位置
    help: 跟随阅读最适合长文章；手机端会自动回到普通文档流。
    options:
      - value: sticky
        label: 跟随阅读（Sticky）
      - value: flow
        label: 随正文离开（Flow）
      - value: fixed
        label: 固定视口（Fixed）
  offset:
    type: number
    label: 最小顶部间距（px）
    min: 0
    max: 400
    step: 4
    help: 桌面端会自动避开实际页眉高度；填写更大的数值可继续下移。手机端使用正文前的折叠目录。
