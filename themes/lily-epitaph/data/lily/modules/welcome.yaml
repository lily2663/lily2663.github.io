id: welcome
name: Welcome
version: 0.1.0
type: block
description: 首页欢迎屏（水彩进入动画），配置与 params.welcome 兼容
context: home
allowedSlots:
  - home.hero
template:
  partial: lily/modules/welcome/render.html
defaults:
  enabled: true
  background: ""
  titleBefore: Welcome to
  accent: Lily's
  titleAfter: " House"
  subtitle: the house of the dead
  enterText: Enter
  hint: Press any key or click to enter
  particles: 30
schema:
  background:
    type: url
    label: 欢迎页背景
    help: 填写站内图片路径或 https:// 地址；留空使用主题水彩背景。
  enabled:
    type: boolean
    label: 启用欢迎屏
  titleBefore:
    type: string
    label: 标题前缀
  accent:
    type: string
    label: 强调词
  titleAfter:
    type: string
    label: 标题后缀
  subtitle:
    type: string
    label: 副标题
  enterText:
    type: string
    label: 进入按钮文字
  hint:
    type: string
    label: 提示文字
  particles:
    type: number
    label: 粒子数量
    min: 0
    max: 100
    step: 1
    help: 数量越大动画越丰富，也会增加低性能设备负担；建议 20 到 40。
