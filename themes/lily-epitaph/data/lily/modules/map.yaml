apiVersion: lily-module/v1
id: map
name: Map
version: 1.0.0
category: embed
icon: "⌖"
description: 用 OpenStreetMap 嵌入一个可配置位置的地图。
context: any
allowedSlots:
  - home.main
  - home.sidebar
  - page.main
  - page.sidebar
  - article.after
  - article.sidebar
template:
  partial: lily/modules/map/render.html
assets:
  styles:
    - lily/modules/map.css
capabilities:
  iframe:
    - https://www.openstreetmap.org
defaults:
  title: 地图
  latitude: 31.2304
  longitude: 121.4737
  zoom: 12
schema:
  title:
    type: string
    label: 标题
    help: 显示在地图上方；留空可隐藏标题。
  latitude:
    type: number
    label: 纬度
    min: -90
    max: 90
    step: 0.0001
    help: 目标位置纬度，范围 -90 到 90。
  longitude:
    type: number
    label: 经度
    min: -180
    max: 180
    step: 0.0001
    help: 目标位置经度，范围 -180 到 180。
  zoom:
    type: number
    label: 缩放级别
    min: 1
    max: 19
    step: 1
    help: 1 显示全球，数字越大越接近街道。
