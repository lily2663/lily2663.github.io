id: recent-posts
name: Recent Posts
version: 0.1.0
type: content
description: 文章列表，每页 10 篇并自动生成翻页
context: home
allowedSlots:
  - home.main
template:
  partial: lily/modules/recent-posts/render.html
defaults:
  title: 全部文章
  section: posts
  limit: 0
  showCount: true
schema:
  title:
    type: string
    label: 区块标题
  section:
    type: string
    label: 内容分区
  limit:
    type: number
    label: 文章总数上限（0 = 全部）
    min: 0
    max: 1000
    step: 1
    help: 建议保持 0，展示所有文章并按每页 10 篇翻页。大于 0 会截断文章总数。
  showCount:
    type: boolean
    label: 显示篇数
