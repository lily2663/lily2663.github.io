id: tags
name: Tags
version: 0.1.0
type: block
description: 标签云，Hugo Taxonomy 驱动（site.Taxonomies.tags）
context: any
allowedSlots:
  - home.sidebar
  - article.sidebar
  - page.sidebar
  - page.main
  - home.main
  - article.after
template:
  partial: lily/modules/tags/render.html
assets:
  styles:
    - lily/modules/tags.css
defaults:
  title: 标签
  limit: 0
  showCount: true
  sort: count
schema:
  title:
    type: string
    label: 区块标题
  limit:
    type: number
    label: 数量限制（0 = 全部）
    min: 0
    max: 1000
    step: 1
    help: 侧栏建议 20 到 30，0 表示全部。
  showCount:
    type: boolean
    label: 显示文章数
  sort:
    type: select
    label: 排序
    options:
      - value: count
        label: 按文章数
      - value: name
        label: 按名称
