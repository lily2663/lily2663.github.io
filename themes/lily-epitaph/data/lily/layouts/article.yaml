kind: article
title: "文章页"
description: "文章页由 4 个 slot 组合"
slotOrder: [header, main, sidebar, after]
slots:
  header:
    - id: article-meta
      module: article-meta
  main:
    - id: article-content
      module: article-content
  sidebar:
    - id: article-toc
      module: toc
    - id: article-quote
      module: quote
      enabled: false
    - id: article-weather
      module: weather
      enabled: false
    - id: article-music
      module: music
      enabled: false
    - id: article-profile
      module: profile
      enabled: false
    - id: article-tags
      module: tags
      enabled: false
  after:
    - id: article-comments
      module: comments
    - id: article-map
      module: map
      enabled: false
