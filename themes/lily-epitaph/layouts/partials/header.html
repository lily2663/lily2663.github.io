{{ $active := .RelPermalink }}
<header class="site-header">
  <div class="masthead container">
    <div class="masthead-top"><span class="masthead-edition">{{ now.Format "2006年1月2日" }}</span></div>
    <a class="masthead-title" href="/">{{ .Site.Title }}</a>
    <div class="masthead-sub">{{ .Site.Params.subtitle }}</div>
  </div>
  <div class="topbar container">
    <nav class="nav" aria-label="主导航">
      {{ range .Site.Menus.main }}<a href="{{ .URL | relURL }}" {{ if eq (.URL | relURL) $active }}aria-current="page"{{ end }}>{{ .Name }}</a>{{ end }}
    </nav>
    <div class="header-actions">
      {{ if .Site.Params.search.enabled }}
      <div class="search-box">
        <div class="search-mode" role="tablist" aria-label="搜索模式">
          <button class="search-mode-btn active" type="button" data-search-mode="article" role="tab" aria-selected="true">文章</button>
          <button class="search-mode-btn" type="button" data-search-mode="text" role="tab" aria-selected="false">文字</button>
        </div>
        <label class="sr-only" for="search">搜索博客</label>
        <input id="search" class="search" type="search" placeholder="搜索文章标题/标签…" autocomplete="off" aria-controls="post-grid" aria-describedby="search-status">
        <span class="sr-only" id="search-status" aria-live="polite"></span>
      </div>
      {{ end }}
      <button id="theme-toggle" class="icon-btn theme-toggle" type="button" aria-label="切换主题">
        <svg class="tt-icon tt-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="tt-icon tt-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
    </div>
  </div>
</header>
