<section class="about"><img class="avatar-img" src="{{ hugo.Data.site.avatar }}" alt="{{ hugo.Data.site.author }} 的头像"><h1>关于本站</h1>{{ range hugo.Data.site.about }}<p>{{ . }}</p>{{ end }}<p style="margin-top:18px">{{ range $index, $link := hugo.Data.site.links }}{{ if $index }} · {{ end }}<a href="{{ $link.url }}" target="_blank" rel="noopener noreferrer">{{ $link.label }}</a>{{ end }}</p></section><div class="github-stats" id="github-stats"><h3>代码统计</h3><div class="stats-loading">加载中</div></div>
