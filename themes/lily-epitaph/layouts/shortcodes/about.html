<section class="about">{{ with hugo.Data.site.avatar }}<img class="avatar-img" src="{{ . }}" alt="{{ hugo.Data.site.author | default site.Title }} 的头像">{{ end }}<h1>{{ hugo.Data.site.aboutTitle | default "关于本站" }}</h1>{{ range hugo.Data.site.about }}<p>{{ . }}</p>{{ end }}<p style="margin-top:18px">{{ range $index, $link := hugo.Data.site.links }}{{ if $index }} · {{ end }}<a href="{{ $link.url }}" target="_blank" rel="noopener noreferrer">{{ $link.label }}</a>{{ end }}</p></section>
