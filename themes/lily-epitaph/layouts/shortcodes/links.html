<section class="links">
  <h1 class="section-title">友链</h1>
  <div class="friend-grid">
    {{ range hugo.Data.site.friends }}
      <a class="friend-card" href="{{ .url }}" target="_blank" rel="noopener noreferrer">
        {{ if .avatar }}
          <img class="friend-avatar" src="{{ .avatar }}" alt="{{ .name }} 的头像" loading="lazy">
        {{ else }}
          <span class="friend-avatar friend-avatar--text" aria-hidden="true">{{ substr .name 0 1 }}</span>
        {{ end }}
        <div class="friend-meta"><div class="friend-name">{{ .name }}</div><div class="friend-desc">{{ .desc }}</div></div>
      </a>
    {{ end }}
  </div>
</section>
